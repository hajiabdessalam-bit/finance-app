<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#0B0918">
<meta name="color-scheme" content="dark">
<title>Plan</title>
<link rel="apple-touch-icon" href="apple-touch-icon.PNG">
<link rel="icon" type="image/png" href="apple-touch-icon.PNG">
<style>
:root{
  --void:#0B0918;--surface:#171531;--surface-2:#1E1B3C;--surface-3:#272348;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --majorelle:#7B72FF;--teal:#2FD4BC;--saffron:#FFB33D;--violet:#B08CFF;
  --coral:#FF7A5C;--rose:#FF5C8A;--sage:#8DA88F;--dim:#5A52D9;
  --text:#F2F0FF;--muted:#A29CC7;--faint:#7B75A6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--void)}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(58% 32% at 16% 0%,rgba(123,114,255,.19),transparent 70%),
  radial-gradient(46% 28% at 96% 10%,rgba(47,212,188,.09),transparent 70%),
  radial-gradient(70% 38% at 50% 103%,rgba(255,179,61,.06),transparent 70%)}
.scroll{position:relative;z-index:1;max-width:540px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 106px)}
input,select,button,textarea{font-family:inherit;color:var(--text)}
input,textarea{background:transparent;border:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--majorelle);outline-offset:3px;border-radius:6px}

.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.card-t{font-family:var(--round);font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}

.mbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mnav{width:38px;height:38px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;
  transition:transform .18s var(--spring);flex:none}
.mnav:active{transform:scale(.88)}
.mnav:disabled{opacity:.22}
.mnav svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mtitle{text-align:center}
.mtitle b{display:block;font-family:var(--round);font-size:20px;font-weight:800;letter-spacing:-.03em}
.mtitle span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.mtitle span.live{color:var(--teal)}

.greet{font-family:var(--round);font-size:15px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.verdict-h{font-family:var(--round);font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 0}
.verdict-s{font-size:13.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{width:100%;height:100%}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-family:var(--round);font-size:26px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.ring .mid span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.statcol{flex:1;display:flex;flex-direction:column;gap:11px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--round);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.ins{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ins:last-child{border-bottom:none;padding-bottom:0}
.ins .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:14px;flex:none;
  background:rgba(255,255,255,.05)}
.ins .tx{flex:1;font-size:13.5px;line-height:1.5}
.ins .tx em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:11px}
.ins b{font-weight:700}

.ms{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:none;padding-bottom:0}
.ms .badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--surface-2);filter:grayscale(1);opacity:.38}
.ms.on .badge{filter:none;opacity:1;background:rgba(255,179,61,.14)}
.ms .t{flex:1;font-size:14px;font-weight:600;color:var(--faint)}
.ms.on .t{color:var(--text)}
.ms .s{font-family:var(--mono);font-size:10px;color:var(--faint)}
.ms.on .s{color:var(--saffron)}
.streak{display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;
  background:rgba(255,179,61,.09);border:1px solid rgba(255,179,61,.24)}
.streak .n{font-family:var(--round);font-size:30px;font-weight:800;color:var(--saffron);letter-spacing:-.04em;line-height:1}
.streak .t{font-size:13px;color:var(--muted);line-height:1.45}

.eq{margin-top:2px}
.eqrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:14px}
.eqrow+.eqrow{border-top:1px solid var(--line)}
.eqrow .k{color:var(--muted)}
.eqrow .v{font-family:var(--round);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eqrow.total{margin-top:4px;border-top:1px solid var(--line-2);padding-top:14px}
.eqrow.total .k{color:var(--text);font-weight:600;font-size:15px}
.eqrow.total .v{font-size:26px}
.vs{font-family:var(--mono);font-size:11px;margin-top:9px;text-align:right}
.up{color:var(--teal)}.down{color:var(--coral)}

.salary-line{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.cur{font-family:var(--round);font-size:20px;font-weight:600;color:var(--majorelle);transform:translateY(-3px)}
#sal{font-family:var(--round);font-size:42px;font-weight:800;letter-spacing:-.045em;width:100%;padding:0;font-variant-numeric:tabular-nums}

/* ── hero salary card: ambient health glow ── */
.hero{position:relative;margin-top:12px;isolation:isolate}
.aura{position:absolute;inset:10% 12%;border-radius:60px;z-index:0;
  background:var(--hc);opacity:.30;filter:blur(40px);
  animation:breathe 7s var(--ease) infinite,bloom .9s var(--ease) both}
.aura.two{inset:26% 30%;filter:blur(56px);opacity:.22;animation-delay:-3.5s,0s}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.26}50%{transform:scale(1.14);opacity:.44}}
@keyframes bloom{from{opacity:0}}
.glass{position:relative;z-index:1;border-radius:26px;padding:22px;
  background:rgba(20,18,42,.62);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 50px -26px rgba(0,0,0,.85)}
.hero .salary-line{margin-top:10px}
.hstatus{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.hpill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border-radius:99px;
  background:var(--hc-soft);border:1px solid var(--hc-line);font-size:13px;font-weight:600;color:var(--hc)}
.hdot{width:8px;height:8px;border-radius:8px;background:currentColor;flex:none;
  box-shadow:0 0 0 0 currentColor;animation:ping 2.6s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--hc-soft)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hscore{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;white-space:nowrap}
.hscore b{color:var(--hc);font-weight:500}
.hwhy{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.aura,.hdot{animation:none}}

/* expandable detail, same tokens as .lab */
details.more{margin-top:12px}
details.more>summary{list-style:none;cursor:pointer;padding:7px 0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{color:var(--muted)}
details.more .eqrow{font-size:13px}
/* the amount you are considering — same type treatment as the salary hero */
.wiamt{font-family:var(--round);font-size:36px;font-weight:800;letter-spacing:-.042em;
  font-variant-numeric:tabular-nums;line-height:1;margin-top:7px;transition:color .3s var(--ease)}
.wiarrow{color:var(--faint);font-weight:400;margin:0 3px}

/* ── savings jars: each goal is its own object, with room around it ── */
.jarcard{position:relative;margin-top:22px;padding:19px 20px;border-radius:28px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 16px 34px -30px rgba(0,0,0,.85)}
.jarcard.lead{
  background:linear-gradient(168deg,rgba(255,255,255,.05),rgba(255,255,255,.006) 60%),var(--surface);
  border-color:var(--jc-line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 52px -32px var(--jc)}
.jarcard.quiet{background:rgba(21,19,44,.86);box-shadow:0 12px 28px -28px rgba(0,0,0,.8)}
.jarcard.quiet .jname{color:#E4E1F5}
.jhead{display:flex;align-items:center;gap:12px}
.jico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:21px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.jarcard.lead .jico{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 9px 22px -13px var(--jc)}
.jarcard.quiet .jico{opacity:.84}
.jmeta{flex:1;min-width:0}
.jname{font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.022em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-top:5px}
.jpc{font-family:var(--round);font-size:17px;font-weight:800;letter-spacing:-.03em;flex:none;
  font-variant-numeric:tabular-nums}
.jamt{font-family:var(--round);font-size:30px;font-weight:800;letter-spacing:-.036em;
  font-variant-numeric:tabular-nums;margin-top:15px;line-height:1}
.jof{font-size:12.5px;color:var(--muted);margin-top:4px}
.jbar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin-top:14px}
.jbar i{display:block;height:100%;border-radius:8px;transition:width .7s var(--ease)}
.jrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.jrow .r{color:var(--faint);white-space:nowrap}
.jdue{font-family:var(--mono);font-size:10.5px;margin-top:7px;letter-spacing:.02em}
/* ── hold-to-reorder ── */
.jarcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.jarcard.dragging{transition:none;z-index:8;opacity:.97;
  box-shadow:0 30px 60px -26px rgba(0,0,0,.95),0 0 0 1px var(--jc-line)}
.btn.ghost{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.nmin{flex:1;min-width:0;font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.02em;
  background:var(--surface-3);border-radius:11px;padding:9px 11px}
.duein{background:var(--surface-3);border-radius:13px;padding:10px 12px;font-family:var(--mono);
  font-size:13px;width:152px;text-align:right;color-scheme:dark}
.delg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--coral);opacity:.8;padding:4px 0}
.emrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.emrow button{width:42px;height:42px;border-radius:14px;background:var(--surface-3);font-size:20px;
  display:grid;place-items:center;transition:transform .16s var(--spring)}
.emrow button.on{box-shadow:inset 0 0 0 1.5px var(--majorelle)}
.emrow button:active{transform:scale(.88)}
.ngline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}

/* ── adjust sheet ── */
.shbg{position:fixed;inset:0;z-index:30;background:rgba(6,5,16,.62);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fadein .25s var(--ease) both}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:540px;margin:0 auto;
  background:var(--surface);border-radius:28px 28px 0 0;border-top:1px solid var(--line-2);
  padding:12px 22px calc(env(safe-area-inset-bottom) + 22px);max-height:86vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  box-shadow:0 -30px 70px -30px rgba(0,0,0,.9);animation:slideup .34s var(--ease) both}
@keyframes slideup{from{transform:translateY(101%)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 20px}
.shx{width:32px;height:32px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;
  font-size:19px;color:var(--muted);line-height:1;transition:transform .16s var(--spring)}
.shx:active{transform:scale(.88)}
.sheet .card-t{font-size:19px}
.sheet.more{max-height:78vh;padding-bottom:calc(env(safe-area-inset-bottom) + 92px)}
.sheet .menucard{margin-top:12px;background:var(--surface-2);box-shadow:none}
.shx{width:34px;height:34px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;
  flex:none;transition:transform .16s var(--spring)}
.shx:active{transform:scale(.88)}
.shx svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.shhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.shhead .card-t{flex:1;min-width:0}
.ablock{background:var(--surface-2);border-radius:20px;padding:17px 16px;margin-top:12px}
.ablock:first-of-type{margin-top:18px}
.atop{display:flex;align-items:center;gap:12px}
.atop .nm{flex:1;min-width:0;font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.aline .lab{flex:none}
.amove{display:flex;flex-direction:column;gap:3px;flex:none}
.amove button{width:30px;height:18px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;
  transition:transform .16s var(--spring)}
.amove button:active{transform:scale(.85)}
.amove button:disabled{opacity:.22}
.amove svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pctwrap{display:flex;align-items:center;gap:4px;flex:none}
.pctwrap .step{width:38px;height:38px;border-radius:13px;background:var(--surface-3)}
.pctin{width:44px;text-align:center;font-family:var(--round);font-size:18px;font-weight:700;padding:0;
  font-variant-numeric:tabular-nums}
.pctsign{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:-2px}
.atgtin{background:var(--surface-3);border-radius:13px;padding:11px 14px;font-family:var(--mono);
  font-size:14px;font-variant-numeric:tabular-nums;width:132px;text-align:right}

/* ── More: a menu that belongs to the app, not a settings screen ── */
.menucard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:20px;border-radius:24px;margin-top:14px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 16px 34px -30px rgba(0,0,0,.85);
  transition:transform .18s var(--spring),border-color .25s var(--ease)}
.menucard:active{transform:scale(.985)}
.menucard.soon{opacity:.62}
.menuico{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:23px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.menutxt{flex:1;min-width:0;text-align:left}
.menut{display:block;font-family:var(--round);font-size:17px;font-weight:700;letter-spacing:-.022em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menus{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuchev{width:9px;height:9px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);
  transform:rotate(45deg);flex:none;margin-right:4px}
.menusoon{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line-2);padding:3px 7px;border-radius:6px;flex:none}
.backlink{display:inline-flex;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:15px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:16px;
  font-size:14.5px;font-weight:600;letter-spacing:-.012em;color:var(--text);
  transition:transform .16s var(--spring)}
.backlink:active{transform:scale(.95)}
.backlink svg{width:14px;height:14px;stroke:var(--majorelle);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Tools: calculator ── */
.calcwrap{background:var(--surface-2);border-radius:22px;padding:18px;margin-top:4px}
.calcout{text-align:right;font-family:var(--round);font-size:40px;font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;line-height:1.1;min-height:46px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;direction:ltr}
.calcsub{text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);min-height:15px;margin-top:4px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.key{height:58px;border-radius:19px;background:var(--surface-3);font-family:var(--round);font-size:22px;
  font-weight:600;display:grid;place-items:center;transition:transform .13s var(--spring),background .18s}
.key:active{transform:scale(.9);background:var(--dim)}
.key.op{background:rgba(123,114,255,.16);color:var(--majorelle)}
.key.eq{background:var(--majorelle);color:#fff}
.key.fn{background:rgba(255,122,92,.13);color:var(--coral);font-size:19px}
.key.wide{grid-column:span 2}

/* ── impact rows ── */
.imp{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.imp:last-child{border-bottom:none;padding-bottom:0}
.impn{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impd{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── notes ── */
.searchbox{width:100%;background:var(--surface-2);border-radius:15px;padding:13px 15px;font-size:15px;margin-bottom:12px}
.noterow{display:flex;align-items:center;gap:6px;padding:0 8px 0 16px;border-radius:19px;
  background:var(--surface-2);margin-top:10px}
.noteopen{flex:1;min-width:0;text-align:left;padding:15px 0;transition:transform .16s var(--spring)}
.noteopen:active{transform:scale(.985)}
.notedel{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;

var MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* ══ THE FINANCIAL MONTH ══
   A month runs from the day your money arrives, not from the 1st.
   With a start day of 15, "August 2026" means 15 Aug → 14 Sep.

function cycleStart(){return Math.min(31,Math.max(1,S.cycleStart||1));}

  var d=mParse(k),y=d.getFullYear(),m=d.getMonth();

  return new Date(nxt.getTime()-864e5+86399000);

  if(cycleStart()===1)return mName(k);
  var a=periodStart(k),b=periodEnd(k);
  return a.getDate()+" "+MOS[a.getMonth()]+" \u2013 "+b.getDate()+" "+MOS[b.getMonth()];
}
function periodDay(k){
  if(k!==thisMonth())return periodDays(k);
  return Math.max(1,Math.min(periodDays(k),Math.floor((Date.now()-periodStart(k))/864e5)+1));

function thisMonth(){return mKey(new Date());}
function allMonths(){return Object.keys(S.months).sort();}
function prevOf(k){return allMonths().filter(function(x){return x<k;}).pop()||null;}
function ensureMonth(){
  var k=thisMonth();
  if(S.months[k])return k;
  var p=prevOf(k),src=p?S.months[p]:null;
  S.months[k]={salary:src?src.salary:S.salary,
    alloc:src?JSON.parse(JSON.stringify(src.alloc)):JSON.parse(JSON.stringify(BASE_ALLOC)),
    locks:src?JSON.parse(JSON.stringify(src.locks)):JSON.parse(JSON.stringify(BASE_LOCK)),
    changes:[],spend:[],override:null,split:currentSplit()};
  applyCardPayments();save();return k;
}
/* build the next period from the latest one, so you can plan forward */
function makeNext(k){
  var d=mParse(k);d.setMonth(d.getMonth()+1);
  var nk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(!S.months[nk]){
    var src=M(k);
    S.months[nk]={salary:src.salary,
      alloc:JSON.parse(JSON.stringify(src.alloc)),
      locks:JSON.parse(JSON.stringify(src.locks)),
      changes:[],spend:[],override:null,split:currentSplit()};
  }
  return nk;
}
function cur(){var k=S.monthCursor||thisMonth();return S.months[k]?k:thisMonth();}
function M(k){return S.months[k];}
function isLive(k){return k===thisMonth();}
function isSettled(k){return k<thisMonth();}   /* only the past is finished */
function isAhead(k){return k>thisMonth();}

/* ═══ 4. THE EQUATION ═══
   saved = salary − fixed bills − actual variable spend − one-offs */
function fixedTotal(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="fixed")t+=(m.alloc[c.id]||0);});return t;}
function budgetVariable(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="variable")t+=(m.alloc[c.id]||0);});return t;}
function spentOn(k,id){return M(k).spend.reduce(function(s,e){return e.cat===id?s+e.amount:s;},0);}
function spentVariable(k){return M(k).spend.reduce(function(s,e){
  return (e.cat!=="oneoff"&&e.cat!=="buffer")?s+e.amount:s;},0);}
function spentOneoff(k){return M(k).spend.reduce(function(s,e){return e.cat==="oneoff"?s+e.amount:s;},0);}
/* ── the buffer ──
   Not a goal and not savings: an allowance held back each month for
   small surprises. While the month is live the whole allowance is
   reserved. When the month closes, whatever went unused stops being
   reserved and becomes savings, which then flows into the goals on
   that month's frozen split. The allowance itself never carries over. */
function bufferAmount(k){return M(k).alloc.buffer||0;}
/* Order money is taken in: the buffer first, savings only for what is
   left over. That is what the buffer is for — it protects the plan. */
function bufferUsed(k){return Math.min(spentOneoff(k),bufferAmount(k));}
function bufferLeft(k){return Math.max(0,bufferAmount(k)-bufferUsed(k));}
function oneoffOverflow(k){return Math.max(0,spentOneoff(k)-bufferAmount(k));}
function bufferCharge(k){return isSettled(k)?bufferUsed(k):Math.max(bufferAmount(k),bufferUsed(k));}
function bufferReturned(k){return isSettled(k)?bufferLeft(k):0;}
/* where the next ¥x would come from, and whether it can be covered */
function sourceCheck(k,extra){
  if(!extra||extra<=0)return null;
  var free=bufferLeft(k),fromBuf=Math.min(extra,free),fromSav=extra-fromBuf;
  var savLeft=Math.max(0,savedActual(k));
  if(fromSav>savLeft)return{ok:false,buf:fromBuf,sav:fromSav,short:fromSav-savLeft,savLeft:savLeft};
  return{ok:true,buf:fromBuf,sav:fromSav,bufAfter:free-fromBuf,savAfter:savLeft-fromSav};
}
function totalOut(k){return fixedTotal(k)+spentVariable(k)+bufferUsed(k)+oneoffOverflow(k);}
function monthProgress(k){
  var t=thisMonth();
  if(k<t)return 1;if(k>t)return 0;
  return Math.max(0,Math.min(1,periodDay(k)/periodDays(k)));
}
/* One equation, and only one. The regular budget is assumed spent —
   you are not logging groceries — so the only thing that moves your
   savings is an unplanned one-off, or blowing past the budget itself.

   saved = salary − fixed bills − spending budget − buffer used − one-offs   */
function assumedSpend(k){return Math.max(budgetVariable(k),spentVariable(k));}
function savedActual(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return m.override;
  return m.salary-fixedTotal(k)-assumedSpend(k)-bufferCharge(k)-oneoffOverflow(k);
}
function savedProjected(k){return savedActual(k);}
function savedNow(k){return savedActual(k);}
function savedPlanned(k){return M(k).alloc.savings||0;}
/* one-offs are unplanned, so they come straight out of savings */
function effSavings(k){return (M(k).alloc.savings||0)-spentOneoff(k);}
/* ═══ FINANCIAL HEALTH ═══
   Two questions blended, because either alone lies.

   1. Attainment — did you hit the target YOU set?   saved / planned
      Weighted 70%. This is what the glow mostly tracks, and it is what
      a one-off destroys: buy a ¥4,000 TV against a ¥4,500 plan and
      attainment collapses from 1.0 to 0.11.

   2. Depth — is the target itself worth hitting?    saved / salary
      Weighted 30%, full marks at a 30% savings rate. Without this you
      could set a ¥200 target, hit it, and glow green while keeping
      almost nothing.

   Saving nothing, or less than nothing, is 0 regardless.            */
function healthFrom(salary,saved,planned){
  if(salary<=0)return 50;
  if(saved<=0)return 0;
  var att=planned>0?Math.min(1,saved/planned):1;
  var depth=Math.min(1,(saved/salary)/0.30);
  return Math.round(100*(0.7*att+0.3*depth));
}
function healthScore(k){return healthFrom(M(k).salary,savedActual(k),savedPlanned(k));}
/* Four stops, interpolated — the colour slides through the scale
   rather than snapping between four fixed states. */
var HEALTH_STOPS=[[0,[255,77,77]],[35,[255,122,61]],[65,[255,193,61]],[100,[47,212,188]]];
function healthRGB(v){
  v=Math.max(0,Math.min(100,v));
  for(var i=1;i<HEALTH_STOPS.length;i++){
    if(v<=HEALTH_STOPS[i][0]){
      var a=HEALTH_STOPS[i-1],b=HEALTH_STOPS[i],t=(v-a[0])/(b[0]-a[0]);
      return [0,1,2].map(function(j){return Math.round(a[1][j]+(b[1][j]-a[1][j])*t);});
    }
  }
  return [47,212,188];
}
function healthColor(v){return "rgb("+healthRGB(v).join(",")+")";}
function healthRGBA(v,al){return "rgba("+healthRGB(v).join(",")+","+al+")";}
function healthWhy(k,v){
  var m=M(k),saved=savedActual(k),planned=savedPlanned(k),oo=spentOneoff(k);
  var rate=m.salary>0?Math.round(Math.max(0,saved)/m.salary*100):0;
  if(m.salary<=0)return "Set your salary and this comes alive.";
  if(saved<0)return "You are spending \u00A5"+fmt(-saved)+" more than you earn this month.";
  if(oo>0&&saved<planned)
    return "\u00A5"+fmt(oo)+" of unplanned spending has taken your savings from \u00A5"+fmt(planned)+
           " down to \u00A5"+fmt(saved)+" \u2014 "+rate+"% of what you earn.";
  if(saved>=planned)return "On target at \u00A5"+fmt(saved)+", which is "+rate+"% of what you earn. Nothing unplanned so far.";
  return "Saving \u00A5"+fmt(saved)+" against a \u00A5"+fmt(planned)+" target \u2014 "+rate+"% of what you earn.";
}
function healthLabel(v){
  return v>=80?"On track":v>=60?"Slightly behind":v>=35?"Saving pressure":"Overspending risk";
}
function savingsRate(k){var m=M(k);return m.salary>0?Math.max(0,savedNow(k))/m.salary*100:0;}
function loggingThin(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return false;
  if(k>=thisMonth())return false;
  var b=budgetVariable(k);return b>0&&spentVariable(k)<b*0.4;
}

/* ═══ 5. GOALS · STREAK · MILESTONES ═══ */
function closedMonths(){var t=thisMonth();return allMonths().filter(function(k){return k<t;});}
function banked(){return closedMonths().reduce(function(s,k){return s+Math.max(0,savedActual(k));},0);}
/* Each jar holds its share of everything banked. Change an allocation
   and the split recalculates — the shares always add to what you saved. */
function jarPct(j){return Math.max(0,j.pct||0);}
function pctTotal(){return S.goals.reduce(function(s,g){return s+jarPct(g);},0);}
/* ── monthly snapshots ──
   Each month freezes the split that was in force while it was live.
   A month that has ended never changes again, so moving an allocation
   today shapes future contributions without rewriting your history. */
function currentSplit(){var o={};S.goals.forEach(function(g){o[g.id]=jarPct(g);});return o;}
function splitOf(k){var m=M(k);return (m&&m.split)?m.split:currentSplit();}
function stampSplit(){var m=M(thisMonth());if(m)m.split=currentSplit();}
function contribution(k,id){
  var sp=splitOf(k),t=0;
  for(var i in sp)t+=sp[i]||0;
  return t>0?Math.max(0,savedActual(k))*(sp[id]||0)/t:0;
}
/* what a jar held at the end of month k */
function jarBalanceAt(k,g){
  return closedMonths().filter(function(x){return x<=k;})
    .reduce(function(s,x){return s+contribution(x,g.id);},0);
}
function jarBalance(g){
  return closedMonths().reduce(function(s,k){return s+contribution(k,g.id);},0);
}
function jarLeft(j){return Math.max(0,j.target-jarBalance(j));}
function jarRate(j){var t=pctTotal();return t>0?monthlyRate()*jarPct(j)/t:0;}
function jarETA(j){return etaFor(jarLeft(j),jarRate(j));}
function jarDone(j){return jarBalance(j)>=j.target;}
function topJar(){
  for(var i=0;i<S.goals.length;i++)if(!jarDone(S.goals[i]))return S.goals[i];
  return S.goals[0];
}
/* One share moves, the unlocked ones absorb it, the total stays at 100.
   A locked goal is never touched by someone else's change — it only
   moves when you change it yourself. */
function jarLocked(g){return !!g.lock;}
function balanceGoals(pinId){
  var pinned=S.goals.find(function(g){return g.id===pinId;});
  if(!pinned)return;
  var others=S.goals.filter(function(g){return g.id!==pinId;});
  var pool=others.filter(function(g){return !jarLocked(g);});
  var lockedSum=others.filter(jarLocked).reduce(function(s,g){return s+jarPct(g);},0);
  var room=Math.max(0,100-lockedSum);          /* what is actually free to divide */
  pinned.pct=Math.min(jarPct(pinned),room);    /* can never claim locked ground */
  if(!pool.length){pinned.pct=room;return;}    /* everything else pinned down */
  var target=Math.max(0,room-jarPct(pinned));
  var sum=pool.reduce(function(s,g){return s+jarPct(g);},0);
  if(sum<=0){var e=target/pool.length;pool.forEach(function(g){g.pct=Math.round(e);});}
  else{var r=target/sum;pool.forEach(function(g){g.pct=Math.max(0,Math.round(jarPct(g)*r));});}
  var drift=100-pctTotal();
  if(drift!==0){
    var big=pool.reduce(function(a,b){return jarPct(a)>=jarPct(b)?a:b;});
    big.pct=Math.max(0,jarPct(big)+drift);
  }
}
function moveGoal(id,dir){
  var i=S.goals.findIndex(function(g){return g.id===id;}),j=i+dir;
  if(i<0||j<0||j>=S.goals.length)return;
  var t=S.goals[i];S.goals[i]=S.goals[j];S.goals[j]=t;
}
/* ── deadlines ──
   A date on its own would be decoration. It is only ever shown against
   the ETA your own saving rate produces, so it can tell you one thing:
   whether the rate you are actually saving at gets there in time.
   It changes no allocation and no total. */
function monthsNeeded(g){
  var left=jarLeft(g);if(left<=0)return 0;
  var r=jarRate(g);return r>0?Math.ceil(left/r):Infinity;
}
function monthsUntil(due){
  if(!due||due.length<7)return null;
  var y=+due.slice(0,4),m=+due.slice(5,7),n=new Date();
  if(!y||!m)return null;
  return (y-n.getFullYear())*12+(m-1-n.getMonth());
}
function dueLabel(due){return MOS[+due.slice(5,7)-1]+" "+due.slice(0,4);}
function dueText(g){
  var away=monthsUntil(g.due);
  if(away===null)return null;
  var lbl="by "+dueLabel(g.due);
  if(jarDone(g))return{t:lbl+" \u00B7 reached",c:"var(--teal)"};
  var need=monthsNeeded(g);
  if(need===Infinity)return{t:lbl+" \u00B7 no saving rate yet",c:"var(--faint)"};
  var late=need-away;
  if(late<=0)return{t:lbl+" \u00B7 on track",c:"var(--teal)"};
  return{t:lbl+" \u00B7 "+late+" month"+(late===1?"":"s")+" late",c:"var(--coral)"};
}
/* ── adding and removing a goal ──
   A new goal takes its share out of the unlocked ones, exactly as
   moving a slider does. Closed months keep the split they froze, so
   nothing already banked is re-cut. */
var GCOL=["#7B72FF","#2FD4BC","#FFB33D","#FF7A5C","#5AC8FA","#C77DFF","#4ADE80","#F472B6"];
var GEMO=["\u2B50","\uD83D\uDE97","\uD83C\uDFD6\uFE0F","\uD83D\uDCBC","\uD83C\uDF81","\uD83D\uDCBB","\uD83C\uDFE5","\uD83D\uDC8D"];
function nextCol(){
  var used=S.goals.map(function(g){return g.col;});
  for(var i=0;i<GCOL.length;i++)if(used.indexOf(GCOL[i])<0)return GCOL[i];
  return GCOL[S.goals.length%GCOL.length];
}
function lockedRoom(){
  var lk=S.goals.filter(jarLocked).reduce(function(s,g){return s+jarPct(g);},0);
  return Math.max(0,100-lk);
}
function addGoal(name,target,pct,due,emo){
  var g={id:"g"+Date.now().toString(36),name:name,e:emo||GEMO[0],target:target,
         pct:0,col:nextCol(),lock:false,due:due||""};
  S.goals.push(g);
  g.pct=Math.max(0,Math.min(100,pct||0));
  balanceGoals(g.id);stampSplit();
  return g;
}
function removeGoal(id){
  if(S.goals.length<=1)return false;
  var i=S.goals.findIndex(function(g){return g.id===id;});
  if(i<0)return false;
  S.goals.splice(i,1);
  var pin=S.goals.find(function(g){return !jarLocked(g);})||S.goals[0];
  balanceGoals(pin.id);stampSplit();
  return true;
}
/* ── hold a card, then drag it ──
   Order is display priority only: no share, no balance, no history
   moves with it. The list is rewritten on release, not on every pixel. */
var NEWE=GEMO[0];
var DRAG={el:null,timer:null,y0:0,y:0,on:false},DRAGBOUND=false;
function ptY(e){return e.touches&&e.touches[0]?e.touches[0].clientY:e.clientY;}
function dragCards(){return Array.prototype.slice.call(document.querySelectorAll(".jarcard[data-gid]"));}
function dragStart(e,el){
  dragCancel();
  DRAG.el=el;DRAG.y0=ptY(e);DRAG.y=DRAG.y0;DRAG.on=false;
  DRAG.timer=setTimeout(function(){
    DRAG.timer=null;DRAG.on=true;
    el.classList.add("dragging");
    el.style.transform="scale(1.03)";
    if(navigator.vibrate){try{navigator.vibrate(12);}catch(x){}}
  },380);
}
function dragCancel(){
  if(DRAG.timer){clearTimeout(DRAG.timer);DRAG.timer=null;}
  if(DRAG.el&&!DRAG.on){DRAG.el=null;}
}
function dragSwap(el,other,dir){
  el.style.transform="";
  var before=el.getBoundingClientRect().top;
  if(dir<0)other.parentNode.insertBefore(el,other);
  else other.parentNode.insertBefore(el,other.nextSibling);
  DRAG.y0+=(el.getBoundingClientRect().top-before);
  moveGoal(el.getAttribute("data-gid"),dir);
  el.style.transform="translateY("+(DRAG.y-DRAG.y0)+"px) scale(1.03)";
}
function dragMove(e){
  if(!DRAG.el)return;
  var y=ptY(e);
  if(!DRAG.on){if(Math.abs(y-DRAG.y0)>9){clearTimeout(DRAG.timer);DRAG.timer=null;DRAG.el=null;}return;}
  if(e.cancelable)e.preventDefault();
  DRAG.y=y;
  var el=DRAG.el;
  el.style.transform="translateY("+(y-DRAG.y0)+"px) scale(1.03)";
  var cards=dragCards(),i=cards.indexOf(el),r=el.getBoundingClientRect(),mid=r.top+r.height/2;
  var prev=cards[i-1],next=cards[i+1],pr,nr;
  if(prev){pr=prev.getBoundingClientRect();if(mid<pr.top+pr.height/2){dragSwap(el,prev,-1);return;}}
  if(next){nr=next.getBoundingClientRect();if(mid>nr.top+nr.height/2){dragSwap(el,next,1);return;}}
}
function dragEnd(){
  if(DRAG.timer){clearTimeout(DRAG.timer);DRAG.timer=null;}
  var moved=DRAG.on,el=DRAG.el;
  DRAG.el=null;DRAG.on=false;
  if(el){el.style.transform="";el.classList.remove("dragging");}
  if(moved){save();render();}
}
function bindGoalDrag(){
  var cards=dragCards();
  if(!cards.length)return;
  cards.forEach(function(el){
    el.addEventListener("touchstart",function(e){dragStart(e,el);},{passive:true});
    el.addEventListener("mousedown",function(e){dragStart(e,el);});
  });
  if(DRAGBOUND)return;
  DRAGBOUND=true;
  document.addEventListener("touchmove",dragMove,{passive:false});
  document.addEventListener("touchend",dragEnd);
  document.addEventListener("touchcancel",dragEnd);
  document.addEventListener("mousemove",dragMove);
  document.addEventListener("mouseup",dragEnd);
  document.addEventListener("scroll",function(){if(!DRAG.on)dragCancel();},true);
}
function monthlyRate(){
  var past=closedMonths();
  if(past.length){var r=past.slice(-3);return r.reduce(function(s,k){return s+Math.max(0,savedActual(k));},0)/r.length;}
  return Math.max(0,savedPlanned(cur()));
}
function totalSpendOf(k){return fixedTotal(k)+assumedSpend(k)+spentOneoff(k);}
function rateOf(k){var m=M(k);return m&&m.salary>0?Math.max(0,savedActual(k))/m.salary*100:0;}
function cumulativeTo(k){
  return allMonths().filter(function(x){return x<=k;})
    .reduce(function(s,x){return s+Math.max(0,savedActual(x));},0);
}
/* The spread of what you have actually saved recently. A single average
   pretends next month is settled; a range says what the record supports. */
function paceRange(){
  var v=closedMonths().slice(-6).map(function(k){return Math.max(0,savedActual(k));})
        .filter(function(x){return x>0;});
  if(v.length<2)return null;
  return {lo:Math.min.apply(null,v),hi:Math.max.apply(null,v),n:v.length};
}
/* Delay is amount ÷ monthly saving. The allocation cancels out, so it is
   the same for every goal — there is no per-goal number to give. */
function delayText(amount){
  if(amount<=0)return "no change";
  var r=paceRange(),base=monthlyRate();
  if(r){
    var fast=Math.round(amount/r.hi*30),slow=Math.round(amount/r.lo*30);
    return fast===slow?("+"+fast+" days"):("+"+fast+"\u2013"+slow+" days");
  }
  return base>0?("\u2248 +"+Math.round(amount/base*30)+" days"):"\u2014";
}
function paceBasis(){
  var r=paceRange();
  if(r)return "based on your last "+r.n+" months, which ranged \u00A5"+fmt(r.lo)+" to \u00A5"+fmt(r.hi)+" saved";
  return "based on the \u00A5"+fmt(monthlyRate())+" you have planned, since there is no history yet";
}
function ahead(m){var d=new Date();d.setMonth(d.getMonth()+m);return MOS[d.getMonth()]+" "+d.getFullYear();}
function etaFor(remaining,rate){
  if(remaining<=0)return "done";
  if(rate<=0)return "\u2014";
  var n=Math.ceil(remaining/rate);
  return n>240?"\u2014":ahead(n);
}
function streak(){
  var p=closedMonths(),n=0;
  for(var i=p.length-1;i>=0;i--){if(savedActual(p[i])>=savedPlanned(p[i]))n++;else break;}
  return n;
}
/* ═══ 6. INSIGHTS ═══ */
function insights(k){
  var out=[],p=prevOf(k);
  if(!p){out.push({i:"\uD83D\uDC4B",t:"This is your first month on record. Once it ends, the app starts comparing months and the advice sharpens."});return out;}
  var sNow=Math.max(0,savedNow(k)),sPrev=Math.max(0,savedActual(p)),d=sNow-sPrev;
  if(Math.abs(d)>=100)out.push({i:d>0?"\uD83D\uDCC8":"\uD83D\uDCC9",
    t:"Saving <b>\u00A5"+fmt(Math.abs(d))+(d>0?" more":" less")+"</b> than "+mShort(p)+". <em>"+fmt(sPrev)+" \u2192 "+fmt(sNow)+"</em>"});
  CATS.filter(function(c){return c.type==="variable";}).forEach(function(c){
    var a=spentOn(k,c.id),b=spentOn(p,c.id);
    if(b<200&&a<200)return;
    var diff=a-b;if(Math.abs(diff)<150)return;
    var pct=b>0?Math.round(diff/b*100):null;
    out.push({i:EMOJI[c.id],
      t:"<b>"+c.name+"</b> "+(diff>0?"up":"down")+" "+(pct!==null?Math.abs(pct)+"%":"\u00A5"+fmt(Math.abs(diff)))+
        " vs "+mShort(p)+". <em>\u00A5"+fmt(b)+" \u2192 \u00A5"+fmt(a)+"</em>"});
  });
  var oo=spentOneoff(k);
  if(oo>0){
    var r=monthlyRate(),days=r>0?Math.round(oo/r*30):0;
    out.push({i:"\u26A0\uFE0F",t:"<b>\u00A5"+fmt(oo)+"</b> in one-offs this month"+
      (days>2?", which pushes your goals back about <b>"+days+" days</b>":"")+"."});
  }
  var vb=budgetVariable(k),vs=spentVariable(k);
  if(monthProgress(k)<1&&vs>vb)out.push({i:"\uD83D\uDD34",
    t:"You are <b>\u00A5"+fmt(vs-vb)+"</b> past your spending budget with "+Math.round((1-monthProgress(k))*100)+"% of the month left."});
  if(!out.length)out.push({i:"\u2696\uFE0F",t:"Nothing has moved much since "+mShort(p)+"."});
  return out;
}
function verdictOf(k){
  var v=healthScore(k);
  return{h:healthLabel(v),s:healthWhy(k,v),c:healthColor(v),score:v};
}

/* ═══ 7. WEEKS — always inside the month you are viewing ═══
   Weeks are Monday-based but clipped to the month, so an entry can
   never land in a different month from the one on screen. */
function entryTime(k){
  if(k===thisMonth())return Date.now();
  return periodStart(k).getTime()+Math.floor(periodDays(k)/2)*864e5+43200000;
}
var _seq=0;
function newId(){return Date.now()*1000+(_seq++%1000);}

/* ═══ 8. BALANCE ENGINE ═══ */
/* No line can claim money that is not there. Whatever you are moving is
   capped at income minus everything locked; the unlocked lines share the
   rest. The total can never exceed your salary. */
function balance(k,pin){
  var m=M(k),lockedSum=0,pool=[];
  CATS.forEach(function(c){
    if(c.id===pin)return;
    if(m.locks[c.id])lockedSum+=(m.alloc[c.id]||0);else pool.push(c.id);
  });
  var room=Math.max(0,m.salary-lockedSum);
  if(pin){
    var want=m.alloc[pin]||0;
    if(want>room){
      S.clamp={id:pin,want:want,got:room,locked:lockedSum,ts:Date.now()};
      m.alloc[pin]=room;
    }else if(S.clamp&&S.clamp.id===pin)S.clamp=null;
  }
  if(!pool.length)return;
  var target=Math.max(0,room-(pin?(m.alloc[pin]||0):0));
  var sum=pool.reduce(function(s,id){return s+(m.alloc[id]||0);},0);
  if(sum<=0){var e=target/pool.length;pool.forEach(function(id){m.alloc[id]=Math.round(e);});}
  else{var r=target/sum;pool.forEach(function(id){m.alloc[id]=Math.max(0,Math.round((m.alloc[id]||0)*r));});}
  var drift=m.salary-CATS.reduce(function(s,c){return s+(m.alloc[c.id]||0);},0);
  if(drift!==0){
    var big=pool.reduce(function(x,y){return (m.alloc[x]||0)>=(m.alloc[y]||0)?x:y;});
    m.alloc[big]=Math.max(0,(m.alloc[big]||0)+drift);
  }
}
function recordChange(k,id,from,to){
  if(from===to)return;
  var ch=M(k).changes,last=ch[ch.length-1];
  if(last&&last.cat===id&&Date.now()-last.ts<90000){last.to=to;last.ts=Date.now();}
  else ch.push({ts:Date.now(),cat:id,from:from,to:to});
  if(ch.length>200)ch.splice(0,ch.length-200);
}

/* ═══ 10. CHARTS ═══ */
function ringSVG(pct,color){
  var R=44,C=2*Math.PI*R,len=Math.max(0,Math.min(100,pct))/100*C;
  return '<svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">'+
    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#1E1B3C" stroke-width="9"/>'+
    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/></g></svg>';
}
function donutSVG(rows){
  var total=rows.reduce(function(s,r){return s+r.value;},0);
  if(total<=0)return null;
  var R=42,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">';
  rows.forEach(function(r){
    var len=r.value/total*C,seg=Math.max(0.5,len-1.6);
    s+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+r.color+'" stroke-width="13" '+
       'stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len;
  });
  return s+'</g></svg>';
}
function barChart(rows,h){
  h=h||62;
  if(!rows.length)return '<div class="empty">Nothing to chart yet.</div>';
  var W=100,n=rows.length,max=Math.max.apply(null,rows.map(function(r){return Math.max(r.value,r.target||0);}))||1;
  var gap=1.6,bw=(W-gap*(n-1))/n;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none">';
  rows.forEach(function(r,i){
    var x=i*(bw+gap),bh=r.value/max*h,y=h-bh;
    if(r.target){var ty=h-(r.target/max*h);
      s+='<line x1="'+x+'" y1="'+ty+'" x2="'+(x+bw)+'" y2="'+ty+'" stroke="rgba(255,255,255,.32)" stroke-width=".7" stroke-dasharray="1.6 1.4"/>';}
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,.8)+'" rx="1.2" fill="'+(r.color||"#7B72FF")+'" opacity="'+(r.faded?.45:1)+'"/>';
  });
  s+='</svg><div style="display:flex;gap:1.6%;margin-top:5px">';
  rows.forEach(function(r){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--faint)">'+r.label+'</div>';});
  return s+'</div>';
}
function pairChart(rows){
  if(!rows.length)return '<div class="empty">Nothing to chart yet.</div>';
  var W=100,H=58,n=rows.length;
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.a,r.b);}))||1;
  var gp=3,grp=(W-gp*(n-1))/n,bw=(grp-1.2)/2;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  rows.forEach(function(r,i){
    var x=i*(grp+gp),ha=r.a/max*H,hb=r.b/max*H;
    s+='<rect x="'+x+'" y="'+(H-ha)+'" width="'+bw+'" height="'+Math.max(ha,.8)+'" rx="1.1" fill="#7B72FF"/>'+
       '<rect x="'+(x+bw+1.2)+'" y="'+(H-hb)+'" width="'+bw+'" height="'+Math.max(hb,.8)+'" rx="1.1" fill="#FF7A5C"/>';
  });
  s+='</svg><div style="display:flex;gap:3%;margin-top:5px">';
  rows.forEach(function(r){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--faint)">'+r.label+'</div>';});
  return s+'</div><div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted)">'+
    '<span><i style="display:inline-block;width:8px;height:8px;border-radius:8px;background:#7B72FF;margin-right:6px"></i>In</span>'+
    '<span><i style="display:inline-block;width:8px;height:8px;border-radius:8px;background:#FF7A5C;margin-right:6px"></i>Out</span></div>';
}
function areaChart(vals,labels,color){
  if(vals.length<2)return '<div class="empty">Two months of history will draw a curve here.</div>';
  var W=100,H=52,max=Math.max.apply(null,vals)||1;
  var pts=vals.map(function(v,i){return[(i/(vals.length-1))*W,H-(v/max)*H];});
  var d=pts.map(function(p,i){return (i?"L":"M")+p[0].toFixed(2)+" "+p[1].toFixed(2);}).join(" ");
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
    '<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".4"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    '</linearGradient></defs><path d="'+d+' L'+W+' '+H+' L0 '+H+' Z" fill="url(#ag)"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  pts.forEach(function(p){s+='<circle cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="1.1" fill="'+color+'"/>';});
  s+='</svg><div style="display:flex;margin-top:5px">';
  labels.forEach(function(l){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--faint)">'+l+'</div>';});
  return s+'</div>';
}

/* ═══ 11. VIEWS ═══ */
/* The body of a page, built for any tab and written nowhere. render()
   uses it for the tab you are on; the gesture layer uses it for the tab
   you are swiping towards. One builder, so the two can never diverge. */
function pageHTML(tab){
  var k=cur(),live=isLive(k),editable=k>=thisMonth(),h="";
  var months=allMonths(),idx=months.indexOf(k);
  if(MORE_PAGES.indexOf(tab)<0)h+='<div class="mbar"><button class="mnav" data-m="-1"'+(idx<=0?" disabled":"")+' aria-label="Previous month">'+ICON.l+'</button>'+
     '<div class="mtitle"><b>'+mName(k)+'</b><span class="'+(live?"live":"")+'">'+
     (function(){var st=live?"live":isAhead(k)?"upcoming":"closed";
       return cycleStart()===1?st:periodLabel(k)+" \u00B7 "+st;})()+'</span></div>'+
     '<button class="mnav" data-m="1" aria-label="Next month">'+ICON.r+'</button></div>';
  if(!live&&MORE_PAGES.indexOf(tab)<0){
    h+='<div class="card" style="margin-top:0"><div class="warnbox '+(editable?"clear":"tight")+'" style="margin-top:0">'+
       (editable
         ? '<b>Planning ahead.</b> This period starts '+periodStart(k).getDate()+' '+MOS[periodStart(k).getMonth()]+
           '. Set it up now and it will be waiting.'
         : '<b>This period has closed.</b> It is kept as a record and can no longer be edited.')+
       '</div><button class="btn" data-now="1" style="margin-top:12px">Back to '+mName(thisMonth())+'</button></div>';
  }
  if(tab==="home")h+=viewHome(k,live);
  else if(tab==="plan")h+=viewPlan(k,live);
  else if(tab==="log")h+=viewLog(k);
  else if(tab==="goals")h+=viewGoals();
  else if(tab==="journey")h+=viewJourney();
  else if(tab==="backup")h+=viewBackup();
  else if(tab==="tools")h+=viewTools();
  else if(tab==="note")h+=viewNote();
  else if(tab==="settings")h+=viewSettings();
  else h+=viewHome(k,live);
  return h;
}
function render(){
  ensureMonth();
  var h=pageHTML(S.tab);
  if(S.more)h+=moreSheet();
  document.getElementById("app").innerHTML=h;
  var bar="";
  [["home","Home",ICON.home],["plan","Plan",ICON.plan],["log","Log",ICON.log],["goals","Goals",ICON.goals],["more","More",ICON.more]]
  .forEach(function(t){var on=S.tab===t[0]||(t[0]==="more"&&(S.more||MORE_PAGES.indexOf(S.tab)>-1));
    bar+='<button class="tab'+(on?" on":"")+'" data-t="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>';});
  document.getElementById("bar").innerHTML=bar;
  bind();
}

     '<p class="hint">Locked amounts never move. Unlocked ones share what is left, so the total always matches your salary. Every change is recorded in your monthly report.</p>'+

         '<span class="dot" style="background:'+g.col+'"></span><span class="n">'+g.name+'</span>'+

    notes.forEach(function(n){h+='<div class="ins"><span class="ic">'+n.i+'</span><span class="tx">'+n.t+'</span></div>';});
    h+='</div>';

/* two or three short observations, never a wall of text */
function journeyNotes(k,p){
  var out=[],st=streak();
  if(p){
    var a=Math.max(0,savedActual(k)),b=Math.max(0,savedActual(p));
    if(b>0&&Math.abs(a-b)>=100){
      var d=Math.round((a-b)/b*100);
      out.push({i:d>0?"\uD83D\uDCC8":"\uD83D\uDCC9",
        t:"Your savings "+(d>0?"rose":"fell")+" <b>"+Math.abs(d)+"%</b> against "+mShort(p)+"."});
    }
  }
  var lead=S.goals.filter(function(g){return !jarDone(g);})
    .sort(function(x,y){return jarPct(y)-jarPct(x);})[0];
  if(lead&&jarRate(lead)>0)
    out.push({i:lead.e,t:"Most of your saving goes to <b>"+lead.name+"</b>. At this rate it lands "+jarETA(lead)+"."});
  if(out.length<3&&lead){
    var faster=jarLeft(lead)/(jarRate(lead)+monthlyRate()*0.05);
    if(jarRate(lead)>0&&isFinite(faster)){
      var now=Math.ceil(jarLeft(lead)/jarRate(lead)),then=Math.ceil(faster);
      if(now-then>=1)out.push({i:"\u26A1",
        t:"Give <b>"+lead.name+"</b> 5% more and it arrives "+ahead(then)+" instead of "+ahead(now)+"."});
    }
  }
  if(out.length<3&&st>=2)out.push({i:"\uD83D\uDD25",t:"You have hit your target <b>"+st+" months</b> running."});
  return out.slice(0,3);
}

/* ═══ TOOLS ═══
   Two things the phone's own apps can't do: run a number against the
   goals you actually have, and keep a note tied to one of them. */
function calcState(){
  if(!S.calc)S.calc={d:"0",acc:null,op:null,fresh:true,memo:""};
  return S.calc;
}
function calcPress(key){
  var c=calcState();
  if(key>="0"&&key<="9"){
    c.d=(c.fresh||c.d==="0")?key:(c.d.length<12?c.d+key:c.d);c.fresh=false;
  }else if(key==="."){
    if(c.fresh){c.d="0.";c.fresh=false;}
    else if(c.d.indexOf(".")<0)c.d+=".";
  }else if(key==="C"){
    c.d="0";c.acc=null;c.op=null;c.fresh=true;c.memo="";
  }else if(key==="back"){
    c.d=c.d.length>1?c.d.slice(0,-1):"0";if(c.d==="-")c.d="0";
  }else if(key==="+"||key==="-"||key==="x"||key==="/"){
    if(c.op!==null&&!c.fresh)calcPress("=");
    c.acc=parseFloat(c.d)||0;c.op=key;c.fresh=true;
    c.memo=trimNum(c.acc)+" "+opSign(key);
  }else if(key==="="){
    if(c.op===null)return;
    var b=parseFloat(c.d)||0,a=c.acc||0,r=a;
    if(c.op==="+")r=a+b; else if(c.op==="-")r=a-b;
    else if(c.op==="x")r=a*b; else if(c.op==="/")r=b===0?0:a/b;
    c.memo=trimNum(a)+" "+opSign(c.op)+" "+trimNum(b)+" =";
    c.d=trimNum(r);c.acc=null;c.op=null;c.fresh=true;
  }
}
function opSign(o){return o==="x"?"\u00D7":o==="/"?"\u00F7":o;}
function trimNum(n){
  if(!isFinite(n))return "0";
  var r=Math.round(n*100)/100;
  return (Math.abs(r)>=1e12)?String(r.toExponential(4)):String(r);
}
function calcValue(){return parseFloat(calcState().d)||0;}

function relDate(ts){
  var d=new Date(ts),n=new Date(),day=864e5;
  var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  var b=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime();
  var diff=Math.round((b-a)/day);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  if(diff<7)return diff+" days ago";
  return d.getDate()+" "+MOS[d.getMonth()];
}

/* ══ CREDIT CARD AWARENESS ══
   Not a banking module. The card reads the Installments line you already
   set on Plan — that is the payment that gives credit back. Nothing here
   treats credit as income. */
function card(){
  if(!S.card)S.card={limit:0,used:0,payDay:18,lastPaid:null};
  return S.card;
}
function cardOn(){return card().limit>0;}
function cardAvail(){return Math.max(0,card().limit-card().used);}
function cardUsage(){return card().limit>0?card().used/card().limit*100:0;}
function nextPayment(){return M(thisMonth()).alloc.installments||0;}
function cardAvailAfter(){return cardAvail()+nextPayment();}
function nextPayDate(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=Math.min(card().payDay||18,28);
  if(d.getDate()>day){m+=1;if(m>11){m=0;y+=1;}}
  return new Date(y,m,clampDay(y,m,day));
}
function payDateLabel(){var d=nextPayDate();return d.getDate()+" "+MOS[d.getMonth()];}
/* a closed period means its installment was paid, so that credit comes back */
function applyCardPayments(){
  if(!cardOn())return;
  var c=card(),last=c.lastPaid;
  closedMonths().forEach(function(k){
    if(!last||k>last){
      var pay=M(k).alloc.installments||0;
      if(pay>0)c.used=Math.max(0,c.used-pay);
      c.lastPaid=k;
    }
  });
}
/* Verdict on putting an amount on the card. Credit you have not been
   given back yet is not credit you can spend — the upcoming payment is
   told to you, but it never authorises a purchase. */
function cardCheck(amount){
  if(!cardOn()||!amount||amount<=0)return null;
  var av=cardAvail(),np=nextPayment(),back=np>0?" \u00A5"+fmt(np)+" comes back on "+payDateLabel()+".":"";
  if(amount<=av)return{ok:true,level:"clear",
    msg:"\u00A5"+fmt(av-amount)+" of credit would remain."};
  return{ok:false,level:"over",short:amount-av,
    msg:(av>0?"Only \u00A5"+fmt(av)+" is available \u2014 that is \u00A5"+fmt(amount-av)+" short."
             :"Your card is at its limit, so there is nothing to spend.")+back};
}
function ordinal(n){
  var t=n%100;if(t>=11&&t<=13)return n+"th";
  return n+({1:"st",2:"nd",3:"rd"}[n%10]||"th");
}

      var blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nm;
      document.body.appendChild(a);a.click();document.body.removeChild(a);
    }catch(e){alert("Download failed. Use Copy as text instead.");}
    setTimeout(render,400);};
  var cp=document.getElementById("copy");
  if(cp)cp.onclick=function(){
    var t=document.getElementById("dump");t.removeAttribute("readonly");t.select();t.setSelectionRange(0,999999);
    try{document.execCommand("copy");cp.textContent="Copied";S.lastBackup=Date.now();save();
      setTimeout(function(){cp.textContent="Copy as text";},1600);}catch(e){}
    t.setAttribute("readonly","readonly");
    try{window.getSelection().removeAllRanges();}catch(e){}};
  var ps=document.getElementById("paste");
  if(ps)ps.onclick=function(){
    var s=prompt("Paste your backup here. This replaces everything currently in the app.");
    if(!s)return;
    try{var p=JSON.parse(s);if(!p||!p.months)throw 0;S=p;save();render();}
    catch(e){alert("That does not look like a backup.");}};
  var rs=document.getElementById("reset");
  if(rs)rs.onclick=function(){
    if(confirm("Erase every month, every entry, every goal? This cannot be undone.")){S=fresh();save();render();}};
}

/* Any sheet can be flicked down to dismiss. Only starts when the sheet is
   scrolled to the top and you are not dragging inside a field. */
function closeSheets(){
  if(S.more){S.more=false;save();render();}
  else if(S.sheet){S.sheet=false;save();render();}
}
(function(){
  var el=null,y0=0,dragging=false;
  function sheetOf(t){
    while(t&&t!==document.body){if(t.classList&&t.classList.contains("sheet"))return t;t=t.parentNode;}
    return null;
  }
  document.addEventListener("touchstart",function(e){
    var tag=e.target&&e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA")return;
    var sh=sheetOf(e.target);
    if(!sh||sh.scrollTop>0)return;
    el=sh;y0=e.touches[0].clientY;dragging=true;el.style.transition="none";
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!dragging||!el)return;
    var dy=e.touches[0].clientY-y0;
    /* swiping up is a scroll, not a dismiss — let go of the gesture */
    if(dy<=0||el.scrollTop>0){
      dragging=false;el.style.transition="";el.style.transform="";el=null;return;
    }
    el.style.transform="translateY("+dy+"px)";
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!dragging||!el)return;
    var dy=e.changedTouches[0].clientY-y0;
    el.style.transition="";el.style.transform="";el=null;dragging=false;
    if(dy>90)closeSheets();
  });
})();

/* ── swipe between the main tabs ──
   Writes to the same S.tab the bottom bar writes to: one navigation
   with two ways in, so the indicator can never disagree with the page.
   Vertical always wins an ambiguous gesture — scrolling is never stolen. */
var SWIPE_TABS=["home","plan","log","goals"];
var SWALLOW=false;
function noSwipeZone(t){
  while(t&&t!==document.body){
    if(t.classList&&(t.classList.contains("sheet")||t.classList.contains("shbg")||
       t.classList.contains("goalpick")||t.classList.contains("chiprow")))return true;
    t=t.parentNode;
  }
  return false;
}
function slideTo(tab,dir){
  var app=document.getElementById("app");
  if(!app){S.tab=tab;save();render();return;}
  app.style.transition="transform .15s var(--ease),opacity .15s var(--ease)";
  app.style.transform="translateX("+(dir>0?-30:30)+"px)";
  app.style.opacity="0";
  setTimeout(function(){
    S.delArm=null;S.more=false;S.tab=tab;save();render();
    window.scrollTo(0,0);
    var a=document.getElementById("app");
    if(!a)return;
    a.style.transition="none";
    a.style.transform="translateX("+(dir>0?30:-30)+"px)";
    a.style.opacity="0";
    requestAnimationFrame(function(){
      a.style.transition="transform .24s var(--ease),opacity .24s var(--ease)";
      a.style.transform="translateX(0)";a.style.opacity="1";
      /* inline styles are cleared: a transform on #app would trap any
         fixed-position sheet opened later inside it */
      setTimeout(function(){a.style.transition="";a.style.transform="";a.style.opacity="";},280);
    });
  },150);
}
function navSwipe(dir){
  if(S.more||S.sheet||S.newg)return;              /* a sheet owns the gesture */
  if(MORE_PAGES.indexOf(S.tab)>-1)return;         /* sub-pages have a back link */
  var i=SWIPE_TABS.indexOf(S.tab);if(i<0)return;
  var j=i+dir;
  if(j<0)return;
  if(j>=SWIPE_TABS.length){
    if(dir>0){S.delArm=null;S.more=true;save();render();}  /* past Goals is More */
    return;
  }
  slideTo(SWIPE_TABS[j],dir);
}
/* ── the gesture itself ──
   The page you are leaving follows your finger and shrinks a little; the
   page you are arriving at is built underneath and slides in at exactly
   the same rate. Nothing is committed until you let go, so a change of
   mind costs nothing. */
var THRESH=.28;
var G={live:false,axis:null,x0:0,y0:0,t0:0,dir:0,target:null,W:360,p:0,armed:false,busy:false};
function gEls(){return{wrap:document.getElementById("slide"),page:document.getElementById("slideIn"),
  glow:document.getElementById("glow"),app:document.getElementById("app")};}
function gPrepare(dir){
  if(G.busy)return false;
  if(S.more||S.sheet||S.newg)return false;          /* a sheet owns the gesture */
  if(MORE_PAGES.indexOf(S.tab)>-1)return false;     /* sub-pages have a back link */
  var i=SWIPE_TABS.indexOf(S.tab);if(i<0)return false;
  var j=i+dir;if(j<0||j>=SWIPE_TABS.length)return false;
  var e=gEls();if(!e.wrap||!e.page||!e.app)return false;
  G.dir=dir;G.target=SWIPE_TABS[j];G.W=window.innerWidth||360;G.armed=false;G.p=0;
  e.page.innerHTML=pageHTML(G.target);
  e.wrap.classList.add("on");
  e.app.style.transition="none";e.page.style.transition="none";
  e.page.style.transform="translateX("+(dir>0?G.W:-G.W)+"px)";
  e.page.style.opacity="0";
  return true;
}
function gGlow(x,y,p){
  var g=gEls().glow;if(!g)return;
  g.style.transform="translate("+x+"px,"+y+"px)";
  g.style.opacity=String(Math.min(.5,p*.8));
  if(p>=THRESH)g.classList.add("armed");else g.classList.remove("armed");
}
function gFrame(dx,x,y){
  var e=gEls(),W=G.W,p=Math.max(0,Math.min(1,Math.abs(dx)/W));
  G.p=p;
  if(!G.target){                       /* nowhere to go: a little resistance, then back */
    e.app.style.transition="none";
    e.app.style.transform="translateX("+(dx*.16)+"px)";
    gGlow(x,y,p*.5);
    return;
  }
  e.app.style.transform="translateX("+(dx*.92)+"px) scale("+(1-.02*p).toFixed(4)+")";
  e.app.style.opacity=String(1-.34*p);
  e.page.style.transform="translateX("+((G.dir>0?W:-W)+dx*.92)+"px) scale("+(.98+.02*p).toFixed(4)+")";
  e.page.style.opacity=String(.35+.65*p);
  gGlow(x,y,p);
  if(p>=THRESH&&!G.armed){
    G.armed=true;
    if(navigator.vibrate){try{navigator.vibrate(9);}catch(v){}}
  }else if(p<THRESH)G.armed=false;
}
function gReset(){
  var e=gEls();
  if(e.app){e.app.style.transition="";e.app.style.transform="";e.app.style.opacity="";}
  if(e.wrap)e.wrap.classList.remove("on");
  if(e.page){e.page.style.transition="";e.page.style.transform="";e.page.style.opacity="";e.page.innerHTML="";}
  if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
  G.target=null;G.axis=null;G.busy=false;G.armed=false;G.p=0;
}
function gSettle(commit){
  var e=gEls(),W=G.W,dir=G.dir,tab=G.target;
  if(!e.app||!tab){                    /* the resistance case: just let it spring back */
    if(e.app){e.app.style.transition="transform .3s var(--spring)";e.app.style.transform="translateX(0)";}
    if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
    setTimeout(gReset,300);
    return;
  }
  G.busy=true;
  var mv="transform .28s var(--ease),opacity .28s var(--ease)";
  e.app.style.transition=mv;e.page.style.transition=mv;
  if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
  if(commit){
    e.app.style.transform="translateX("+(dir>0?-W*.92:W*.92)+"px) scale(.98)";
    e.app.style.opacity="0";
    e.page.style.transform="translateX(0) scale(1)";
    e.page.style.opacity="1";
    setTimeout(function(){
      var a=gEls();
      if(a.app){a.app.style.transition="none";a.app.style.transform="";a.app.style.opacity="";}
      S.delArm=null;S.more=false;S.tab=tab;save();render();
      window.scrollTo(0,0);
      gReset();
    },280);
  }else{
    e.app.style.transform="translateX(0) scale(1)";
    e.app.style.opacity="1";
    e.page.style.transform="translateX("+(dir>0?W:-W)+"px) scale(.98)";
    e.page.style.opacity="0";
    setTimeout(gReset,280);
  }
}
(function(){
  document.addEventListener("touchstart",function(e){
    G.live=false;G.axis=null;G.target=null;
    if(G.busy)return;
    if(e.touches.length!==1||DRAG.el||DRAG.on)return;
    var tag=e.target&&e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
    if(noSwipeZone(e.target))return;
    G.x0=e.touches[0].clientX;G.y0=e.touches[0].clientY;G.t0=Date.now();G.live=true;
  },{passive:true});

  document.addEventListener("touchmove",function(e){
    if(!G.live)return;
    if(e.touches.length!==1||DRAG.on){G.live=false;if(G.target)gSettle(false);return;}
    var t=e.touches[0],dx=t.clientX-G.x0,dy=t.clientY-G.y0;
    if(G.axis===null){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      /* once it reads as a scroll it stays a scroll for the whole gesture */
      G.axis=Math.abs(dx)>Math.abs(dy)*1.4?"x":"y";
      if(G.axis==="x")gPrepare(dx<0?1:-1);
    }
    if(G.axis!=="x")return;
    if(e.cancelable)e.preventDefault();
    gFrame(dx,t.clientX,t.clientY);
  },{passive:false});

  document.addEventListener("touchend",function(e){
    if(!G.live)return;
    G.live=false;
    if(G.axis!=="x"){gReset();return;}
    var t=e.changedTouches[0],dx=t.clientX-G.x0,dy=t.clientY-G.y0,dt=Date.now()-G.t0;
    SWALLOW=true;setTimeout(function(){SWALLOW=false;},350);
    if(G.target){
      var p=Math.min(1,Math.abs(dx)/G.W);
      gSettle(p>=THRESH||(dt<280&&Math.abs(dx)>56));   /* a quick flick counts */
      return;
    }
    gSettle(false);
    /* nothing was staged: the only move left is Goals \u2192 the More menu */
    if(dt<700&&Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.6)navSwipe(dx<0?1:-1);
  });
  document.addEventListener("touchcancel",function(){
    if(!G.live)return;
    G.live=false;gSettle(false);
  });

  /* a swipe that started on a button must not also press it */
  document.addEventListener("click",function(e){
    if(SWALLOW){SWALLOW=false;e.stopPropagation();e.preventDefault();}
  },true);
})();

/* The source chips are handled here rather than in bind(), so they keep
   working no matter how the view is re-rendered. */
document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document.body&&!(t.dataset&&(t.dataset.p||t.dataset.pm||t.dataset.delnote)))t=t.parentNode;
  if(!t||!t.dataset)return;
  if(t.dataset.delnote){
    var id=+t.dataset.delnote;
    if(S.delArm===id){
      S.notes=(S.notes||[]).filter(function(n){return n.id!==id;});
      S.delArm=null;
      if(S.noteId===id){S.noteId=null;S.tab="tools";}
    }else S.delArm=id;
    save();render();return;
  }
  if(t.dataset.pm){S.payMethod=t.dataset.pm;save();render();return;}
  if(t.dataset.p){S.pick=t.dataset.p;save();render();}
});

/* Tap any number field and the whole value is selected, so you can type
   straight over it instead of deleting digit by digit. Attached once at
   document level, so it survives every re-render and covers every field. */
document.addEventListener("focusin",function(e){
  var t=e.target;
  if(!t||t.tagName!=="INPUT"||t.type!=="number")return;
  setTimeout(function(){try{t.select();}catch(err){}},0);
});
document.addEventListener("click",function(e){
  var t=e.target;
  if(!t||t.tagName!=="INPUT"||t.type!=="number")return;
  if(document.activeElement===t){try{t.select();}catch(err){}}
},true);

render();
</script>
</body>
