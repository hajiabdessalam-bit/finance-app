<body>
<div class="scroll" id="app"></div>
<div id="slide" aria-hidden="true"><div class="scroll" id="slideIn"></div></div>
<div id="glow" aria-hidden="true"><i></i></div>
<nav class="bar" id="bar"></nav>
<script>
"use strict";
/* ═══ 1. STORAGE ═══ */
var MEMONLY=false;
var store=(function(){
  try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return localStorage;}
  catch(e){
    /* private browsing, or storage full: the app still runs, but only
       until the tab closes. Settings says so rather than pretending. */
    MEMONLY=true;
    var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=v}};
  }
})();
var KEY="plan.v4";
var BUILD="b37 \u00B7 graphite";

/* ═══ 2. DEFINITIONS ═══ */
var COLOR={savings:"#E4CCFF",rent:"#B98CFF",utilities:"#8A5CF0",household:"#D45CE8",
           personal:"#F07AD8",us:"#FF7BA8",installments:"#5B3AA8",buffer:"#8A8A98",oneoff:"#FF4D62"};
/* which drawn symbol stands for each category */
var CATSYM={savings:"savings",rent:"house",utilities:"bolt",household:"cart",
            personal:"person",us:"heart",installments:"card",buffer:"buffer",oneoff:"warning"};
/* fixed = paid automatically, never logged · variable = you log it
   savings = the target · buffer = slack, becomes savings if unused */
var CATS=[
  {id:"savings",name:"Savings",type:"savings",note:"Leaves on payday, before anything else"},
  {id:"rent",name:"Rent",type:"fixed",note:""},
  {id:"utilities",name:"Electricity + Wi-Fi",type:"fixed",note:""},
  {id:"household",name:"Household",type:"variable",note:""},
  {id:"personal",name:"Personal",type:"variable",note:""},
  {id:"us",name:"Us",type:"variable",note:"Dinners out, weekends away"},
  {id:"installments",name:"Installments",type:"fixed",note:"Move to savings when they clear"},
  {id:"buffer",name:"Buffer",type:"buffer",note:"Set aside for small surprises. Whatever you don't use becomes savings when the month closes"}
];
/* Neutral starting numbers — this file sits at a public web address, so
   nothing personal is baked in. Your real figures live only on your phone. */
var BASE_ALLOC={savings:2000,rent:3000,utilities:300,household:2000,personal:1000,us:800,installments:0,buffer:900};
var BASE_LOCK={rent:true,utilities:true,installments:true};
var BASE_GOALS=[
  {id:"emergency",name:"Emergency Fund",e:"shield",target:40000,pct:40,col:"#9E5BFF",lock:false},
  {id:"morocco",name:"House Deposit",e:"house",target:168000,pct:40,col:"#D45CE8",lock:false},
  {id:"study",name:"Wife Study",e:"graduation",target:10000,pct:10,col:"#FF7BA8",lock:false},
  {id:"travel",name:"Travel Fund",e:"plane",target:20000,pct:10,col:"#C9A6FF",lock:false}
];
function fresh(){return{salary:10000,goals:JSON.parse(JSON.stringify(BASE_GOALS)),months:{},
  tab:"home",monthCursor:null,weekIdx:null,pick:"household",lastBackup:null,name:"",wiGoal:null,more:false,returnTab:"home",wiAmt:0,cycleStart:15,clamp:null,card:{limit:0,used:0,payDay:18,lastPaid:null},payMethod:"bank",
  notes:[],noteId:null,noteQ:"",impact:0,calc:null,delArm:null,newg:false,bkAdv:false,allocInfo:false,addGiven:false,addBorrowed:false,
  outside:{given:[],borrowed:[]},outTab:"given",outArm:null};}

var S=(function(){
  try{var r=store.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.months)return p;}}catch(e){}
  return fresh();
})();
/* carry an older save forward: two targets become four jars */
if(!S.goals){
  S.goals=JSON.parse(JSON.stringify(BASE_GOALS));
  if(S.targets){
    if(S.targets.emergency)S.goals[0].target=S.targets.emergency;
    if(S.targets.morocco)S.goals[1].target=S.targets.morocco;
  }
}
/* Money outside arrived after some saves were written, so make room for
   it without touching anything else that is already there. */
(function migrateOutside(){
  if(!S.outside||typeof S.outside!=="object")S.outside={given:[],borrowed:[]};
  if(!(S.outside.given instanceof Array))S.outside.given=[];
  if(!(S.outside.borrowed instanceof Array))S.outside.borrowed=[];
})();

/* Goals made before the graphite palette hold one of the old colours in
   `col`. The colour is decoration, not data, so it is carried across to
   the nearest colour in the new set — one goal never lands on the same
   colour as another, and a colour that is not in the old set is left
   exactly as the user chose it. */
var CLEGACY={"#7B72FF":"#9E5BFF","#2FD4BC":"#D45CE8","#FFB33D":"#FF7BA8",
             "#FF7A5C":"#C9A6FF","#5AC8FA":"#B98CFF","#C77DFF":"#F0A6FF",
             "#4ADE80":"#6E3FD1","#F472B6":"#8A8A98","#B08CFF":"#C9A6FF",
             "#5A52D9":"#6E3FD1","#8DA88F":"#8A8A98","#FF5C8A":"#F07AD8"};
(function migrateColours(){
  if(!(S.goals instanceof Array))return;
  var moved=false;
  S.goals.forEach(function(g){
    var c=String(g.col||"").toUpperCase();
    if(CLEGACY[c]){g.col=CLEGACY[c];moved=true;}
  });
  if(moved)try{save();}catch(e){}
})();

/* A closed month with no split of its own used to fall back to today's
   percentages, which meant editing a share rewrote history. Now closed
   months never look at today — so any month that was saved without a
   split gets one written once, from the percentages in force right now,
   and from then on it is fixed like every other month. */
(function migrateSplits(){
  var t=thisMonth(),k,changed=false;
  for(k in S.months){
    if(!Object.prototype.hasOwnProperty.call(S.months,k))continue;
    if(S.months[k]&&!S.months[k].split){S.months[k].split=currentSplit();changed=true;}
  }
  if(changed)try{store.setItem(KEY,JSON.stringify(S));}catch(e){}
})();

function save(){try{store.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ═══ 3. CALENDAR ═══ */
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* ══ THE FINANCIAL MONTH ══
   A month runs from the day your money arrives, not from the 1st.
   With a start day of 15, "August 2026" means 15 Aug → 14 Sep.
   Set it to 1 and everything collapses back to calendar months. */
function cycleStart(){return Math.min(31,Math.max(1,S.cycleStart||1));}
function clampDay(y,m,day){return Math.min(day,new Date(y,m+1,0).getDate());}
function mKey(d){
  var y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<clampDay(y,m,cycleStart())){m-=1;if(m<0){m=11;y-=1;}}
  return y+"-"+String(m+1).padStart(2,"0");
}
function periodStart(k){
  var d=mParse(k),y=d.getFullYear(),m=d.getMonth();
  return new Date(y,m,clampDay(y,m,cycleStart()),0,0,0);
}
function periodEnd(k){
  var d=mParse(k),y=d.getFullYear(),m=d.getMonth()+1;
  if(m>11){m=0;y+=1;}
  var nxt=new Date(y,m,clampDay(y,m,cycleStart()),0,0,0);
  return new Date(nxt.getTime()-864e5+86399000);
}
function periodDays(k){return Math.round((periodEnd(k).getTime()+1000-periodStart(k).getTime())/864e5);}
function periodLabel(k){
  if(cycleStart()===1)return mName(k);
  var a=periodStart(k),b=periodEnd(k);
  return a.getDate()+" "+MOS[a.getMonth()]+" \u2013 "+b.getDate()+" "+MOS[b.getMonth()];
}
function periodDay(k){
  if(k!==thisMonth())return periodDays(k);
  return Math.max(1,Math.min(periodDays(k),Math.floor((Date.now()-periodStart(k))/864e5)+1));
}
function mParse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1);}
function mName(k){var d=mParse(k);return MO[d.getMonth()]+" "+d.getFullYear();}
function mShort(k){return MOS[mParse(k).getMonth()];}
function thisMonth(){return mKey(new Date());}
function allMonths(){return Object.keys(S.months).sort();}
function prevOf(k){return allMonths().filter(function(x){return x<k;}).pop()||null;}
function ensureMonth(){
  var k=thisMonth();
  if(S.months[k])return k;
  var p=prevOf(k),src=p?S.months[p]:null;
  S.months[k]={salary:src?src.salary:S.salary,
    alloc:src?JSON.parse(JSON.stringify(src.alloc)):JSON.parse(JSON.stringify(BASE_ALLOC)),
    locks:src?JSON.parse(JSON.stringify(src.locks)):JSON.parse(JSON.stringify(BASE_LOCK)),
    changes:[],spend:[],override:null,split:currentSplit()};
  applyCardPayments();save();return k;
}
/* build the next period from the latest one, so you can plan forward */
function makeNext(k){
  var d=mParse(k);d.setMonth(d.getMonth()+1);
  var nk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(!S.months[nk]){
    var src=M(k);
    S.months[nk]={salary:src.salary,
      alloc:JSON.parse(JSON.stringify(src.alloc)),
      locks:JSON.parse(JSON.stringify(src.locks)),
      changes:[],spend:[],override:null,split:currentSplit()};
  }
  return nk;
}
function cur(){var k=S.monthCursor||thisMonth();return S.months[k]?k:thisMonth();}
function M(k){return S.months[k];}
function isLive(k){return k===thisMonth();}
function isSettled(k){return k<thisMonth();}   /* only the past is finished */
function isAhead(k){return k>thisMonth();}

/* ═══ 4. THE EQUATION ═══
   saved = salary − fixed bills − actual variable spend − one-offs */
function fixedTotal(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="fixed")t+=(m.alloc[c.id]||0);});return t;}
function budgetVariable(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="variable")t+=(m.alloc[c.id]||0);});return t;}
function spentOn(k,id){return M(k).spend.reduce(function(s,e){return e.cat===id?s+e.amount:s;},0);}
function spentVariable(k){return M(k).spend.reduce(function(s,e){
  return (e.cat!=="oneoff"&&e.cat!=="buffer")?s+e.amount:s;},0);}
/* ═══ MONEY OUTSIDE ═══
   Two opposite things, deliberately modelled differently.

   GIVEN — money handed to someone with no reliable date of return.
   The moment it leaves, it is gone as far as planning is concerned:
   it lowers what you have exactly as an unplanned purchase does, and
   it is never counted as money coming back. The record exists so you
   can remember what you gave and to whom, not so you can spend it
   twice. If it does come back one day, that is recorded on the day it
   actually happens and only then does the money reappear.

   BORROWED — money someone handed to you. It touches the equation not
   at all: it is not salary, not savings, and it cannot raise your
   health or feed a goal. It is an obligation, and the only number the
   app keeps about it is how long you have had it. Repaying it is
   real money leaving, so that does count. */
function OUT(){return S.outside||(S.outside={given:[],borrowed:[]});}
function givenList(){return OUT().given||[];}
function borrowedList(){return OUT().borrowed||[];}
function dayKey(iso){                       /* which financial month a date falls in */
  if(!iso)return null;
  var p=String(iso).split("-");
  if(p.length<3)return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return isNaN(d)?null:mKey(d);
}
function todayISO(){return isoDay(new Date());}

/* what left your hands this month because you gave it away */
function givenOf(k){
  return givenList().reduce(function(s,g){
    return dayKey(g.on)===k?s+Math.max(0,g.amount||0):s;},0);
}
/* what left your hands this month because you paid a debt back */
function repaidOf(k){
  return borrowedList().reduce(function(s,b){
    return (b.repaidOn&&dayKey(b.repaidOn)===k)?s+Math.max(0,b.amount||0):s;},0);
}
/* what actually came back this month, on the day it really arrived */
function returnedOf(k){
  return givenList().reduce(function(s,g){
    return (g.backOn&&dayKey(g.backOn)===k)?s+Math.max(0,g.back||g.amount||0):s;},0);
}

/* still out there, and still borrowed */
function givenOutstanding(){
  return givenList().reduce(function(s,g){return g.backOn?s:s+Math.max(0,g.amount||0);},0);
}
function givenPeople(){
  var seen={},n=0;
  givenList().forEach(function(g){
    if(g.backOn)return;
    var p=(g.person||"").trim().toLowerCase();
    if(p&&!seen[p]){seen[p]=1;n++;}
  });
  return n;
}
function owedOutstanding(){
  return borrowedList().reduce(function(s,b){return b.repaidOn?s:s+Math.max(0,b.amount||0);},0);
}
/* how long a debt has stood, in plain words — no countdown, no target */
function ageOf(iso){
  var d=dayKey(iso)?new Date(String(iso).split("-")[0],+String(iso).split("-")[1]-1,+String(iso).split("-")[2]):null;
  if(!d||isNaN(d))return "";
  var days=Math.floor((Date.now()-d.getTime())/864e5);
  if(days<0)return "";
  if(days<1)return "today";
  if(days<31)return days+" day"+(days===1?"":"s");
  var mo=Math.floor(days/30.44);
  if(mo<12)return mo+" month"+(mo===1?"":"s");
  var yr=Math.floor(mo/12),rem=mo%12;
  return yr+" year"+(yr===1?"":"s")+(rem?" "+rem+" month"+(rem===1?"":"s"):"");
}
/* the age of the oldest debt, phrased so it reads as a sentence */
function debtAgeLine(){
  var a=oldestDebtAge();
  if(!a)return "still to repay";
  if(a==="today")return "borrowed today";
  return "borrowed "+a+" ago";
}
function oldestDebtAge(){
  var out=borrowedList().filter(function(b){return !b.repaidOn;});
  if(!out.length)return "";
  var oldest=out.slice().sort(function(a,b){return String(a.on)<String(b.on)?-1:1;})[0];
  return ageOf(oldest.on);
}

/* ── how this reaches the month's arithmetic ──
   Unplanned money out is unplanned money out, whatever its reason, so
   giving and repaying travel down exactly the same channel a one-off
   does: buffer first, then savings. What changes is only how it is
   REPORTED, so spending never looks bigger than what you consumed. */
function consumedOneoff(k){return M(k).spend.reduce(function(s,e){return e.cat==="oneoff"?s+e.amount:s;},0);}
function spentOneoff(k){return consumedOneoff(k)+givenOf(k)+repaidOf(k);}
/* ── the buffer ──
   Not a goal and not savings: an allowance held back each month for
   small surprises. While the month is live the whole allowance is
   reserved. When the month closes, whatever went unused stops being
   reserved and becomes savings, which then flows into the goals on
   that month's frozen split. The allowance itself never carries over. */
function bufferAmount(k){return M(k).alloc.buffer||0;}
/* Order money is taken in: the buffer first, savings only for what is
   left over. That is what the buffer is for — it protects the plan.

   Unless you lock it. A lock anywhere in this app means the same thing:
   this money does not move. So a locked buffer is not offered to a
   one-off at all, and the whole purchase lands on savings.          */
function bufferOpen(k){return !M(k).locks.buffer;}
function bufferUsed(k){return bufferOpen(k)?Math.min(spentOneoff(k),bufferAmount(k)):0;}
function bufferLeft(k){return Math.max(0,bufferAmount(k)-bufferUsed(k));}
function bufferFree(k){return bufferOpen(k)?bufferLeft(k):0;}
function oneoffOverflow(k){return Math.max(0,spentOneoff(k)-bufferUsed(k));}
function bufferCharge(k){return isSettled(k)?bufferUsed(k):Math.max(bufferAmount(k),bufferUsed(k));}
function bufferReturned(k){return isSettled(k)?bufferLeft(k):0;}
/* where the next ¥x would come from, and whether it can be covered */
function sourceCheck(k,extra){
  if(!extra||extra<=0)return null;
  var free=bufferFree(k),fromBuf=Math.min(extra,free),fromSav=extra-fromBuf;
  var savLeft=Math.max(0,savedActual(k));
  if(fromSav>savLeft)return{ok:false,buf:fromBuf,sav:fromSav,short:fromSav-savLeft,savLeft:savLeft};
  return{ok:true,buf:fromBuf,sav:fromSav,bufAfter:free-fromBuf,savAfter:savLeft-fromSav};
}
function totalOut(k){return fixedTotal(k)+spentVariable(k)+bufferUsed(k)+oneoffOverflow(k);}
function monthProgress(k){
  var t=thisMonth();
  if(k<t)return 1;if(k>t)return 0;
  return Math.max(0,Math.min(1,periodDay(k)/periodDays(k)));
}
/* One equation, and only one. The regular budget is assumed spent —
   you are not logging groceries — so the only thing that moves your
   savings is an unplanned one-off, or blowing past the budget itself.

   saved = salary − fixed bills − spending budget − buffer used − one-offs   */
function assumedSpend(k){return Math.max(budgetVariable(k),spentVariable(k));}
/* What the equation expects, before you tell it otherwise. */
function savedProjected(k){
  var m=M(k);
  /* returnedOf is 0 unless something you gave away actually came back
     in this month, so every month without a return is unchanged */
  return m.salary-fixedTotal(k)-assumedSpend(k)-bufferCharge(k)-oneoffOverflow(k)+returnedOf(k);
}
/* The best figure available: what you recorded if you recorded it,
   otherwise what the equation expects. */
function savedActual(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return m.override;
  return savedProjected(k);
}
function savedNow(k){return savedActual(k);}
function savedPlanned(k){return M(k).alloc.savings||0;}
/* one-offs are unplanned, but the buffer takes them first — only the
   part past the buffer ever touches savings, matching the equation */
function effSavings(k){return (M(k).alloc.savings||0)-oneoffOverflow(k);}
/* ═══ FINANCIAL HEALTH ═══
   Two questions blended, because either alone lies.

   1. Attainment — did you hit the target YOU set?   saved / planned
      Weighted 70%. This is what the glow mostly tracks, and it is what
      a one-off destroys: buy a ¥4,000 TV against a ¥4,500 plan and
      attainment collapses from 1.0 to 0.11.

   2. Depth — is the target itself worth hitting?    saved / salary
      Weighted 30%, full marks at a 30% savings rate. Without this you
      could set a ¥200 target, hit it, and glow green while keeping
      almost nothing.

   Saving nothing, or less than nothing, is 0 regardless.            */
function healthFrom(salary,saved,planned){
  /* With no salary there is nothing to score. A made-up 50 read as
     "average" when the truth is "unknown", so it now returns null and
     the screen shows a dash. */
  if(salary<=0)return null;
  if(saved<=0)return 0;
  var att=planned>0?Math.min(1,saved/planned):1;
  var depth=Math.min(1,(saved/salary)/0.30);
  return Math.round(100*(0.7*att+0.3*depth));
}
function healthScore(k){return healthFrom(M(k).salary,savedActual(k),savedPlanned(k));}
function healthText(v){return v===null?"\u2014":String(v);}
/* Four stops, interpolated — the colour slides through the scale
   rather than snapping between four fixed states. */
/* red → amber → a pale neutral → the app's own plum. The neutral stop
   in the middle keeps the warm and cool halves from mixing into mud. */
var HEALTH_STOPS=[[0,[255,77,98]],[38,[232,162,60]],[70,[214,200,220]],[100,[212,92,232]]];
function healthRGB(v){
  v=Math.max(0,Math.min(100,v));
  for(var i=1;i<HEALTH_STOPS.length;i++){
    if(v<=HEALTH_STOPS[i][0]){
      var a=HEALTH_STOPS[i-1],b=HEALTH_STOPS[i],t=(v-a[0])/(b[0]-a[0]);
      return [0,1,2].map(function(j){return Math.round(a[1][j]+(b[1][j]-a[1][j])*t);});
    }
  }
  return [212,92,232];
}
function healthColor(v){return v===null?"var(--muted)":"rgb("+healthRGB(v).join(",")+")";}
function healthRGBA(v,al){return v===null?"rgba(155,155,166,"+al+")":"rgba("+healthRGB(v).join(",")+","+al+")";}
function healthWhy(k,v){
  var m=M(k),saved=savedActual(k),planned=savedPlanned(k),oo=spentOneoff(k);
  var rate=m.salary>0?Math.round(Math.max(0,saved)/m.salary*100):0;
  if(m.salary<=0)return "Set your salary and this comes alive.";
  if(saved<0)return "You are spending \u00A5"+fmt(-saved)+" more than you earn this month.";
  if(oo>0&&saved<planned)
    return "\u00A5"+fmt(oo)+" of unplanned spending has taken your savings from \u00A5"+fmt(planned)+
           " down to \u00A5"+fmt(saved)+" \u2014 "+rate+"% of what you earn.";
  if(oo>0&&saved>=planned)
    return "\u00A5"+fmt(oo)+" of unplanned spending, absorbed by your buffer \u2014 the plan held at \u00A5"+
           fmt(saved)+", "+rate+"% of what you earn.";
  if(saved>=planned)return "On target at \u00A5"+fmt(saved)+", "+rate+"% of what you earn. Nothing unplanned so far.";
  return "Saving \u00A5"+fmt(saved)+" against a \u00A5"+fmt(planned)+" target \u2014 "+rate+"% of what you earn.";
}
function healthLabel(v){
  if(v===null)return "Not enough to go on";
  return v>=80?"On track":v>=60?"Slightly behind":v>=35?"Saving pressure":"Overspending risk";
}
function savingsRate(k){var m=M(k);return m.salary>0?Math.max(0,savedNow(k))/m.salary*100:0;}
function loggingThin(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return false;
  if(k>=thisMonth())return false;
  var b=budgetVariable(k);return b>0&&spentVariable(k)<b*0.4;
}

/* ═══ 5. GOALS · STREAK · MILESTONES ═══ */
function closedMonths(){var t=thisMonth();return allMonths().filter(function(k){return k<t;});}
function banked(){return closedMonths().reduce(function(s,k){return s+Math.max(0,savedActual(k));},0);}
/* ── how a month's saving is divided ──
   A goal is a pool. Its percentage decides how much of THIS month's
   saving joins the pool; the pool itself is the sum of every month's
   contribution and never resets.

   A percentage means what it says. 40% is 40% of what you saved, not
   "40 parts of however many were handed out" — so if the shares add up
   to 80%, the remaining 20% is simply unallocated, and the app says so
   instead of quietly pushing it somewhere. */
function jarPct(j){return Math.max(0,Math.min(100,j.pct||0));}
function pctTotal(){return S.goals.reduce(function(s,g){return s+jarPct(g);},0);}
function freeRoom(){return Math.max(0,100-pctTotal());}   /* still unclaimed */
/* ── monthly snapshots ──
   Each month freezes the split that was in force while it was live.
   A month that has ended never changes again, so moving an allocation
   today shapes future contributions without rewriting your history. */
function currentSplit(){var o={};S.goals.forEach(function(g){o[g.id]=jarPct(g);});return o;}

/* A month that has ended keeps the split it was living under, full stop.
   It never borrows today's percentages — that is what would rewrite
   July when you edit August. Only the live month and months still ahead
   follow a change made now. */
function splitOf(k){
  var m=M(k);
  if(!m)return {};
  if(m.split)return m.split;
  return k<thisMonth()?{}:currentSplit();
}
function stampSplit(){
  var t=thisMonth();
  allMonths().forEach(function(k){
    /* Once a month is confirmed it is settled in substance, even if the
       calendar has not caught up — so a change made now cannot reach
       back into money that has already been banked. */
    if(k>=t&&!isConfirmed(k))S.months[k].split=currentSplit();
  });
}
/* What this month actually puts into one goal */
/* ── planned, projected, banked ──
   Three different things the app used to run together.

   PLANNED    what the plan says should happen. Exists for any month,
              including ones that have not started.
   PROJECTED  what the equation expects the live month to leave, if
              nothing else happens. Still a prediction.
   BANKED     money that is actually there. A month that has ended is
              banked by definition; a month still running is banked
              only once you record what you really saved.

   A plan can predict money, but a prediction must never become money
   you have already saved — so only BANKED reaches a goal's balance. */
function isConfirmed(k){
  var m=M(k);
  if(!m)return false;
  if(isSettled(k))return true;                       /* the past is finished */
  return m.override!==null&&m.override!==undefined;  /* you told us yourself */
}
/* What to call a month's saving, given whether the money is real yet */
function savedWord(k,cap){
  var w=isSettled(k)?"saved"
       :isConfirmed(k)?"banked so far"
       :isAhead(k)?"planned"
       :"projected";
  return cap?w.charAt(0).toUpperCase()+w.slice(1):w;
}
function savedConfirmed(k){
  if(!M(k))return 0;
  return isConfirmed(k)?savedActual(k):0;
}

/* what a month has actually put into a goal */
function contribution(k,id){
  var sp=splitOf(k);
  return Math.max(0,savedConfirmed(k))*(sp[id]||0)/100;
}
/* what a month is expected to put in, if the plan holds */
function plannedContribution(k,id){
  var sp=splitOf(k);
  return Math.max(0,savedProjected(k))*(sp[id]||0)/100;
}
/* What a month saved but handed to no goal */
function unallocatedPctOf(k){
  var sp=splitOf(k),t=0,i;
  for(i in sp)t+=sp[i]||0;
  return Math.max(0,100-t);
}
function unallocatedOf(k){return Math.max(0,savedActual(k))*unallocatedPctOf(k)/100;}
/* what a jar held at the end of month k */
function jarBalanceAt(k,g){
  return closedMonths().filter(function(x){return x<=k;})
    .reduce(function(s,x){return s+contribution(x,g.id);},0);
}
/* Everything carried in from months that have closed */
function jarBanked(g){
  return closedMonths().reduce(function(s,k){return s+contribution(k,g.id);},0);
}
/* What the live month has added so far */
/* what the live month has actually banked into a goal — zero until the
   month is confirmed, however healthy the projection looks */
function jarBankedThisMonth(g){return contribution(thisMonth(),g.id);}
/* what a given month expects to put in. Takes the month being viewed,
   so an upcoming page talks about that month and not this one. */
function jarPlannedIn(k,g){return plannedContribution(k,g.id);}
/* The pool: every yen confirmed into it, and nothing that is merely
   expected. Progress and "remaining" are measured against this. */
function jarBalance(g){return jarBanked(g)+jarBankedThisMonth(g);}
function jarLeft(j){return Math.max(0,j.target-jarBalance(j));}
function jarRate(j){return monthlyRate()*jarPct(j)/100;}
function jarETA(j){return etaFor(jarLeft(j),jarRate(j));}
function jarDone(j){return jarBalance(j)>=j.target;}
function topJar(){
  for(var i=0;i<S.goals.length;i++)if(!jarDone(S.goals[i]))return S.goals[i];
  return S.goals[0];
}
/* One share moves, the unlocked ones absorb it, the total stays at 100.
   A locked goal is never touched by someone else's change — it only
   moves when you change it yourself. */
function jarLocked(g){return !!g.lock;}
/* Setting one goal's share leaves every other goal exactly as it was.
   The only limit is arithmetic: the shares cannot add to more than the
   money you saved, so a share is capped by whatever is still unclaimed.
   Whatever you leave over stays unallocated, visibly. */
function setPct(g,want){
  if(!g)return 0;
  if(jarLocked(g))return jarPct(g);            /* a locked share is not moved */
  var others=S.goals.reduce(function(s,x){return x.id===g.id?s:s+jarPct(x);},0);
  var ceiling=Math.max(0,100-others);
  g.pct=Math.max(0,Math.min(ceiling,Math.round(want||0)));
  return g.pct;
}
function moveGoal(id,dir){
  var i=S.goals.findIndex(function(g){return g.id===id;}),j=i+dir;
  if(i<0||j<0||j>=S.goals.length)return;
  var t=S.goals[i];S.goals[i]=S.goals[j];S.goals[j]=t;
}
/* ── deadlines ──
   A date on its own would be decoration. It is only ever shown against
   the ETA your own saving rate produces, so it can tell you one thing:
   whether the rate you are actually saving at gets there in time.
   It changes no allocation and no total. */
function monthsNeeded(g){
  var left=jarLeft(g);if(left<=0)return 0;
  var r=jarRate(g);return r>0?Math.ceil(left/r):Infinity;
}
function monthsUntil(due){
  if(!due||due.length<7)return null;
  var y=+due.slice(0,4),m=+due.slice(5,7),n=new Date();
  if(!y||!m)return null;
  return (y-n.getFullYear())*12+(m-1-n.getMonth());
}
function dueLabel(due){return MOS[+due.slice(5,7)-1]+" "+due.slice(0,4);}
function dueText(g){
  var away=monthsUntil(g.due);
  if(away===null)return null;
  var lbl="by "+dueLabel(g.due);
  if(jarDone(g))return{t:lbl+" \u00B7 reached",c:"var(--teal)"};
  var need=monthsNeeded(g);
  if(need===Infinity)return{t:lbl+" \u00B7 no saving rate yet",c:"var(--faint)"};
  var late=need-away;
  if(late<=0){
    var early=-late;
    if(early<1)return{t:lbl+" \u00B7 on pace",c:"var(--teal)"};
    if(early>24)return{t:lbl+" \u00B7 well ahead",c:"var(--teal)"};
    return{t:lbl+" \u00B7 about "+early+" month"+(early===1?"":"s")+" ahead",c:"var(--teal)"};
  }
  if(late>24)return{t:lbl+" \u00B7 behind target",c:"var(--coral)"};
  return{t:lbl+" \u00B7 behind by "+late+" month"+(late===1?"":"s"),c:"var(--coral)"};
}
/* ── adding and removing a goal ──
   A new goal takes its share out of the unlocked ones, exactly as
   moving a slider does. Closed months keep the split they froze, so
   nothing already banked is re-cut. */
var GCOL=["#9E5BFF","#D45CE8","#FF7BA8","#C9A6FF","#B98CFF","#F0A6FF","#6E3FD1","#8A8A98"];
var GEMO=["shield","house","graduation","plane","car","gift","laptop","star"];
function nextCol(){
  var used=S.goals.map(function(g){return g.col;});
  for(var i=0;i<GCOL.length;i++)if(used.indexOf(GCOL[i])<0)return GCOL[i];

/* ═══ 6. INSIGHTS ═══
   Everything below reads figures the app already keeps. Nothing new is
   calculated about your money, and nothing is claimed when the record
   is too short to support it — each function returns null instead. */

/* What you have actually put away in recent closed months. Needs at
   least two, or there is no "usual" to compare against. */
function recentAverage(exclude){
  var v=closedMonths().filter(function(k){return k!==exclude;}).slice(-3)
        .map(function(k){return Math.max(0,savedActual(k));});
  if(v.length<2)return null;
  return v.reduce(function(a,b){return a+b;},0)/v.length;
}
/* The goal whose deadline is nearest, if any goal has one at all */

  if(!due.length)return null;
  return due.sort(function(a,b){return monthsUntil(a.due)-monthsUntil(b.due);})[0];

/* One sentence of plain reading for the Journey comparison. It only
   says what the months on record support. */
function journeyRead(k,p){
  var now=Math.max(0,savedActual(k)),was=Math.max(0,savedActual(p));
  var avg=recentAverage(k);

    if(now>avg*1.05)return "You are putting away more than your recent average \u2014 your saving rate is improving.";
    if(now<avg*0.95)return "This month is below your recent average. One month is not a trend, but two would be.";
    return "This month is in line with your recent average \u2014 steady.";
  }
  if(Math.abs(d)<200)return "About the same as "+mShort(p)+".";

    ? "Better than "+mShort(p)+". A third month will show whether it is a trend."

/* ── one line for Home ──
   In priority order, first match wins, so the screen never shows two
   findings that pull against each other. Returns null when there is
   nothing worth saying, and Home then shows nothing. */
function headline(k){
  var sv=savedNow(k),oo=spentOneoff(k),prev=prevOf(k);

  /* 1. money that left the plan unplanned — the most actionable thing */
  if(oo>0){
    var days=Math.round(oo/monthlyRate()*30);
    return{i:"warning",c:"var(--saffron)",
      t:"Unplanned spending has taken <b>\u00A5"+fmt(oo)+"</b> out of this month\u2019s savings"+
        (monthlyRate()>0&&days>2?", about <b>"+days+" days</b> off your goals":"")+"."};
  }

  /* 2. against your own recent record */
  var avg=recentAverage(k);
  if(avg!==null&&avg>0){
    var diff=sv-avg,pct=Math.round(Math.abs(diff)/avg*100);

      return{i:diff>0?"up":"down",c:diff>0?"var(--teal)":"var(--coral)",
        t:"Saving <b>"+pct+"% "+(diff>0?"more":"less")+"</b> than your recent average of \u00A5"+fmt(Math.round(avg))+"."};
  }

  /* 3. against last month, when there is no average yet */
  if(prev){
    var d=sv-Math.max(0,savedActual(prev));
    if(Math.abs(d)>=200)
      return{i:d>0?"up":"down",c:d>0?"var(--teal)":"var(--coral)",
        t:"Saving <b>\u00A5"+fmt(Math.abs(d))+(d>0?" more":" less")+"</b> than "+mShort(prev)+"."};
  }

  /* 4. the nearest promise you made yourself */

  }

  /* 5. nothing to compare against yet */

/* ═══ 8. BALANCE ENGINE ═══ */
/* No line can claim money that is not there. Whatever you are moving is
   capped at income minus everything locked; the unlocked lines share the
   rest. The total can never exceed your salary. */
function balance(k,pin){
  var m=M(k),lockedSum=0,pool=[];
  CATS.forEach(function(c){
    if(c.id===pin)return;
    if(m.locks[c.id])lockedSum+=(m.alloc[c.id]||0);else pool.push(c.id);
  });
  var room=Math.max(0,m.salary-lockedSum);
  if(pin){
    var want=m.alloc[pin]||0;
    if(want>room){
      S.clamp={id:pin,want:want,got:room,locked:lockedSum,ts:Date.now()};
      m.alloc[pin]=room;
    }else if(S.clamp&&S.clamp.id===pin)S.clamp=null;
  }
  if(!pool.length)return;
  var target=Math.max(0,room-(pin?(m.alloc[pin]||0):0));
  var sum=pool.reduce(function(s,id){return s+(m.alloc[id]||0);},0);
  if(sum<=0){var e=target/pool.length;pool.forEach(function(id){m.alloc[id]=Math.round(e);});}
  else{var r=target/sum;pool.forEach(function(id){m.alloc[id]=Math.max(0,Math.round((m.alloc[id]||0)*r));});}
  var drift=m.salary-CATS.reduce(function(s,c){return s+(m.alloc[c.id]||0);},0);
  if(drift!==0){
    var big=pool.reduce(function(x,y){return (m.alloc[x]||0)>=(m.alloc[y]||0)?x:y;});
    m.alloc[big]=Math.max(0,(m.alloc[big]||0)+drift);
  }
}

function ringSVG(pct,color){
  var R=44,C=2*Math.PI*R,len=Math.max(0,Math.min(100,pct))/100*C;
  return '<svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">'+
    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#26262D" stroke-width="9"/>'+
    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/></g></svg>';
}
function donutSVG(rows){
  var total=rows.reduce(function(s,r){return s+r.value;},0);
  if(total<=0)return null;
  var R=42,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">';
  rows.forEach(function(r){
    var len=r.value/total*C,seg=Math.max(0.5,len-1.6);
    s+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+r.color+'" stroke-width="13" '+
       'stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len;
  });
  return s+'</g></svg>';
}
function barChart(rows,h){
  h=h||62;
  if(!rows.length)return '<div class="empty">Nothing to chart yet.</div>';
  var W=100,n=rows.length,max=Math.max.apply(null,rows.map(function(r){return Math.max(r.value,r.target||0);}))||1;
  var gap=1.6,bw=(W-gap*(n-1))/n;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none">';
  rows.forEach(function(r,i){
    var x=i*(bw+gap),bh=r.value/max*h,y=h-bh;
    if(r.target){var ty=h-(r.target/max*h);
      s+='<line x1="'+x+'" y1="'+ty+'" x2="'+(x+bw)+'" y2="'+ty+'" stroke="rgba(255,255,255,.32)" stroke-width=".7" stroke-dasharray="1.6 1.4"/>';}
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,.8)+'" rx="1.2" fill="'+(r.color||"#9E5BFF")+'" opacity="'+(r.faded?.45:1)+'"/>';
  });
  s+='</svg><div style="display:flex;gap:1.6%;margin-top:5px">';
  rows.forEach(function(r){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--faint)">'+r.label+'</div>';});
  return s+'</div>';
}
function pairChart(rows){
  if(!rows.length)return '<div class="empty">Nothing to chart yet.</div>';
  var W=100,H=58,n=rows.length;
  var max=Math.max.apply(null,rows.map(function(r){return Math.max(r.a,r.b);}))||1;
  var gp=3,grp=(W-gp*(n-1))/n,bw=(grp-1.2)/2;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';
  rows.forEach(function(r,i){
    var x=i*(grp+gp),ha=r.a/max*H,hb=r.b/max*H;
    s+='<rect x="'+x+'" y="'+(H-ha)+'" width="'+bw+'" height="'+Math.max(ha,.8)+'" rx="1.1" fill="#9E5BFF"/>'+
       '<rect x="'+(x+bw+1.2)+'" y="'+(H-hb)+'" width="'+bw+'" height="'+Math.max(hb,.8)+'" rx="1.1" fill="#FF4D62"/>';
  });
  s+='</svg><div style="display:flex;gap:3%;margin-top:5px">';
  rows.forEach(function(r){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:8.5px;color:var(--faint)">'+r.label+'</div>';});
  return s+'</div><div style="display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--muted)">'+
    '<span><i style="display:inline-block;width:8px;height:8px;border-radius:8px;background:#9E5BFF;margin-right:6px"></i>In</span>'+
    '<span><i style="display:inline-block;width:8px;height:8px;border-radius:8px;background:#FF4D62;margin-right:6px"></i>Out</span></div>';
}
function areaChart(vals,labels,color){
  if(vals.length<2)return '<div class="empty">Two months of history will draw a curve here.</div>';
  /* A real aspect ratio rather than a squashed box: circles stay round,
     the stroke keeps its weight, and the line can be smoothed. */
  var W=320,H=132,PAD=9,max=Math.max.apply(null,vals)||1;
  var pts=vals.map(function(v,i){
    return[PAD+(i/(vals.length-1))*(W-PAD*2), H-PAD-(v/max)*(H-PAD*2)];
  });
  /* Catmull-Rom through the points, expressed as beziers — the flowing
     curve the flat polyline never had. */
  var d="M"+pts[0][0].toFixed(2)+" "+pts[0][1].toFixed(2),i;
  for(i=0;i<pts.length-1;i++){
    var p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    var c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    var c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=" C"+c1x.toFixed(2)+" "+c1y.toFixed(2)+","+c2x.toFixed(2)+" "+c2y.toFixed(2)+
       ","+p2[0].toFixed(2)+" "+p2[1].toFixed(2);
  }
  var last=pts[pts.length-1],gid="ag"+Math.round(Math.random()*1e6);
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'">'+
    '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0%" stop-color="'+color+'" stop-opacity=".34"/>'+
    '<stop offset="100%" stop-color="'+color+'" stop-opacity="0"/>'+
    '</linearGradient></defs>'+
    '<path d="'+d+' L'+last[0].toFixed(2)+' '+H+' L'+pts[0][0].toFixed(2)+' '+H+' Z" fill="url(#'+gid+')"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  /* every reading is a small mark; where the line has got to is a
     lit dot, which is the one thing the eye should land on */
  pts.slice(0,-1).forEach(function(p){
    s+='<circle cx="'+p[0].toFixed(2)+'" cy="'+p[1].toFixed(2)+'" r="2.2" fill="'+color+'" opacity=".55"/>';
  });
  s+='<circle cx="'+last[0].toFixed(2)+'" cy="'+last[1].toFixed(2)+'" r="8" fill="'+color+'" opacity=".2"/>'+
     '<circle cx="'+last[0].toFixed(2)+'" cy="'+last[1].toFixed(2)+'" r="4.2" fill="#fff"/>';
  s+='</svg><div style="display:flex;margin-top:5px">';
  labels.forEach(function(l){s+='<div style="flex:1;text-align:center;font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--faint)">'+l+'</div>';});
  return s+'</div>';
}

/* ══ IN-PLACE UPDATES ══
   A value edit is not a new page. Rebuilding #app.innerHTML for one
   changed number throws away every node on the screen and builds it
   again, which is what the eye sees as a flash — the browser really is
   painting a blank box and then a fresh one.

   So: generate the same HTML as before, but instead of assigning it,
   walk it against what is already on screen and change only the parts
   that differ. Nodes that are unchanged are never touched, which means
   the caret stays in its field, the sheet stays mounted, the scroll
   position never moves, and no animation restarts, because none of
   those elements was ever destroyed.                                */

/* Two nodes are "the same node in a new state" if they are the same
   kind of thing with the same identity. Anything with an id or a
   data- attribute carries its own identity; the rest match by position. */
/* An element's identity, used to decide whether a node on screen and a
   node in the new HTML are the same thing in a new state. It must not be
   built from anything that changes as the numbers change — give such an
   element an id, as #wiCard has, or it will be rebuilt on every edit. */
function domKey(el){
  if(el.id)return "#"+el.id;
  var a=el.attributes,i;
  if(a)for(i=0;i<a.length;i++)if(a[i].name.indexOf("data-")===0)return a[i].name+"\u0000"+a[i].value;
  return null;
}
function domSame(a,b){
  if(a.nodeType!==b.nodeType)return false;
  if(a.nodeType!==1)return true;
  if(a.tagName!==b.tagName)return false;
  return domKey(a)===domKey(b);
}
var FIELDS={INPUT:1,TEXTAREA:1,SELECT:1};
function domAttrs(live,next){
  var i,a,n=next.attributes,o=live.attributes;
  /* An opened explanation is the reader's doing, not the page's, so its
     `open` is theirs to keep across a redraw — the same courtesy the
     field under their finger gets below. */
  var keepOpen=(live.tagName==="DETAILS");
  for(i=0;i<n.length;i++){
    a=n[i];
    if(keepOpen&&a.name==="open")continue;
    if(live.getAttribute(a.name)!==a.value)live.setAttribute(a.name,a.value);
  }
  for(i=o.length-1;i>=0;i--){
    a=o[i];
    if(keepOpen&&a.name==="open")continue;
    if(!next.hasAttribute(a.name))live.removeAttribute(a.name);
  }
  if(FIELDS[live.tagName]){
    /* never reach into the field the finger is in */
    if(document.activeElement===live)return;
    var v=next.tagName==="TEXTAREA"?next.textContent:(next.getAttribute("value")||"");
    if(next.hasAttribute("value")||next.tagName==="TEXTAREA"){
      if(String(live.value)!==String(v))live.value=v;
    }
    if(live.tagName==="INPUT"&&live.type!=="checkbox"&&!next.hasAttribute("value")&&live.value!==""){
      live.value="";
    }
  }
}
function domPatch(live,next){
  if(!domSame(live,next)){
    live.parentNode.replaceChild(next.cloneNode(true),live);
    return;
  }
  if(live.nodeType!==1){
    if(live.nodeValue!==next.nodeValue)live.nodeValue=next.nodeValue;
    return;
  }
  domAttrs(live,next);
  domChildren(live,next);
}
function domChildren(live,next){
  var lk=live.firstChild,nx=next.firstChild,lnext,keep;
  while(nx){
    if(!lk){
      live.appendChild(nx.cloneNode(true));
      nx=nx.nextSibling;continue;
    }
    if(domSame(lk,nx)){
      lnext=lk.nextSibling;
      domPatch(lk,nx);
      lk=lnext;nx=nx.nextSibling;continue;
    }
    /* the expected node is not here: look ahead for it before giving up,
       so a reorder moves a node instead of rebuilding it */
    keep=null;
    for(var c=lk.nextSibling;c;c=c.nextSibling){if(domSame(c,nx)){keep=c;break;}}
    if(keep){
      live.insertBefore(keep,lk);
      domPatch(keep,nx);
      nx=nx.nextSibling;continue;
    }
    live.insertBefore(nx.cloneNode(true),lk);
    nx=nx.nextSibling;
  }
  while(lk){lnext=lk.nextSibling;live.removeChild(lk);lk=lnext;}
}
/* Patch the children of a live element from freshly generated HTML.
   `unwrap` takes the children of the first element instead, for view
   functions that return their own wrapper. */
function domSync(live,html,unwrap){
  if(!live)return false;
  var tmp=document.createElement("div");
  tmp.innerHTML=html;
  var src=tmp;
  if(unwrap){
    src=tmp.firstElementChild;
    if(!src)return false;
  }
  domChildren(live,src);
  return true;
}

   Each one regenerates only its own region and reconciles it. None of

function updateGoalEditorDOM(){
  var app=appEl();

  var sh=document.querySelector("body > .sheet");

  bind();          /* after both, or nodes the sheet patch made get no handler */
  return true;
}
/* the page body, minus any sheet — those live under <body> and are
   patched separately so they stay mounted */
function updateViewDOM(){

}

/* A full rebuild. Reserved for arriving on a different page — every

  ensureMonth();

  detachSheets();

    bar+='<button class="tab'+(on?" on":"")+'" data-t="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>';});
  document.getElementById("bar").innerHTML=bar;

}
/* One class on <html>, so the light behind everything knows whether the
   month is going well. It is the only thing the score changes globally,
   and the difference is barely nameable — which is the point. */

  var v=null;
  try{v=healthScore(cur());}catch(e){}
  var m=v===null?"":v>=80?"mood-good":v>=45?"mood-warn":"mood-bad";
  var c=document.documentElement.classList;
  ["mood-good","mood-warn","mood-bad"].forEach(function(x){if(x!==m)c.remove(x);});

}

/* What you have to spend, shown before anything is typed and moved as
   you type. Standing still it answers "can I afford this?"; while you
   type it answers "what will be left?".                              */
function purseData(k,amt){
  var sav=Math.max(0,savedActual(k)),buf=bufferFree(k);
  var take=Math.max(0,amt||0);
  var fromBuf=Math.min(take,buf),fromSav=Math.min(take-fromBuf,sav);
  var savAfter=sav-fromSav,bufAfter=buf-fromBuf;
  var short=take-fromBuf-fromSav;

  var big=take>0?savAfter:sav;
  var tone=short>0?"bad":(big<=0?"warn":"ok");
  var line1,line2;
  if(take<=0){
    line1=savedWord(k)+" this month";
    line2=(buf>0?"plus \u00A5"+fmt(buf)+" of buffer":"")+
          (bufferOpen(k)?"":(buf>0?" \u00B7 ":"")+"buffer locked");
  }else if(short>0){
    line1="\u00A5"+fmt(short)+" more than you have";
    line2="";
  }else{
    line1="left after this";
    line2=bufAfter>0?"buffer \u00A5"+fmt(bufAfter)+" still untouched":"";
  }
  return{big:"\u00A5"+fmt(Math.max(0,big)),line1:line1,line2:line2,tone:tone,
         icon:tone==="ok"?"impact":"impactDown"};
}

/* ── the projected figure ──
   A small icon for what this is, the number itself as the one loud thing
   on the card, and a quiet control on the right that opens the
   explanation already sitting underneath. The number and its label are
   a stacked block so the label can wrap without dragging the number
   off its own baseline. */
function purseWhy(k,amt){
  var d=purseData(k,amt),take=Math.max(0,amt||0),buf=bufferFree(k),sav=Math.max(0,savedActual(k));
  if(take<=0) return 'This is your current savings for '+mShort(k)+'. If you spend money, the app uses available buffer first, then savings. The figure updates live as you type.';
  var fromBuf=Math.min(take,buf),fromSav=Math.min(Math.max(0,take-fromBuf),sav),short=Math.max(0,take-fromBuf-fromSav);
  if(short>0) return 'A ¥'+fmt(take)+' expense would use ¥'+fmt(fromBuf)+' of buffer and ¥'+fmt(fromSav)+' of savings, leaving ¥'+fmt(short)+' uncovered. This is a preview, not money already spent.';
  return 'After a ¥'+fmt(take)+' expense, you would have ¥'+fmt(Math.max(0,sav-fromSav))+' in savings'+(fromBuf>0?' and ¥'+fmt(Math.max(0,buf-fromBuf))+' of buffer':'')+'. Nothing is deducted until you tap Add.';
}
function purseHTML(k,amt){
  var d=purseData(k,amt),why=purseWhy(k,amt);
  return '<span class="purse-ico" data-ico="'+d.icon+'">'+sym(d.icon)+'</span>'+         '<span class="purse-txt">'+           '<span class="pursebig">'+d.big+'</span>'+           '<span class="pursesub">'+esc(d.line1)+(d.line2?'<em>'+esc(d.line2)+'</em>':'')+'</span>'+         '</span>'+         '<button class="purse-i" type="button" data-purse-iq="'+esc(why)+'" aria-label="Explain this amount">'+sym("info")+'</button>';
}

function viewJourney(){
  var k=cur(),p=prevOf(k),h='<div class="view">';
  h+=backLink();
  var months=allMonths().slice(-8);
  var total=cumulativeTo(k),saved=Math.max(0,savedActual(k));
  var prevSaved=p?Math.max(0,savedActual(p)):null;
  var delta=prevSaved===null?null:saved-prevSaved;

  /* the journey so far */
  var openNow=projectedOn(k);
  h+='<div class="card" style="padding:24px 22px"><span class="lab">Banked so far</span>'+
     '<div class="jamt" style="margin-top:12px;font-size:38px">\u00A5'+fmt(total)+'</div>'+
     '<div class="jof" style="margin-top:7px">confirmed across '+closedMonths().length+
       ' closed month'+(closedMonths().length===1?'':'s')+
       iq("Only months you have confirmed count here. "+mShort(k)+" is still open, so what it is on course to add is shown separately and is not part of this total.")+
       '</div>'+(openNow>0
       ? '<div class="onopen"><span class="k">'+mShort(k)+' on course to add</span><span class="v">+\u00A5'+fmt(openNow)+'</span></div>'
       : '');
  var closedOnly=months.filter(function(x){return isConfirmed(x);});
  if(closedOnly.length>1)h+='<div style="margin-top:22px">'+
     areaChart(closedOnly.map(function(x){return cumulativeTo(x);}),closedOnly.map(mShort),"#9E5BFF")+'</div>';
  else h+='<p class="hint" style="margin-top:16px">The curve appears once a second month has been confirmed.</p>';
  h+='</div>';

  /* this month against last */
  if(p){
    var sp=totalSpendOf(k),spP=totalSpendOf(p),spD=sp-spP;
    var pct=prevSaved>0?Math.round((saved-prevSaved)/prevSaved*100):null;
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">'+mName(k).split(" ")[0]+' vs '+mShort(p)+'</span></div>'+
       '<div class="scen">'+
       '<div class="sc"><div class="k">'+(isConfirmed(k)?"saved":"on course")+'</div><div class="v" style="color:'+(delta>=0?"var(--teal)":"var(--coral)")+'">'+
         (pct===null?"\u00A5"+fmt(saved):(pct>=0?"+":"")+pct+"%")+'</div></div>'+
       '<div class="sc"><div class="k">spending</div><div class="v" style="color:'+(spD<=0?"var(--teal)":"var(--coral)")+'">'+
         (spD===0?"same":(spD<0?"\u2193 ":"\u2191 ")+"\u00A5"+fmt(Math.abs(spD)))+'</div></div>'+
       '<div class="sc"><div class="k">kept</div><div class="v">'+Math.round(rateOf(k))+'%</div></div>'+
       '</div>'+
       '<div class="jvs">'+
         '<div><span class="k">'+mShort(k)+(isConfirmed(k)?"":" \u00B7 projected")+'</span><span class="v'+(isConfirmed(k)?"":" proj")+'">\u00A5'+fmt(saved)+'</span></div>'+
         '<div><span class="k">'+mShort(p)+'</span><span class="v">\u00A5'+fmt(prevSaved)+'</span></div>'+
         (function(){
           var avg=recentAverage(k);
           return avg===null?"":'<div><span class="k">recent average</span><span class="v">\u00A5'+fmt(Math.round(avg))+'</span></div>';
         })()+
       '</div>'+
       '<p class="hint" style="margin-top:14px">'+journeyRead(k,p)+'</p>'+
       '</div>';
  }

  /* how each jar has grown */
  if(closedMonths().length>1){
    var cm=closedMonths().slice(-8);
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">Goals over time</span></div>';
    S.goals.forEach(function(g){
      var series=cm.map(function(x){return jarBalanceAt(x,g);});
      if(series[series.length-1]<=0)return;
      h+='<div style="margin-top:16px"><div class="dl" style="margin-bottom:8px">'+
         '<span class="dot" style="background:'+g.col+'"></span><span class="n">'+g.name+'</span>'+
         '<span class="p" style="color:'+g.col+'">\u00A5'+fmt(series[series.length-1])+'</span></div>'+
         areaChart(series,cm.map(mShort),g.col)+'</div>';
    });
    h+='</div>';
  }

  /* what changed */
  var notes=journeyNotes(k,p);
  if(notes.length){
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">What changed</span></div>';
    notes.forEach(function(n){h+='<div class="ins"><span class="ic">'+sym(n.i)+'</span><span class="tx">'+n.t+'</span></div>';});
    h+='</div>';
  }
  return h+'</div>';
}

/* two or three short observations, never a wall of text */
function journeyNotes(k,p){
  var out=[],st=streak();
  if(p){
    var a=Math.max(0,savedActual(k)),b=Math.max(0,savedActual(p));
    if(b>0&&Math.abs(a-b)>=100){
      var d=Math.round((a-b)/b*100);
      out.push({i:d>0?"up":"down",
        t:"Your savings "+(d>0?"rose":"fell")+" <b>"+Math.abs(d)+"%</b> against "+mShort(p)+"."});
    }
  }
  var lead=S.goals.filter(function(g){return !jarDone(g);})
    .sort(function(x,y){return jarPct(y)-jarPct(x);})[0];
  if(lead&&jarRate(lead)>0)
    out.push({i:lead.e,t:"Most of your saving goes to <b>"+esc(lead.name)+"</b>. At this rate it lands "+jarETA(lead)+"."});
  if(out.length<3&&lead){
    var faster=jarLeft(lead)/(jarRate(lead)+monthlyRate()*0.05);
    if(jarRate(lead)>0&&isFinite(faster)){
      var now=Math.ceil(jarLeft(lead)/jarRate(lead)),then=Math.ceil(faster);
      if(now-then>=1)out.push({i:"bolt",
        t:"Give <b>"+esc(lead.name)+"</b> 5% more and it arrives "+ahead(then)+" instead of "+ahead(now)+"."});
    }
  }
  if(out.length<3&&st>=2)out.push({i:"flame",t:"You have hit your target <b>"+st+" months</b> running."});
  return out.slice(0,3);
}

/* "18 Aug", or "18 Aug 2025" once it is no longer this year */
function prettyDay(iso){
  if(!iso)return "";
  var p=String(iso).split("-");
  if(p.length<3)return "";
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  if(isNaN(d))return "";
  var now=new Date();
  return d.getDate()+" "+MOS[d.getMonth()]+(d.getFullYear()!==now.getFullYear()?" "+d.getFullYear():"");
}

/* ═══ MONEY OUTSIDE — the page ═══
   Deliberately quiet. Given money is already gone as far as planning is
   concerned, so it is stated flatly with no expectation attached: no
   due date, no countdown, no "coming back". What you owe gets the warm
   colour, because that is the one you can still act on. */
function outSum(k){
  var g=givenOutstanding(),o=owedOutstanding();
  if(!g&&!o)return "Nothing given, nothing borrowed";
  var bits=[];
  if(g)bits.push("\u00A5"+fmt(g)+" given");
  if(o)bits.push("\u00A5"+fmt(o)+" borrowed");
  return bits.join(" \u00B7 ");
}

/* ═══ TOOLS ═══
   Two things the phone's own apps can't do: run a number against the
   goals you actually have, and keep a note tied to one of them. */
function calcState(){
  if(!S.calc)S.calc={d:"0",acc:null,op:null,fresh:true,memo:""};
  return S.calc;
}
function calcPress(key){
  var c=calcState();
  if(key>="0"&&key<="9"){
    c.d=(c.fresh||c.d==="0")?key:(c.d.length<12?c.d+key:c.d);c.fresh=false;
  }else if(key==="."){
    if(c.fresh){c.d="0.";c.fresh=false;}
    else if(c.d.indexOf(".")<0)c.d+=".";
  }else if(key==="C"){
    c.d="0";c.acc=null;c.op=null;c.fresh=true;c.memo="";
  }else if(key==="back"){
    c.d=c.d.length>1?c.d.slice(0,-1):"0";if(c.d==="-")c.d="0";
  }else if(key==="+"||key==="-"||key==="x"||key==="/"){
    if(c.op!==null&&!c.fresh)calcPress("=");
    c.acc=parseFloat(c.d)||0;c.op=key;c.fresh=true;
    c.memo=trimNum(c.acc)+" "+opSign(key);
  }else if(key==="="){
    if(c.op===null)return;
    var b=parseFloat(c.d)||0,a=c.acc||0,r=a;
    if(c.op==="+")r=a+b; else if(c.op==="-")r=a-b;
    else if(c.op==="x")r=a*b; else if(c.op==="/"){if(b===0){c.memo=trimNum(a)+" \u00F7 0 =";c.d="can\u2019t divide by 0";c.acc=null;c.op=null;c.fresh=true;return;}r=a/b;}
    c.memo=trimNum(a)+" "+opSign(c.op)+" "+trimNum(b)+" =";
    c.d=trimNum(r);c.acc=null;c.op=null;c.fresh=true;
  }
}
function opSign(o){return o==="x"?"\u00D7":o==="/"?"\u00F7":o;}
function trimNum(n){
  if(!isFinite(n))return "0";
  var r=Math.round(n*100)/100;
  return (Math.abs(r)>=1e12)?String(r.toExponential(4)):String(r);
}
function calcValue(){return parseFloat(calcState().d)||0;}

/* ══ CREDIT CARD AWARENESS ══
   Not a banking module. The card reads the Installments line you already
   set on Plan — that is the payment that gives credit back. Nothing here
   treats credit as income. */
function card(){
  if(!S.card)S.card={limit:0,used:0,payDay:18,lastPaid:null};
  return S.card;
}
function cardOn(){return card().limit>0;}
function cardAvail(){return Math.max(0,card().limit-card().used);}
function cardUsage(){return card().limit>0?card().used/card().limit*100:0;}
function nextPayment(){return M(thisMonth()).alloc.installments||0;}
function cardAvailAfter(){return cardAvail()+nextPayment();}
function nextPayDate(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=Math.min(card().payDay||18,28);
  if(d.getDate()>day){m+=1;if(m>11){m=0;y+=1;}}
  return new Date(y,m,clampDay(y,m,day));
}
function payDateLabel(){var d=nextPayDate();return d.getDate()+" "+MOS[d.getMonth()];}
/* a closed period means its installment was paid, so that credit comes back */
function applyCardPayments(){
  if(!cardOn())return;
  var c=card(),last=c.lastPaid;
  closedMonths().forEach(function(k){
    if(!last||k>last){
      var pay=M(k).alloc.installments||0;
      if(pay>0)c.used=Math.max(0,c.used-pay);
      c.lastPaid=k;
    }
  });
}
/* Verdict on putting an amount on the card. Credit you have not been
   given back yet is not credit you can spend — the upcoming payment is
   told to you, but it never authorises a purchase. */
function cardCheck(amount){
  if(!cardOn()||!amount||amount<=0)return null;
  var av=cardAvail(),np=nextPayment(),back=np>0?" \u00A5"+fmt(np)+" comes back on "+payDateLabel()+".":"";
  if(amount<=av)return{ok:true,level:"clear",
    msg:"\u00A5"+fmt(av-amount)+" of credit would remain."};
  return{ok:false,level:"over",short:amount-av,
    msg:(av>0?"Only \u00A5"+fmt(av)+" is available \u2014 that is \u00A5"+fmt(amount-av)+" short."
             :"Your card is at its limit, so there is nothing to spend.")+back};
}
function ordinal(n){
  var t=n%100;if(t>=11&&t<=13)return n+"th";
  return n+({1:"st",2:"nd",3:"rd"}[n%10]||"th");
}

/* ═══ 11b. TOAST — one small confirmation, never a blocking dialog ═══ */
var _toastT=null;
function toast(msg){
  var t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=msg;
  t.classList.remove("on");
  void t.offsetWidth;
  t.classList.add("on");
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){t.classList.remove("on");},2200);

/* ═══ 11c. HANDING A FILE TO THE PHONE ═══
   Three routes, tried in order, because a page opened inside a wrapper
   app is not allowed to navigate to a blob: or data: address — that is
   the "resources outside the application" message.
     1. the native share sheet, which hands iOS a real file
     2. a download link pointing at a blob
     3. a download link pointing at the data itself
   Everything is plain text, so the payload is always a string.        */
function isoDay(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function saveFile(name,mime,text,onDone,onFail){
  var blob=null;
  try{blob=new Blob([text],{type:mime});}catch(e){blob=null;}
  try{
    if(blob&&window.File&&navigator.share&&navigator.canShare){
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).then(
          function(){if(onDone)onDone();},
          function(err){
            if(err&&err.name==="AbortError")return;   /* they tapped Cancel */
            anchorSave(name,mime,blob,text,onDone,onFail);
          });
        return true;
      }
    }
  }catch(e){}
  return anchorSave(name,mime,blob,text,onDone,onFail);
}
function anchorSave(name,mime,blob,text,onDone,onFail){
  var url=null,isBlob=false;
  try{if(blob&&window.URL&&URL.createObjectURL){url=URL.createObjectURL(blob);isBlob=true;}}catch(e){url=null;}
  if(!url){
    try{url="data:"+mime+";charset=utf-8,"+encodeURIComponent(text);}catch(e){url=null;}
  }
  if(!url){if(onFail)onFail();return false;}
  try{
    var a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";
    a.style.position="fixed";a.style.left="-9999px";a.style.opacity="0";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{document.body.removeChild(a);}catch(e){}
      if(isBlob){try{URL.revokeObjectURL(url);}catch(e){}}
    },3000);
    if(onDone)onDone();
    return true;
  }catch(e){if(onFail)onFail();return false;}
}
var VIEWER_HINT="This viewer will not let the app hand you a file. Two ways round it:\n\n\u2022 Open the app in Safari instead (Add to Home Screen from Safari), where saving works.\n\u2022 Or use Copy as text and paste it into Notes or an email.";

/* ═══ 11d. BACKUP — write, read, check ═══
   Every export is wrapped so a file can identify itself. Files written
   by older builds were the bare state object, and those still restore. */
var BK_SCHEMA=1;
function backupText(){
  return JSON.stringify({app:"plan",schema:BK_SCHEMA,build:BUILD,
    exported:new Date().toISOString(),data:S},null,2);
}
/* returns {data:...} or {err:"plain sentence"} — never throws */
function readBackup(raw){
  var p;
  try{p=JSON.parse(raw);}
  catch(e){return{err:"That file could not be read. It is not a backup, or it was only partly copied."};}
  if(!p||typeof p!=="object"||p instanceof Array)return{err:"That file is not a backup from this app."};
  var d=p;
  if(p.app!=null||p.schema!=null||p.data!=null){
    if(p.app!=="plan")return{err:"That backup was made by a different app."};
    if((p.schema||0)>BK_SCHEMA)return{err:"That backup was made by a newer version of this app. Update the app first, then restore."};
    d=p.data;
  }
  if(!d||typeof d!=="object")return{err:"The backup is empty."};
  if(!d.months||typeof d.months!=="object"||d.months instanceof Array)
    return{err:"That file is not a backup from this app \u2014 it has no months in it."};
  var out=fresh(),key;
  for(key in d)if(Object.prototype.hasOwnProperty.call(d,key))out[key]=d[key];
  if(!out.goals||!out.goals.length)out.goals=JSON.parse(JSON.stringify(BASE_GOALS));
  if(!out.card)out.card={limit:0,used:0,payDay:18,lastPaid:null};
  if(!out.notes)out.notes=[];
  return{data:out};
}
function restoreFrom(raw){
  var r=readBackup(raw);
  if(r.err){alert(r.err);return false;}
  var n=Object.keys(r.data.months).length,g=(r.data.goals||[]).length;
  if(!confirm("Restore this backup? Current data will be replaced.\n\n"+
    n+" month"+(n===1?"":"s")+" \u00B7 "+g+" goal"+(g===1?"":"s")+" in the file."))return false;
  S=r.data;
  S.tab="backup";S.more=false;
  save();render();
  toast("Backup restored");
  return true;
}
function copyText(txt,done){
  if(navigator.clipboard&&navigator.clipboard.writeText){
    try{navigator.clipboard.writeText(txt).then(done,function(){legacyCopy(txt,done);});return;}
    catch(e){}
  }
  legacyCopy(txt,done);
}
function legacyCopy(txt,done){
  var t=document.createElement("textarea");
  t.value=txt;
  t.style.position="fixed";t.style.top="0";t.style.left="0";
  t.style.width="1px";t.style.height="1px";t.style.opacity="0";t.style.fontSize="16px";
  document.body.appendChild(t);
  var ok=false;
  try{
    t.contentEditable="true";t.readOnly=false;
    var r=document.createRange();r.selectNodeContents(t);
    var sel=window.getSelection();sel.removeAllRanges();sel.addRange(r);
    t.setSelectionRange(0,999999);
    ok=document.execCommand("copy");
  }catch(e){ok=false;}

/* ═══ 11e. PDF — written by hand, no library, no network ═══
   The whole file stays inside 7-bit ASCII: anything above 127 is
   written as an octal escape, so the string and the bytes are the
   same length and the cross-reference offsets are always right.     */
var PW=595.28,PH=841.89,PM=46;
var HW={};
(function(){
  var s=" !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
  var w=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
         556,556,556,556,556,556,556,556,556,556,
         278,278,584,584,584,556,1015,
         667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
         278,278,278,469,556,333,
         556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
         334,260,334,584];
  for(var i=0;i<s.length;i++)HW[s.charAt(i)]=w[i];
})();
/* typographic characters that do exist in WinAnsi, at their WinAnsi code */
var WANSI={"\u2013":150,"\u2014":151,"\u2018":145,"\u2019":146,"\u201C":147,"\u201D":148,
           "\u2022":149,"\u2026":133,"\u20AC":128,"\u2122":153,"\u2039":139,"\u203A":155};
/* drop anything Helvetica cannot draw, so widths and bytes agree */
function pdfSafe(s){
  s=String(s==null?"":s);
  var o="",i,c,ch;
  for(i=0;i<s.length;i++){
    ch=s.charAt(i);c=s.charCodeAt(i);
    if(WANSI[ch]!=null)c=WANSI[ch];
    if(c===9||c===10||c===13){o+=" ";continue;}
    if(c<32)continue;
    if(c<256)o+=String.fromCharCode(c);
  }
  return o;
}
function pdfEsc(s){
  var o="",i,c;
  for(i=0;i<s.length;i++){
    c=s.charCodeAt(i);
    if(c===40||c===41||c===92)o+="\\"+s.charAt(i);
    else if(c<127)o+=s.charAt(i);
    else o+="\\"+("00"+c.toString(8)).slice(-3);
  }
  return o;
}
function tw(s,size,bold){
  s=pdfSafe(s);
  var t=0,i,c,w;
  for(i=0;i<s.length;i++){
    c=s.charAt(i);w=HW[c];
    if(w==null)w=556;                                   /* \u00A5 and friends */
    if(bold&&c>="A"&&c<="z")w=Math.round(w*1.07);       /* bold letters run wider */
    t+=w;
  }
  return t*size/1000;
}
function f2(n){return (Math.round(n*100)/100).toString();}
function pdfRGB(hex){
  var h=hex.replace("#","");
  var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  return f2(r)+" "+f2(g)+" "+f2(b);
}
function pdfNew(){return{pages:[],ops:null,y:0};}
function pdfOp(D,s){D.ops.push(s);}
function pdfFill(D,x,y,w,h,col){
  if(w<=0||h<=0)return;
  pdfOp(D,"q "+pdfRGB(col)+" rg "+f2(x)+" "+f2(y)+" "+f2(w)+" "+f2(h)+" re f Q");
}
function pdfRound(D,x,y,w,h,col){pdfFill(D,x,y,w,h,col);}   /* square corners print cleaner */
function pdfText(D,x,y,s,size,bold,col,tc){
  var safe=pdfSafe(s);
  if(!safe)return;
  pdfOp(D,"BT "+pdfRGB(col)+" rg /"+(bold?"F2":"F1")+" "+f2(size)+" Tf"+
    (tc?" "+f2(tc)+" Tc":" 0 Tc")+" 1 0 0 1 "+f2(x)+" "+f2(y)+" Tm ("+pdfEsc(safe)+") Tj ET");
}
function pdfTextR(D,xr,y,s,size,bold,col){
  pdfText(D,xr-tw(s,size,bold),y,s,size,bold,col);
}
function pdfWords(s,fallback){
  var t=pdfSafe(s).replace(/\s+/g," ").replace(/^ | $/g,"");
  return t||fallback;
}
function pdfClip(s,size,bold,max){
  s=String(s==null?"":s);
  if(tw(s,size,bold)<=max)return s;
  while(s.length>1&&tw(s+"\u2026",size,bold)>max)s=s.slice(0,-1);
  return s+"\u2026";
}
function pdfBuild(D){
  var n=D.pages.length,i,objs=[],kids="";
  for(i=0;i<n;i++)kids+=(6+2*i)+" 0 R ";
  objs[1]="1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n";
  objs[2]="2 0 obj\n<< /Type /Pages /Count "+n+" /Kids ["+kids.replace(/\s+$/,"")+"] >>\nendobj\n";
  objs[3]="3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n";
  objs[4]="4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n";
  for(i=0;i<n;i++){
    var c=D.pages[i].join("\n")+"\n";
    objs[5+2*i]=(5+2*i)+" 0 obj\n<< /Length "+c.length+" >>\nstream\n"+c+"endstream\nendobj\n";
    objs[6+2*i]=(6+2*i)+" 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+f2(PW)+" "+f2(PH)+
      "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(5+2*i)+" 0 R >>\nendobj\n";
  }
  var total=4+2*n,out="%PDF-1.4\n",offs=[0];
  for(i=1;i<=total;i++){offs[i]=out.length;out+=objs[i];}
  var xref=out.length;
  out+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(i=1;i<=total;i++)out+=("0000000000"+offs[i]).slice(-10)+" 00000 n \n";
  out+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return out;
}

/* ═══ 11g. WORKING WITHOUT A SIGNAL ═══
   A service worker keeps a copy of the app on the phone. Online it
   always fetches the newest file first, so an edit you push appears
   by itself; offline it serves the copy. It only runs over https,
   which GitHub Pages gives you, so opening the file from Files has
   no worker and simply says so.                                    */
var SW_READY=false;
/* Installed as a Home Screen app, the app draws all the way to the edge
   of the glass and must keep the home-indicator strip clear itself. In a
   browser tab the toolbar already occupies it. Ask which one this is,
   rather than guessing with a fixed number of pixels. */
function fitShell(){
  var standalone=false;
  try{
    standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)
      ||(window.matchMedia&&window.matchMedia("(display-mode: fullscreen)").matches)
      ||navigator.standalone===true;
  }catch(e){}
  document.documentElement.classList.toggle("in-browser",!standalone);
}
function watchShell(){
  fitShell();
  try{
    var mq=window.matchMedia("(display-mode: standalone)");
    if(mq.addEventListener)mq.addEventListener("change",fitShell);
    else if(mq.addListener)mq.addListener(fitShell);
  }catch(e){}
  window.addEventListener("resize",fitShell);
  window.addEventListener("orientationchange",fitShell);
}

function initSW(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="https:"&&location.hostname!=="localhost")return;
  navigator.serviceWorker.register("./sw.js").then(function(){
    SW_READY=true;paintOffline();
  },function(){paintOffline();});
}
function offlineState(){
  if(location.protocol==="file:")
    return{warn:true,t:"Opened straight from a file, so there is no offline copy to keep \u2014 it is already all on the phone. Add it to your Home Screen from Safari to get the app icon."};
  if(!("serviceWorker" in navigator))
    return{warn:true,t:"This browser cannot store an offline copy. Open the app in Safari."};
  if(location.protocol!=="https:")
    return{warn:true,t:"Offline storage needs a secure address. Open the https version of the page."};
  if(!SW_READY&&!navigator.serviceWorker.controller)
    return{warn:true,t:"Setting up the offline copy. Stay online for a moment, then reopen the app."};
  return{warn:false,t:"Saved for offline use. The app opens with no signal, and picks up any update by itself next time you are online."};
}
/* the whole line, markup and all, so the page can be generated in one go */
function offlineHTML(){
  var st=offlineState();
  return '<div id="offline" class="offl'+(st.warn?" warn":"")+'">'+
    sym(st.warn?"warning":"check")+'<span>'+esc(st.t)+'</span></div>';
}
/* used only when the service worker finishes registering after the page
   has already been drawn */
function paintOffline(){
  var el=document.getElementById("offline");
  if(el)el.outerHTML=offlineHTML();
}
/* Pull the newest code down and restart. Data lives in localStorage,
   which is a different store from the cache, so it is never at risk. */
function refreshApp(done){
  if(!("serviceWorker" in navigator)||!navigator.serviceWorker.controller){
    location.reload();return;
  }
  try{
    navigator.serviceWorker.controller.postMessage("wipe");
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){return r.update();}));
    }).then(function(){
      setTimeout(function(){location.reload();},350);
    },function(){
      done&&done("Could not reach the web just now. Try again when you have a signal.");
    });
  }catch(e){done&&done("Could not reach the web just now. Try again when you have a signal.");}
}
