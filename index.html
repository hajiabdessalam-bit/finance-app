<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="theme-color" content="#0B0918">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" href="./icon-192.png">
<title>Plan</title>
<style>
:root{
  --void:#0B0918;--surface:#171531;--surface-2:#1E1B3C;--surface-3:#272348;
  --line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.14);
  --majorelle:#7B72FF;--teal:#2FD4BC;--saffron:#FFB33D;--violet:#B08CFF;
  --coral:#FF7A5C;--rose:#FF5C8A;--sage:#8DA88F;--dim:#5A52D9;
  --text:#F2F0FF;--muted:#A29CC7;--faint:#7B75A6;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.56,.64,1);
  --navh:65px;                     /* the bar, without the home indicator */
  /* The strip the home indicator sits over. Installed on the Home Screen
     the app owns the bottom of the glass and must leave it clear. Inside
     Safari the browser's own toolbar already covers that strip, but iOS
     reports the inset anyway — reserving it a second time is what left a
     dark band under the tabs. `html.in-browser` (set at boot) zeroes it. */
  --sab:env(safe-area-inset-bottom, 0px);
  --navtotal:calc(var(--navh) + var(--sab));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--void);height:100%}
html.in-browser{--sab:0px}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  height:100%;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(58% 32% at 16% 0%,rgba(123,114,255,.19),transparent 70%),
  radial-gradient(46% 28% at 96% 10%,rgba(47,212,188,.09),transparent 70%),
  radial-gradient(70% 38% at 50% 103%,rgba(255,179,61,.06),transparent 70%)}
.scroll{position:relative;z-index:1;max-width:540px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 20px calc(var(--navtotal) + 28px)}
/* ── the app shell ──
   The document itself never scrolls. #app is the one scrolling box and
   it is pinned to the four edges, so its height is the app viewport and
   nothing about page content can reach the bar. The bar is a fixed
   strip of a fixed height at the bottom, and the scroller reserves
   exactly that height plus the home indicator, so the last card clears
   it on a full page and a short page ends in the same place.        */
#app{position:fixed;top:0;left:0;right:0;bottom:0;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain}
input,select,button,textarea{font-family:inherit;color:var(--text)}
input,textarea{background:transparent;border:none}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--majorelle);outline-offset:3px;border-radius:6px}

.lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint);display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.card-t{font-family:var(--round);font-size:16.5px;font-weight:700;letter-spacing:-.02em}
.hint{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}

.mbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.mnav{width:38px;height:38px;border-radius:13px;background:var(--surface-2);display:grid;place-items:center;
  transition:transform .18s var(--spring);flex:none}
.mnav:active{transform:scale(.88)}
.mnav:disabled{opacity:.22}
.mnav svg{width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mtitle{text-align:center}
.mtitle b{display:block;font-family:var(--round);font-size:20px;font-weight:800;letter-spacing:-.03em}
.mtitle span{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.mtitle span.live{color:var(--teal)}

.greet{font-family:var(--round);font-size:15px;color:var(--muted);font-weight:600;letter-spacing:-.01em}
.verdict-h{font-family:var(--round);font-size:34px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:6px 0 0}
.verdict-s{font-size:13.5px;color:var(--muted);margin-top:9px;line-height:1.55}
.ring-wrap{display:flex;align-items:center;gap:18px;margin-top:20px}
.ring{width:104px;height:104px;flex:none;position:relative}
.ring svg{width:100%;height:100%}
.ring .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .mid b{font-family:var(--round);font-size:26px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.ring .mid span{font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase}
.statcol{flex:1;display:flex;flex-direction:column;gap:11px}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-family:var(--round);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}

.ins{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.ins:last-child{border-bottom:none;padding-bottom:0}
.ins .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;color:var(--muted);
  background:rgba(255,255,255,.05)}
.ins .tx{flex:1;font-size:13.5px;line-height:1.5}
.ins .tx em{font-style:normal;color:var(--faint);font-family:var(--mono);font-size:11px}
.ins b{font-weight:700}

.ms{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.ms:last-child{border-bottom:none;padding-bottom:0}
.ms .badge{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:16px;flex:none;
  background:var(--surface-2);filter:grayscale(1);opacity:.38}
.ms.on .badge{filter:none;opacity:1;background:rgba(255,179,61,.14)}
.ms .t{flex:1;font-size:14px;font-weight:600;color:var(--faint)}
.ms.on .t{color:var(--text)}
.ms .s{font-family:var(--mono);font-size:10px;color:var(--faint)}
.ms.on .s{color:var(--saffron)}
.streak{display:flex;align-items:center;gap:13px;padding:15px;border-radius:16px;
  background:rgba(255,179,61,.09);border:1px solid rgba(255,179,61,.24)}
.streak .n{font-family:var(--round);font-size:30px;font-weight:800;color:var(--saffron);letter-spacing:-.04em;line-height:1}
.streak .t{font-size:13px;color:var(--muted);line-height:1.45}

.eq{margin-top:2px}
.eqrow{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;font-size:14px}
.eqrow+.eqrow{border-top:1px solid var(--line)}
.eqrow .k{color:var(--muted)}
.eqrow .v{font-family:var(--round);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eqrow.total{margin-top:4px;border-top:1px solid var(--line-2);padding-top:14px}
.eqrow.total .k{color:var(--text);font-weight:600;font-size:15px}
.eqrow.total .v{font-size:26px}
.vs{font-family:var(--mono);font-size:11px;margin-top:9px;text-align:right}
.up{color:var(--teal)}.down{color:var(--coral)}

.salary-line{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.cur{font-family:var(--round);font-size:20px;font-weight:600;color:var(--majorelle);transform:translateY(-3px)}
#sal{font-family:var(--round);font-size:42px;font-weight:800;letter-spacing:-.045em;width:100%;padding:0;font-variant-numeric:tabular-nums}

/* ── hero salary card: ambient health glow ── */
.hero{position:relative;margin-top:12px;isolation:isolate}
.aura{position:absolute;inset:10% 12%;border-radius:60px;z-index:0;
  background:var(--hc);opacity:.30;filter:blur(40px);
  animation:breathe 7s var(--ease) infinite,bloom .9s var(--ease) both}
.aura.two{inset:26% 30%;filter:blur(56px);opacity:.22;animation-delay:-3.5s,0s}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.26}50%{transform:scale(1.14);opacity:.44}}
@keyframes bloom{from{opacity:0}}
.glass{position:relative;z-index:1;border-radius:26px;padding:22px;
  background:rgba(20,18,42,.62);
  -webkit-backdrop-filter:blur(26px) saturate(170%);backdrop-filter:blur(26px) saturate(170%);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 22px 50px -26px rgba(0,0,0,.85)}
.hero .salary-line{margin-top:10px}
.hstatus{display:flex;align-items:center;justify-content:space-between;margin-top:16px;gap:12px}
.hpill{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border-radius:99px;
  background:var(--hc-soft);border:1px solid var(--hc-line);font-size:13px;font-weight:600;color:var(--hc)}
.hdot{width:8px;height:8px;border-radius:8px;background:currentColor;flex:none;
  box-shadow:0 0 0 0 currentColor;animation:ping 2.6s var(--ease) infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 var(--hc-soft)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hscore{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;white-space:nowrap}
.hscore b{color:var(--hc);font-weight:500}
.hwhy{font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 0 0}
@media (prefers-reduced-motion:reduce){.aura,.hdot{animation:none}}

/* expandable detail, same tokens as .lab */
details.more{margin-top:12px}
details.more>summary{list-style:none;cursor:pointer;padding:7px 0;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary{color:var(--muted)}
details.more .eqrow{font-size:13px}
/* the amount you are considering — same type treatment as the salary hero */
.wiamt{font-family:var(--round);font-size:36px;font-weight:800;letter-spacing:-.042em;
  font-variant-numeric:tabular-nums;line-height:1;margin-top:7px;transition:color .3s var(--ease)}
.wiarrow{color:var(--faint);font-weight:400;margin:0 3px}

/* ── savings jars: each goal is its own object, with room around it ── */
.jarcard{position:relative;margin-top:22px;padding:19px 20px;border-radius:28px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 16px 34px -30px rgba(0,0,0,.85)}
/* At rest every goal card looks the same. Rank is said in words on the
   card, not shouted in light — the glow is reserved for the one thing
   the finger is actually holding.                                     */
.jarcard.quiet{background:rgba(21,19,44,.86);box-shadow:0 12px 28px -28px rgba(0,0,0,.8)}
.jarcard.quiet .jname{color:#E4E1F5}
.jhead{display:flex;align-items:center;gap:12px}
.jico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;font-size:23px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09)}
.jarcard.quiet .jico{opacity:.84}
.jmeta{flex:1;min-width:0}
.jname{font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.022em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jsub{font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);margin-top:5px}
.jpc{font-family:var(--round);font-size:17px;font-weight:800;letter-spacing:-.03em;flex:none;
  font-variant-numeric:tabular-nums}
.jamt{font-family:var(--round);font-size:30px;font-weight:800;letter-spacing:-.036em;
  font-variant-numeric:tabular-nums;margin-top:15px;line-height:1}
.jof{font-size:12.5px;color:var(--muted);margin-top:4px}
.jbar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden;margin-top:14px}
.jbar i{display:block;height:100%;border-radius:8px;transition:width .7s var(--ease)}
.jrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;gap:10px;
  font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.jrow .r{color:var(--faint);white-space:nowrap}
.jdue{font-family:var(--mono);font-size:10.5px;margin-top:7px;letter-spacing:.02em}
/* ── hold-to-reorder ── */
.jarcard{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
.jarcard.dragging{transition:none;z-index:8;opacity:.97;
  background:linear-gradient(168deg,rgba(255,255,255,.05),rgba(255,255,255,.006) 60%),var(--surface);
  border-color:var(--jc-line);
  box-shadow:0 30px 60px -26px rgba(0,0,0,.95),0 0 0 1px var(--jc-line),
             0 22px 54px -26px var(--jc),inset 0 1px 0 rgba(255,255,255,.08)}
.jarcard.dragging .jico{box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 9px 22px -13px var(--jc)}
.btn.ghost{background:transparent;border:1px dashed var(--line-2);color:var(--muted)}
.nmin{flex:1;min-width:0;font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.02em;
  background:var(--surface-3);border-radius:11px;padding:9px 11px}
.duein{background:var(--surface-3);border-radius:13px;padding:10px 12px;font-family:var(--mono);
  font-size:13px;width:152px;text-align:right;color-scheme:dark}
.delg{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--coral);opacity:.8;padding:4px 0}
.emrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.emrow button{width:42px;height:42px;border-radius:14px;background:var(--surface-3);font-size:21px;
  color:var(--muted);display:grid;place-items:center;transition:transform .16s var(--spring)}
.emrow button.on{color:var(--majorelle)}
.emrow button.on{box-shadow:inset 0 0 0 1.5px var(--majorelle)}
.emrow button:active{transform:scale(.88)}
.ngline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}

/* ── adjust sheet ── */
.shbg{position:fixed;inset:0;z-index:30;background:rgba(6,5,16,.62);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);animation:fadein .25s var(--ease) both}
@keyframes fadein{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-width:540px;margin:0 auto;
  background:var(--surface);border-radius:28px 28px 0 0;border-top:1px solid var(--line-2);
  padding:12px 22px calc(var(--sab) + 22px);max-height:86vh;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  box-shadow:0 -30px 70px -30px rgba(0,0,0,.9);animation:slideup .34s var(--ease) both}
@keyframes slideup{from{transform:translateY(101%)}}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 20px}
.shx{width:32px;height:32px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;
  font-size:19px;color:var(--muted);line-height:1;transition:transform .16s var(--spring)}
.shx:active{transform:scale(.88)}
.sheet .card-t{font-size:19px}
.sheet.more{max-height:78vh;padding-bottom:calc(var(--sab) + 92px)}
/* vh freezes at the tallest viewport, so with the toolbars showing the
   sheet was being clipped into a small scroller. dvh follows the real
   one, and the sheet is the same height every time it opens. */
@supports(height:100dvh){.sheet{max-height:86dvh}.sheet.more{max-height:78dvh}}
.sheet .menucard{margin-top:12px;background:var(--surface-2);box-shadow:none}
.shx{width:34px;height:34px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;
  flex:none;transition:transform .16s var(--spring)}
.shx:active{transform:scale(.88)}
.shx svg{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round}
.shhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.shhead .card-t{flex:1;min-width:0}
.ablock{background:var(--surface-2);border-radius:20px;padding:17px 16px;margin-top:12px}
.ablock:first-of-type{margin-top:18px}
.atop{display:flex;align-items:center;gap:12px}
.atop .nm{flex:1;min-width:0;font-family:var(--round);font-size:16px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}
.aline .lab{flex:none}
.amove{display:flex;flex-direction:column;gap:3px;flex:none}
.amove button{width:30px;height:18px;border-radius:7px;background:var(--surface-3);display:grid;place-items:center;
  transition:transform .16s var(--spring)}
.amove button:active{transform:scale(.85)}
.amove button:disabled{opacity:.22}
.amove svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pctwrap{display:flex;align-items:center;gap:4px;flex:none}
.pctwrap .step{width:38px;height:38px;border-radius:13px;background:var(--surface-3)}
.pctin{width:44px;text-align:center;font-family:var(--round);font-size:18px;font-weight:700;padding:0;
  font-variant-numeric:tabular-nums}
.pctsign{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:-2px}
.atgtin{background:var(--surface-3);border-radius:13px;padding:11px 14px;font-family:var(--mono);
  font-size:14px;font-variant-numeric:tabular-nums;width:132px;text-align:right}

/* ── More: a menu that belongs to the app, not a settings screen ── */
.menucard{display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:20px;border-radius:24px;margin-top:14px;
  background:var(--surface);border:1px solid var(--line);
  box-shadow:0 16px 34px -30px rgba(0,0,0,.85);
  transition:transform .18s var(--spring),border-color .25s var(--ease)}
.menucard:active{transform:scale(.985)}
.menucard.soon{opacity:.62}
.menuico{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:25px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.menutxt{flex:1;min-width:0;text-align:left}
.menut{display:block;font-family:var(--round);font-size:17px;font-weight:700;letter-spacing:-.022em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menus{display:block;font-size:12.5px;color:var(--muted);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menuchev{width:9px;height:9px;border-right:2px solid var(--faint);border-top:2px solid var(--faint);
  transform:rotate(45deg);flex:none;margin-right:4px}
.menusoon{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line-2);padding:3px 7px;border-radius:6px;flex:none}
.backlink{display:inline-flex;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:15px;
  background:var(--surface-2);border:1px solid var(--line-2);margin-bottom:16px;
  font-size:14.5px;font-weight:600;letter-spacing:-.012em;color:var(--text);
  transition:transform .16s var(--spring)}
.backlink:active{transform:scale(.95)}
.backlink svg{width:14px;height:14px;stroke:var(--majorelle);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* ── Tools: calculator ── */
.calcwrap{background:var(--surface-2);border-radius:22px;padding:18px;margin-top:4px}
.calcout{text-align:right;font-family:var(--round);font-size:40px;font-weight:800;letter-spacing:-.045em;
  font-variant-numeric:tabular-nums;line-height:1.1;min-height:46px;overflow:hidden;
  white-space:nowrap;text-overflow:ellipsis;direction:ltr}
.calcsub{text-align:right;font-family:var(--mono);font-size:11px;color:var(--faint);min-height:15px;margin-top:4px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}
.key{height:58px;border-radius:19px;background:var(--surface-3);font-family:var(--round);font-size:22px;
  font-weight:600;display:grid;place-items:center;transition:transform .13s var(--spring),background .18s}
.key:active{transform:scale(.9);background:var(--dim)}
.key.op{background:rgba(123,114,255,.16);color:var(--majorelle)}
.key.eq{background:var(--majorelle);color:#fff}
.key.fn{background:rgba(255,122,92,.13);color:var(--coral);font-size:19px}
.key.wide{grid-column:span 2}

/* ── impact rows ── */
.imp{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.imp:last-child{border-bottom:none;padding-bottom:0}
.impn{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impd{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── notes ── */
.searchbox{width:100%;background:var(--surface-2);border-radius:15px;padding:13px 15px;font-size:15px;margin-bottom:12px}
.noterow{display:flex;align-items:center;gap:6px;padding:0 8px 0 16px;border-radius:19px;
  background:var(--surface-2);margin-top:10px}
.noteopen{flex:1;min-width:0;text-align:left;padding:15px 0;transition:transform .16s var(--spring)}
.noteopen:active{transform:scale(.985)}
.notedel{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;flex:none;
  color:var(--faint);font-size:19px;transition:all .18s var(--spring)}
.notedel:active{transform:scale(.88)}
.notedel.armed{background:rgba(255,122,92,.16);color:var(--coral);width:auto;padding:0 13px;font-size:12.5px;font-weight:700}
.notedot{width:9px;height:9px;border-radius:9px;flex:none}
.notetxt{flex:1;min-width:0}
.notet{display:block;font-size:15px;font-weight:600;letter-spacing:-.012em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notes2{display:block;font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.titlein{width:100%;font-family:var(--round);font-size:24px;font-weight:800;letter-spacing:-.032em;padding:2px 0 10px}
.bodyin{width:100%;min-height:220px;background:transparent;font-size:17px;line-height:1.7;resize:none;
  color:var(--text);-webkit-text-fill-color:var(--text);caret-color:var(--majorelle);
  padding:0;border:none;outline:none;font-family:var(--sans);overflow:hidden;display:block}
.bodyin::placeholder{color:var(--faint)}
.titlein::placeholder{color:var(--faint)}
.noteroom{height:44vh}
.fmtbar{display:flex;gap:8px;margin:4px 0 14px}
.fmtb{padding:9px 14px;border-radius:12px;background:var(--surface-2);font-size:13px;font-weight:600;color:var(--muted);
  transition:transform .14s var(--spring)}
.fmtb:active{transform:scale(.93)}
.goalpick{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-top:6px}
.goalpick::-webkit-scrollbar{display:none}

/* ── credit card awareness ── */
.cardbar{height:9px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin-top:14px}
.cardbar i{display:block;height:100%;border-radius:9px;transition:width .6s var(--ease)}
.cardrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:11px;gap:10px;
  font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
.cardrow b{color:var(--text);font-weight:500}
.methodrow{display:flex;gap:7px;margin-bottom:10px}
.warnbox{border-radius:15px;padding:14px;margin-top:12px;border:1px solid;font-size:13px;line-height:1.55}
.warnbox.clear{background:rgba(47,212,188,.08);border-color:rgba(47,212,188,.24);color:var(--muted)}
.warnbox.tight{background:rgba(255,179,61,.09);border-color:rgba(255,179,61,.26);color:var(--muted)}
.warnbox.over{background:rgba(255,122,92,.1);border-color:rgba(255,122,92,.3);color:var(--muted)}
.warnbox b{color:var(--text)}

.spectrum{display:flex;gap:3px;height:44px;margin-top:16px}
.seg{border-radius:4px;position:relative;overflow:hidden;min-width:3px;
  transition:flex-grow .5s var(--ease),opacity .3s,transform .3s var(--spring)}
.seg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),transparent 55%)}
.seg.dim{opacity:.2}.seg.up2{transform:scaleY(1.13)}
.legend{display:flex;align-items:center;gap:8px;margin-top:12px;height:16px;font-size:12px;color:var(--muted)}
.legend b{color:var(--text);font-weight:600}
.legend .amt{font-family:var(--mono);font-size:11px;margin-left:auto;color:var(--faint)}

.row{padding:13px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none;padding-bottom:2px}
.row.locked{opacity:.6}
.row-t{display:flex;align-items:center;gap:9px}
.ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:17px;flex:none}
.nm{font-size:15px;font-weight:600;letter-spacing:-.01em;flex:1}
.tag{font-family:var(--mono);font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  border:1px solid var(--line-2);padding:2px 5px;border-radius:5px}
.lockbtn{width:30px;height:30px;border-radius:10px;border:1px solid transparent;display:grid;place-items:center;
  transition:all .25s var(--ease);flex:none}
.lockbtn svg{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:1.9;stroke-linecap:round}
.lockbtn.on{background:rgba(255,179,61,.12);border-color:rgba(255,179,61,.28)}
.lockbtn.on svg{stroke:var(--saffron)}
.lockbtn:active{transform:scale(.9)}
.stepper{display:flex;align-items:center;gap:1px;flex:none}
.step{width:30px;height:30px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;
  font-size:17px;color:var(--muted);transition:transform .18s var(--spring),background .2s}
.step:active{transform:scale(.86);background:var(--dim);color:#fff}
.amtin{width:70px;text-align:right;font-family:var(--round);font-size:16px;font-weight:700;padding:0 5px;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;margin:6px 0 0;background:transparent}
.slider::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--surface-2)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:21px;height:21px;border-radius:21px;background:#fff;
  margin-top:-8px;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .18s var(--spring)}
.slider:active::-webkit-slider-thumb{transform:scale(1.2)}
.slider:disabled::-webkit-slider-thumb{background:var(--faint);box-shadow:none}
.note{font-size:11.5px;color:var(--faint);margin-top:7px}

.wk-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.wk-t{font-family:var(--round);font-size:19px;font-weight:700;letter-spacing:-.025em}
.wk-s{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:3px}
.chiprow{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:10px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;border-radius:99px;background:var(--surface-2);border:1px solid transparent;
  font-size:13.5px;font-weight:600;white-space:nowrap;color:var(--muted);transition:all .22s var(--ease);flex:none}
.chip.on{color:#fff;border-color:currentColor}
.chip:active{transform:scale(.94)}
.entry{display:flex;gap:8px}
.amtfield{flex:1;background:var(--surface-2);border-radius:14px;padding:13px 15px;font-family:var(--round);
  font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.amtfield::placeholder{color:var(--faint);font-weight:400}
.notefield{width:100%;background:var(--surface-2);border-radius:14px;padding:12px 15px;font-size:14.5px;margin-top:8px}
.notefield::placeholder{color:var(--faint)}
.addb{padding:0 20px;border-radius:14px;background:var(--majorelle);color:#fff;font-weight:700;font-size:15px;
  transition:transform .18s var(--spring)}
.addb:active{transform:scale(.94)}
.sp{padding:13px 0;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:none;padding-bottom:0}
.sp-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
.sp-n{font-size:14.5px;font-weight:600}
.sp-v{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.sp-v b{color:var(--text);font-weight:500}
.sp-v.bad,.sp-v.bad b{color:var(--coral)}
.mini{height:6px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.mini i{display:block;height:100%;border-radius:6px;transition:width .5s var(--ease)}
.log{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.log:last-child{border-bottom:none}
.log .n{flex:1;font-size:14px}
.log .n em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:2px}
.log .a{font-family:var(--round);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.del{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;color:var(--faint);font-size:17px;flex:none}
.del:active{background:rgba(255,122,92,.15);color:var(--coral)}
.empty{padding:28px 18px;text-align:center;color:var(--faint);font-size:13.5px;line-height:1.6}

.verdict{border-radius:16px;padding:16px;border:1px solid}
.verdict.good{background:rgba(47,212,188,.09);border-color:rgba(47,212,188,.26)}
.verdict.bad{background:rgba(255,122,92,.09);border-color:rgba(255,122,92,.26)}
.verdict.flat{background:var(--surface-2);border-color:var(--line)}
.verdict b{display:block;font-family:var(--round);font-size:19px;font-weight:800;letter-spacing:-.03em;margin-bottom:5px}
.verdict.good b{color:var(--teal)}.verdict.bad b{color:var(--coral)}
.verdict p{margin:0;font-size:13px;color:var(--muted);line-height:1.55}
.chg{display:flex;align-items:baseline;gap:9px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.chg:last-child{border-bottom:none}
.chg .d{font-family:var(--mono);font-size:10px;color:var(--faint);flex:none;width:38px}
.chg .arrow{font-family:var(--mono);font-size:11.5px;margin-left:auto;flex:none}

.chart{width:100%;display:block;overflow:visible}
.donutwrap{display:flex;align-items:center;gap:16px}
.donut{width:122px;height:122px;flex:none;position:relative}
.donut svg{width:100%;height:100%}
.donut .mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .mid b{font-family:var(--round);font-size:18px;font-weight:800;letter-spacing:-.03em;display:block;line-height:1.1}
.donut .mid span{font-family:var(--mono);font-size:8px;letter-spacing:.12em;color:var(--faint);text-transform:uppercase}
.dlegend{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.dl{display:flex;align-items:center;gap:9px;font-size:12.5px}
.dl .dot{width:8px;height:8px;border-radius:8px;flex:none}
.dl .n{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dl .p{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}

.journey{padding:22px 18px 18px}
.jends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);margin-bottom:15px}
.jtrack{position:relative;height:4px;background:var(--surface-2);border-radius:4px;margin:0 4px}
.jfill{position:absolute;left:0;top:0;height:100%;border-radius:4px;
  background:linear-gradient(90deg,var(--teal),var(--majorelle));transition:width .7s var(--ease)}
.jdot{position:absolute;top:50%;width:14px;height:14px;border-radius:14px;background:#fff;
  transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--void),0 0 18px rgba(255,255,255,.5);transition:left .7s var(--ease)}
.jmark{position:absolute;top:50%;width:7px;height:7px;border-radius:7px;transform:translate(-50%,-50%);box-shadow:0 0 0 3px var(--void)}
.jlabels{display:flex;justify-content:space-between;margin-top:18px;font-size:11.5px;color:var(--faint);gap:12px}
.jlabels b{display:block;font-family:var(--round);font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.02em}
.goal{padding:18px 0;border-bottom:1px solid var(--line)}
.goal:last-of-type{border-bottom:none;padding-bottom:0}
.g-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;gap:10px}
.g-n{font-family:var(--round);font-size:17px;font-weight:700;letter-spacing:-.025em}
.g-p{font-family:var(--mono);font-size:12px;color:var(--faint)}
.gtrack{height:10px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.gtrack i{display:block;height:100%;border-radius:10px;transition:width .7s var(--ease)}
.g-m{display:flex;justify-content:space-between;margin-top:10px;font-size:12px;gap:10px}
.g-m .l{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--faint)}
.g-m .l b{color:var(--text);font-weight:500}
.scen{display:flex;gap:7px;margin-top:13px}
.sc{flex:1;background:var(--surface-2);border-radius:13px;padding:10px 11px;min-width:0}
.sc .k{font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.sc .v{font-family:var(--round);font-size:14px;font-weight:700;margin-top:5px;letter-spacing:-.02em;white-space:nowrap}
.tgt{display:flex;align-items:center;gap:8px;margin-top:13px}
.tgt input{background:var(--surface-2);border-radius:11px;padding:9px 12px;font-family:var(--round);
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;width:112px}

.btn{display:block;width:100%;padding:14px;border-radius:14px;background:var(--surface-2);
  font-size:14.5px;font-weight:600;transition:transform .18s var(--spring);margin-top:9px}
.btn:active{transform:scale(.97)}
.btn.warn{color:var(--coral)}
.btn.go{background:var(--majorelle);color:#fff}
textarea.dump{width:100%;height:84px;background:var(--surface-2);border-radius:14px;padding:12px;
  font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:9px;resize:none}
.bkwarn{display:flex;gap:10px;align-items:center;padding:13px;border-radius:14px;
  background:rgba(255,179,61,.09);border:1px solid rgba(255,179,61,.24);font-size:12.5px;color:var(--muted);line-height:1.45}

/* -- backup page: three plain actions, the machinery folded away -- */
.bkstep{margin-top:22px}
.bkstep>b{display:block;font-size:15.5px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.bkstep .hint{margin:0}
/* A section title you can press. The underline carries the app's own
   light: majorelle into teal, with the glow sitting under the bar
   rather than around the text, so it stays legible.                 */
.bigt{display:flex;align-items:center;gap:10px;width:100%;padding:2px 0 12px;
  background:none;border:0;text-align:left;color:var(--text);
  font-family:var(--round);font-size:21px;font-weight:800;letter-spacing:-.032em}
.bigt:active{opacity:.65}
.bigt-w{position:relative;padding-bottom:11px}
.bigt-w::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.5px;border-radius:3px;
  background:linear-gradient(90deg,var(--majorelle),var(--teal));
  box-shadow:0 3px 16px -1px rgba(123,114,255,.7),0 3px 22px -2px rgba(47,212,188,.45)}
.bigt-c{width:9px;height:9px;border-right:2px solid var(--faint);border-bottom:2px solid var(--faint);
  transform:rotate(45deg) translate(-3px,-3px);transition:transform .25s var(--ease)}
.bigt.open .bigt-c{transform:rotate(225deg) translate(-1px,-1px)}
.sect{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);margin:34px 4px 12px}
.view>.sect:first-of-type{margin-top:26px}
.srow{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:20px;margin-top:10px;
  color:var(--text);font-family:var(--sans)}
.srow:active{background:var(--surface-2)}
.srow .ico{flex:none}
.srow .st{flex:1;min-width:0}
.srow .st b{display:block;font-family:var(--round);font-size:15.5px;font-weight:700;letter-spacing:-.02em}
.srow .st span{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.srow .chev{flex:none;width:8px;height:8px;border-right:2px solid var(--faint);
  border-bottom:2px solid var(--faint);transform:rotate(-45deg)}
.card.hero{background:linear-gradient(168deg,rgba(123,114,255,.10),rgba(47,212,188,.03) 62%),var(--surface);
  border-color:rgba(123,114,255,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 24px 56px -34px rgba(123,114,255,.9)}
.heroamt{font-family:var(--round);font-size:34px;font-weight:800;letter-spacing:-.042em;
  font-variant-numeric:tabular-nums;
  text-shadow:0 0 28px rgba(123,114,255,.55),0 0 60px rgba(47,212,188,.22)}
.purse{display:flex;align-items:baseline;gap:10px;margin-top:14px;padding:13px 15px;
  border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.pursebig{font-family:var(--round);font-size:24px;font-weight:800;letter-spacing:-.035em;
  font-variant-numeric:tabular-nums;line-height:1;transition:color .2s var(--ease)}
.pursesub{font-size:12px;color:var(--muted);line-height:1.35;flex:1}
.vs .sym,.chip .sym,.log em .sym{display:inline-block;vertical-align:-.2em;width:15px;height:15px}
.log em .sym{width:13px;height:13px;vertical-align:-.18em}
.bkwarn .sym,.offl .sym{width:16px;height:16px;flex:none;margin-top:1px}
.bkwarn .sym{color:var(--saffron)}
.offl .sym{color:var(--teal)}
.offl.warn .sym{color:var(--saffron)}
.step .sym{width:15px;height:15px;stroke-width:2.2}
.pctwrap .step .sym{width:14px;height:14px}
/* the single Home insight — a line, deliberately not another card */
.jvs{display:flex;gap:10px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.jvs>div{flex:1;min-width:0}
.jvs .k{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--faint)}
.jvs .v{display:block;margin-top:5px;font-family:var(--round);font-size:17px;font-weight:750;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.oneins{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:13px 15px;
  border-radius:16px;background:var(--surface);border:1px solid var(--line);
  font-size:13px;line-height:1.5;color:var(--muted)}
.oneins .sym{width:17px;height:17px;flex:none;margin-top:1px;color:var(--oic)}
.oneins b{font-weight:700;color:var(--text)}
.offl{display:flex;gap:9px;align-items:flex-start;margin-top:22px;padding:13px;border-radius:14px;font-size:12.5px;line-height:1.45;
  background:rgba(47,212,188,.07);border:1px solid rgba(47,212,188,.2);color:var(--muted)}
.offl.warn{background:rgba(255,179,61,.09);border-color:rgba(255,179,61,.24)}
.xlist{margin-top:18px}
.xrow{padding:13px 0;border-top:1px solid var(--line)}
.xrow>b{display:block;font-size:14.5px;font-weight:650;margin-bottom:3px}
.xrow>span{display:block;font-size:12.5px;color:var(--muted);line-height:1.5}
.adv{margin-top:26px;border-top:1px solid var(--line);padding-top:8px}
.advbtn{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 0;
  color:var(--faint);font-family:var(--sans);font-size:13px;font-weight:600}
.advbtn:active{opacity:.6}
#toast{position:fixed;left:50%;bottom:calc(var(--navtotal) + 14px);
  transform:translateX(-50%) translateY(10px);max-width:80%;text-align:center;
  background:rgba(30,27,60,.97);border:1px solid var(--line-2);color:var(--text);
  padding:12px 20px;border-radius:16px;font-size:13.5px;font-weight:600;
  box-shadow:0 14px 34px rgba(0,0,0,.45);z-index:120;opacity:0;pointer-events:none;
  transition:opacity .22s var(--ease),transform .22s var(--ease)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── gesture layer ──
   The incoming page is a still snapshot that lives above the current one
   and below the bar. It is only ever visible while a finger is down. */
#slide{position:fixed;left:0;right:0;top:0;bottom:0;z-index:2;overflow:hidden;
  pointer-events:none;display:none}
#slide.on{display:block}
#slide .scroll{position:absolute;top:0;left:0;right:0;height:100%;overflow:hidden;opacity:0;
  will-change:transform,opacity}
#glow{position:fixed;top:0;left:0;z-index:3;width:300px;height:300px;margin:-150px 0 0 -150px;
  border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,rgba(123,114,255,.20),rgba(47,212,188,.085) 46%,transparent 70%);
  transition:opacity .32s var(--ease)}
#glow i{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;opacity:0;
  transition:opacity .26s var(--ease);
  background:radial-gradient(circle,rgba(255,179,61,.15),transparent 62%)}
#glow.armed i{opacity:1}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  height:var(--navtotal);padding:8px 12px var(--sab);
  background:rgba(11,9,24,.72);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid var(--line);display:flex;justify-content:center;align-items:flex-start;gap:2px}
.tab{flex:1;max-width:92px;padding:8px 3px 5px;border-radius:14px;display:flex;flex-direction:column;
  align-items:center;gap:4px;color:var(--faint);transition:color .25s var(--ease),transform .18s var(--spring)}
.tab:active{transform:scale(.93)}
/* ── the drawn symbol set ──
   One weight, one cap, one join, everywhere. Symbols take the colour of
   whatever they sit in, so the tinted boxes stay exactly as they were
   and the glyph inside simply picks up the same hue. */
.sym{stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  width:1em;height:1em;display:block;flex:none}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;font-weight:600}
.tab.on{color:var(--majorelle)}
.view{animation:in .4s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="scroll" id="app"></div>
<div id="slide" aria-hidden="true"><div class="scroll" id="slideIn"></div></div>
<div id="glow" aria-hidden="true"><i></i></div>
<nav class="bar" id="bar"></nav>
<script>
"use strict";
/* ═══ 1. STORAGE ═══ */
var MEMONLY=false;
var store=(function(){
  try{localStorage.setItem("_t","1");localStorage.removeItem("_t");return localStorage;}
  catch(e){
    /* private browsing, or storage full: the app still runs, but only
       until the tab closes. Settings says so rather than pretending. */
    MEMONLY=true;
    var m={};return{getItem:function(k){return k in m?m[k]:null},setItem:function(k,v){m[k]=v}};
  }
})();
var KEY="plan.v4";
var BUILD="b26 \u00B7 insights";

/* ═══ 2. DEFINITIONS ═══ */
var COLOR={savings:"#2FD4BC",rent:"#7B72FF",utilities:"#B08CFF",household:"#FFB33D",
           personal:"#FF5C8A",us:"#FF7A5C",installments:"#5A52D9",buffer:"#8DA88F",oneoff:"#FF5C8A"};
/* which drawn symbol stands for each category */
var CATSYM={savings:"savings",rent:"house",utilities:"bolt",household:"cart",
            personal:"person",us:"heart",installments:"card",buffer:"buffer",oneoff:"warning"};
/* fixed = paid automatically, never logged · variable = you log it
   savings = the target · buffer = slack, becomes savings if unused */
var CATS=[
  {id:"savings",name:"Savings",type:"savings",note:"Leaves on payday, before anything else"},
  {id:"rent",name:"Rent",type:"fixed",note:""},
  {id:"utilities",name:"Electricity + Wi-Fi",type:"fixed",note:""},
  {id:"household",name:"Household",type:"variable",note:""},
  {id:"personal",name:"Personal",type:"variable",note:""},
  {id:"us",name:"Us",type:"variable",note:"Dinners out, weekends away"},
  {id:"installments",name:"Installments",type:"fixed",note:"Move to savings when they clear"},
  {id:"buffer",name:"Buffer",type:"buffer",note:"Set aside for small surprises. Whatever you don't use becomes savings when the month closes"}
];
/* Neutral starting numbers — this file sits at a public web address, so
   nothing personal is baked in. Your real figures live only on your phone. */
var BASE_ALLOC={savings:2000,rent:3000,utilities:300,household:2000,personal:1000,us:800,installments:0,buffer:900};
var BASE_LOCK={rent:true,utilities:true,installments:true};
var BASE_GOALS=[
  {id:"emergency",name:"Emergency Fund",e:"shield",target:40000,pct:40,col:"#2FD4BC",lock:false},
  {id:"morocco",name:"House Deposit",e:"house",target:168000,pct:40,col:"#7B72FF",lock:false},
  {id:"study",name:"Wife Study",e:"graduation",target:10000,pct:10,col:"#FFB33D",lock:false},
  {id:"travel",name:"Travel Fund",e:"plane",target:20000,pct:10,col:"#FF7A5C",lock:false}
];
function fresh(){return{salary:10000,goals:JSON.parse(JSON.stringify(BASE_GOALS)),months:{},
  tab:"home",monthCursor:null,weekIdx:null,pick:"household",lastBackup:null,name:"",wiGoal:null,more:false,returnTab:"home",wiAmt:0,cycleStart:15,clamp:null,card:{limit:0,used:0,payDay:18,lastPaid:null},payMethod:"bank",
  notes:[],noteId:null,noteQ:"",impact:0,calc:null,delArm:null,newg:false,bkAdv:false,allocInfo:false};}

var S=(function(){
  try{var r=store.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.months)return p;}}catch(e){}
  return fresh();
})();
/* carry an older save forward: two targets become four jars */
if(!S.goals){
  S.goals=JSON.parse(JSON.stringify(BASE_GOALS));
  if(S.targets){
    if(S.targets.emergency)S.goals[0].target=S.targets.emergency;
    if(S.targets.morocco)S.goals[1].target=S.targets.morocco;
  }
}
function save(){try{store.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ═══ 3. CALENDAR ═══ */
var MO=["January","February","March","April","May","June","July","August","September","October","November","December"];
var MOS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* ══ THE FINANCIAL MONTH ══
   A month runs from the day your money arrives, not from the 1st.
   With a start day of 15, "August 2026" means 15 Aug → 14 Sep.
   Set it to 1 and everything collapses back to calendar months. */
function cycleStart(){return Math.min(31,Math.max(1,S.cycleStart||1));}
function clampDay(y,m,day){return Math.min(day,new Date(y,m+1,0).getDate());}
function mKey(d){
  var y=d.getFullYear(),m=d.getMonth();
  if(d.getDate()<clampDay(y,m,cycleStart())){m-=1;if(m<0){m=11;y-=1;}}
  return y+"-"+String(m+1).padStart(2,"0");
}
function periodStart(k){
  var d=mParse(k),y=d.getFullYear(),m=d.getMonth();
  return new Date(y,m,clampDay(y,m,cycleStart()),0,0,0);
}
function periodEnd(k){
  var d=mParse(k),y=d.getFullYear(),m=d.getMonth()+1;
  if(m>11){m=0;y+=1;}
  var nxt=new Date(y,m,clampDay(y,m,cycleStart()),0,0,0);
  return new Date(nxt.getTime()-864e5+86399000);
}
function periodDays(k){return Math.round((periodEnd(k).getTime()+1000-periodStart(k).getTime())/864e5);}
function periodLabel(k){
  if(cycleStart()===1)return mName(k);
  var a=periodStart(k),b=periodEnd(k);
  return a.getDate()+" "+MOS[a.getMonth()]+" \u2013 "+b.getDate()+" "+MOS[b.getMonth()];
}
function periodDay(k){
  if(k!==thisMonth())return periodDays(k);
  return Math.max(1,Math.min(periodDays(k),Math.floor((Date.now()-periodStart(k))/864e5)+1));
}
function mParse(k){var p=k.split("-");return new Date(+p[0],+p[1]-1,1);}
function mName(k){var d=mParse(k);return MO[d.getMonth()]+" "+d.getFullYear();}
function mShort(k){return MOS[mParse(k).getMonth()];}
function thisMonth(){return mKey(new Date());}
function allMonths(){return Object.keys(S.months).sort();}
function prevOf(k){return allMonths().filter(function(x){return x<k;}).pop()||null;}
function ensureMonth(){
  var k=thisMonth();
  if(S.months[k])return k;
  var p=prevOf(k),src=p?S.months[p]:null;
  S.months[k]={salary:src?src.salary:S.salary,
    alloc:src?JSON.parse(JSON.stringify(src.alloc)):JSON.parse(JSON.stringify(BASE_ALLOC)),
    locks:src?JSON.parse(JSON.stringify(src.locks)):JSON.parse(JSON.stringify(BASE_LOCK)),
    changes:[],spend:[],override:null,split:currentSplit()};
  applyCardPayments();save();return k;
}
/* build the next period from the latest one, so you can plan forward */
function makeNext(k){
  var d=mParse(k);d.setMonth(d.getMonth()+1);
  var nk=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  if(!S.months[nk]){
    var src=M(k);
    S.months[nk]={salary:src.salary,
      alloc:JSON.parse(JSON.stringify(src.alloc)),
      locks:JSON.parse(JSON.stringify(src.locks)),
      changes:[],spend:[],override:null,split:currentSplit()};
  }
  return nk;
}
function cur(){var k=S.monthCursor||thisMonth();return S.months[k]?k:thisMonth();}
function M(k){return S.months[k];}
function isLive(k){return k===thisMonth();}
function isSettled(k){return k<thisMonth();}   /* only the past is finished */
function isAhead(k){return k>thisMonth();}

/* ═══ 4. THE EQUATION ═══
   saved = salary − fixed bills − actual variable spend − one-offs */
function fixedTotal(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="fixed")t+=(m.alloc[c.id]||0);});return t;}
function budgetVariable(k){var m=M(k),t=0;CATS.forEach(function(c){if(c.type==="variable")t+=(m.alloc[c.id]||0);});return t;}
function spentOn(k,id){return M(k).spend.reduce(function(s,e){return e.cat===id?s+e.amount:s;},0);}
function spentVariable(k){return M(k).spend.reduce(function(s,e){
  return (e.cat!=="oneoff"&&e.cat!=="buffer")?s+e.amount:s;},0);}
function spentOneoff(k){return M(k).spend.reduce(function(s,e){return e.cat==="oneoff"?s+e.amount:s;},0);}
/* ── the buffer ──
   Not a goal and not savings: an allowance held back each month for
   small surprises. While the month is live the whole allowance is
   reserved. When the month closes, whatever went unused stops being
   reserved and becomes savings, which then flows into the goals on
   that month's frozen split. The allowance itself never carries over. */
function bufferAmount(k){return M(k).alloc.buffer||0;}
/* Order money is taken in: the buffer first, savings only for what is
   left over. That is what the buffer is for — it protects the plan.

   Unless you lock it. A lock anywhere in this app means the same thing:
   this money does not move. So a locked buffer is not offered to a
   one-off at all, and the whole purchase lands on savings.          */
function bufferOpen(k){return !M(k).locks.buffer;}
function bufferUsed(k){return bufferOpen(k)?Math.min(spentOneoff(k),bufferAmount(k)):0;}
function bufferLeft(k){return Math.max(0,bufferAmount(k)-bufferUsed(k));}
function bufferFree(k){return bufferOpen(k)?bufferLeft(k):0;}
function oneoffOverflow(k){return Math.max(0,spentOneoff(k)-bufferUsed(k));}
function bufferCharge(k){return isSettled(k)?bufferUsed(k):Math.max(bufferAmount(k),bufferUsed(k));}
function bufferReturned(k){return isSettled(k)?bufferLeft(k):0;}
/* where the next ¥x would come from, and whether it can be covered */
function sourceCheck(k,extra){
  if(!extra||extra<=0)return null;
  var free=bufferFree(k),fromBuf=Math.min(extra,free),fromSav=extra-fromBuf;
  var savLeft=Math.max(0,savedActual(k));
  if(fromSav>savLeft)return{ok:false,buf:fromBuf,sav:fromSav,short:fromSav-savLeft,savLeft:savLeft};
  return{ok:true,buf:fromBuf,sav:fromSav,bufAfter:free-fromBuf,savAfter:savLeft-fromSav};
}
function totalOut(k){return fixedTotal(k)+spentVariable(k)+bufferUsed(k)+oneoffOverflow(k);}
function monthProgress(k){
  var t=thisMonth();
  if(k<t)return 1;if(k>t)return 0;
  return Math.max(0,Math.min(1,periodDay(k)/periodDays(k)));
}
/* One equation, and only one. The regular budget is assumed spent —
   you are not logging groceries — so the only thing that moves your
   savings is an unplanned one-off, or blowing past the budget itself.

   saved = salary − fixed bills − spending budget − buffer used − one-offs   */
function assumedSpend(k){return Math.max(budgetVariable(k),spentVariable(k));}
function savedActual(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return m.override;
  return m.salary-fixedTotal(k)-assumedSpend(k)-bufferCharge(k)-oneoffOverflow(k);
}
function savedProjected(k){return savedActual(k);}
function savedNow(k){return savedActual(k);}
function savedPlanned(k){return M(k).alloc.savings||0;}
/* one-offs are unplanned, so they come straight out of savings */
function effSavings(k){return (M(k).alloc.savings||0)-spentOneoff(k);}
/* ═══ FINANCIAL HEALTH ═══
   Two questions blended, because either alone lies.

   1. Attainment — did you hit the target YOU set?   saved / planned
      Weighted 70%. This is what the glow mostly tracks, and it is what
      a one-off destroys: buy a ¥4,000 TV against a ¥4,500 plan and
      attainment collapses from 1.0 to 0.11.

   2. Depth — is the target itself worth hitting?    saved / salary
      Weighted 30%, full marks at a 30% savings rate. Without this you
      could set a ¥200 target, hit it, and glow green while keeping
      almost nothing.

   Saving nothing, or less than nothing, is 0 regardless.            */
function healthFrom(salary,saved,planned){
  if(salary<=0)return 50;
  if(saved<=0)return 0;
  var att=planned>0?Math.min(1,saved/planned):1;
  var depth=Math.min(1,(saved/salary)/0.30);
  return Math.round(100*(0.7*att+0.3*depth));
}
function healthScore(k){return healthFrom(M(k).salary,savedActual(k),savedPlanned(k));}
/* Four stops, interpolated — the colour slides through the scale
   rather than snapping between four fixed states. */
var HEALTH_STOPS=[[0,[255,77,77]],[35,[255,122,61]],[65,[255,193,61]],[100,[47,212,188]]];
function healthRGB(v){
  v=Math.max(0,Math.min(100,v));
  for(var i=1;i<HEALTH_STOPS.length;i++){
    if(v<=HEALTH_STOPS[i][0]){
      var a=HEALTH_STOPS[i-1],b=HEALTH_STOPS[i],t=(v-a[0])/(b[0]-a[0]);
      return [0,1,2].map(function(j){return Math.round(a[1][j]+(b[1][j]-a[1][j])*t);});
    }
  }
  return [47,212,188];
}
function healthColor(v){return "rgb("+healthRGB(v).join(",")+")";}
function healthRGBA(v,al){return "rgba("+healthRGB(v).join(",")+","+al+")";}
function healthWhy(k,v){
  var m=M(k),saved=savedActual(k),planned=savedPlanned(k),oo=spentOneoff(k);
  var rate=m.salary>0?Math.round(Math.max(0,saved)/m.salary*100):0;
  if(m.salary<=0)return "Set your salary and this comes alive.";
  if(saved<0)return "You are spending \u00A5"+fmt(-saved)+" more than you earn this month.";
  if(oo>0&&saved<planned)
    return "\u00A5"+fmt(oo)+" of unplanned spending has taken your savings from \u00A5"+fmt(planned)+
           " down to \u00A5"+fmt(saved)+" \u2014 "+rate+"% of what you earn.";
  if(saved>=planned)return "On target at \u00A5"+fmt(saved)+", which is "+rate+"% of what you earn. Nothing unplanned so far.";
  return "Saving \u00A5"+fmt(saved)+" against a \u00A5"+fmt(planned)+" target \u2014 "+rate+"% of what you earn.";
}
function healthLabel(v){
  return v>=80?"On track":v>=60?"Slightly behind":v>=35?"Saving pressure":"Overspending risk";
}
function savingsRate(k){var m=M(k);return m.salary>0?Math.max(0,savedNow(k))/m.salary*100:0;}
function loggingThin(k){
  var m=M(k);
  if(m.override!==null&&m.override!==undefined)return false;
  if(k>=thisMonth())return false;
  var b=budgetVariable(k);return b>0&&spentVariable(k)<b*0.4;
}

/* ═══ 5. GOALS · STREAK · MILESTONES ═══ */
function closedMonths(){var t=thisMonth();return allMonths().filter(function(k){return k<t;});}
function banked(){return closedMonths().reduce(function(s,k){return s+Math.max(0,savedActual(k));},0);}
/* Each jar holds its share of everything banked. Change an allocation
   and the split recalculates — the shares always add to what you saved. */
function jarPct(j){return Math.max(0,j.pct||0);}
function pctTotal(){return S.goals.reduce(function(s,g){return s+jarPct(g);},0);}
/* ── monthly snapshots ──
   Each month freezes the split that was in force while it was live.
   A month that has ended never changes again, so moving an allocation
   today shapes future contributions without rewriting your history. */
function currentSplit(){var o={};S.goals.forEach(function(g){o[g.id]=jarPct(g);});return o;}
function splitOf(k){var m=M(k);return (m&&m.split)?m.split:currentSplit();}
function stampSplit(){var m=M(thisMonth());if(m)m.split=currentSplit();}
function contribution(k,id){
  var sp=splitOf(k),t=0;
  for(var i in sp)t+=sp[i]||0;
  return t>0?Math.max(0,savedActual(k))*(sp[id]||0)/t:0;
}
/* what a jar held at the end of month k */
function jarBalanceAt(k,g){
  return closedMonths().filter(function(x){return x<=k;})
    .reduce(function(s,x){return s+contribution(x,g.id);},0);
}
function jarBalance(g){
  return closedMonths().reduce(function(s,k){return s+contribution(k,g.id);},0);
}
function jarLeft(j){return Math.max(0,j.target-jarBalance(j));}
function jarRate(j){var t=pctTotal();return t>0?monthlyRate()*jarPct(j)/t:0;}
function jarETA(j){return etaFor(jarLeft(j),jarRate(j));}
function jarDone(j){return jarBalance(j)>=j.target;}
function topJar(){
  for(var i=0;i<S.goals.length;i++)if(!jarDone(S.goals[i]))return S.goals[i];
  return S.goals[0];
}
/* One share moves, the unlocked ones absorb it, the total stays at 100.
   A locked goal is never touched by someone else's change — it only
   moves when you change it yourself. */
function jarLocked(g){return !!g.lock;}
function balanceGoals(pinId){
  var pinned=S.goals.find(function(g){return g.id===pinId;});
  if(!pinned)return;
  var others=S.goals.filter(function(g){return g.id!==pinId;});
  var pool=others.filter(function(g){return !jarLocked(g);});
  var lockedSum=others.filter(jarLocked).reduce(function(s,g){return s+jarPct(g);},0);
  var room=Math.max(0,100-lockedSum);          /* what is actually free to divide */
  pinned.pct=Math.min(jarPct(pinned),room);    /* can never claim locked ground */
  if(!pool.length){pinned.pct=room;return;}    /* everything else pinned down */
  var target=Math.max(0,room-jarPct(pinned));
  var sum=pool.reduce(function(s,g){return s+jarPct(g);},0);
  if(sum<=0){var e=target/pool.length;pool.forEach(function(g){g.pct=Math.round(e);});}
  else{var r=target/sum;pool.forEach(function(g){g.pct=Math.max(0,Math.round(jarPct(g)*r));});}
  var drift=100-pctTotal();
  if(drift!==0){
    var big=pool.reduce(function(a,b){return jarPct(a)>=jarPct(b)?a:b;});
    big.pct=Math.max(0,jarPct(big)+drift);
  }
}
function moveGoal(id,dir){
  var i=S.goals.findIndex(function(g){return g.id===id;}),j=i+dir;
  if(i<0||j<0||j>=S.goals.length)return;
  var t=S.goals[i];S.goals[i]=S.goals[j];S.goals[j]=t;
}
/* ── deadlines ──
   A date on its own would be decoration. It is only ever shown against
   the ETA your own saving rate produces, so it can tell you one thing:
   whether the rate you are actually saving at gets there in time.
   It changes no allocation and no total. */
function monthsNeeded(g){
  var left=jarLeft(g);if(left<=0)return 0;
  var r=jarRate(g);return r>0?Math.ceil(left/r):Infinity;
}
function monthsUntil(due){
  if(!due||due.length<7)return null;
  var y=+due.slice(0,4),m=+due.slice(5,7),n=new Date();
  if(!y||!m)return null;
  return (y-n.getFullYear())*12+(m-1-n.getMonth());
}
function dueLabel(due){return MOS[+due.slice(5,7)-1]+" "+due.slice(0,4);}
function dueText(g){
  var away=monthsUntil(g.due);
  if(away===null)return null;
  var lbl="by "+dueLabel(g.due);
  if(jarDone(g))return{t:lbl+" \u00B7 reached",c:"var(--teal)"};
  var need=monthsNeeded(g);
  if(need===Infinity)return{t:lbl+" \u00B7 no saving rate yet",c:"var(--faint)"};
  var late=need-away;
  if(late<=0){
    var early=-late;
    if(early<1)return{t:lbl+" \u00B7 on pace",c:"var(--teal)"};
    if(early>24)return{t:lbl+" \u00B7 well ahead",c:"var(--teal)"};
    return{t:lbl+" \u00B7 about "+early+" month"+(early===1?"":"s")+" ahead",c:"var(--teal)"};
  }
  if(late>24)return{t:lbl+" \u00B7 behind target",c:"var(--coral)"};
  return{t:lbl+" \u00B7 behind by "+late+" month"+(late===1?"":"s"),c:"var(--coral)"};
}
/* ── adding and removing a goal ──
   A new goal takes its share out of the unlocked ones, exactly as
   moving a slider does. Closed months keep the split they froze, so
   nothing already banked is re-cut. */
var GCOL=["#7B72FF","#2FD4BC","#FFB33D","#FF7A5C","#5AC8FA","#C77DFF","#4ADE80","#F472B6"];
var GEMO=["shield","house","graduation","plane","car","gift","laptop","star"];
function nextCol(){
  var used=S.goals.map(function(g){return g.col;});
  for(var i=0;i<GCOL.length;i++)if(used.indexOf(GCOL[i])<0)return GCOL[i];
  return GCOL[S.goals.length%GCOL.length];
}
function lockedRoom(){
  var lk=S.goals.filter(jarLocked).reduce(function(s,g){return s+jarPct(g);},0);
  return Math.max(0,100-lk);
}
function addGoal(name,target,pct,due,emo){
  var g={id:"g"+Date.now().toString(36),name:name,e:emo||GEMO[0],target:target,
         pct:0,col:nextCol(),lock:false,due:due||""};
  S.goals.push(g);
  g.pct=Math.max(0,Math.min(100,pct||0));

        .filter(function(x){return x>0;});

   Everything below reads figures the app already keeps. Nothing new is
   calculated about your money, and nothing is claimed when the record
   is too short to support it — each function returns null instead. */

/* What you have actually put away in recent closed months. Needs at
   least two, or there is no "usual" to compare against. */
function recentAverage(exclude){
  var v=closedMonths().filter(function(k){return k!==exclude;}).slice(-3)
        .map(function(k){return Math.max(0,savedActual(k));});
  if(v.length<2)return null;

  if(!due.length)return null;

/* One sentence of plain reading for the Journey comparison. It only

function journeyRead(k,p){
  var now=Math.max(0,savedActual(k)),was=Math.max(0,savedActual(p));
  var avg=recentAverage(k);

    if(now<avg*0.95)return "This month is below your recent average. One month is not a trend, but two would be.";
    return "This month is in line with your recent average \u2014 steady.";

  }

/* ═══ 8. BALANCE ENGINE ═══ */
/* No line can claim money that is not there. Whatever you are moving is
   capped at income minus everything locked; the unlocked lines share the
   rest. The total can never exceed your salary. */
function balance(k,pin){
  var m=M(k),lockedSum=0,pool=[];
  CATS.forEach(function(c){
    if(c.id===pin)return;
    if(m.locks[c.id])lockedSum+=(m.alloc[c.id]||0);else pool.push(c.id);
  });
  var room=Math.max(0,m.salary-lockedSum);
  if(pin){
    var want=m.alloc[pin]||0;
    if(want>room){
      S.clamp={id:pin,want:want,got:room,locked:lockedSum,ts:Date.now()};
      m.alloc[pin]=room;
    }else if(S.clamp&&S.clamp.id===pin)S.clamp=null;
  }
  if(!pool.length)return;
  var target=Math.max(0,room-(pin?(m.alloc[pin]||0):0));
  var sum=pool.reduce(function(s,id){return s+(m.alloc[id]||0);},0);
  if(sum<=0){var e=target/pool.length;pool.forEach(function(id){m.alloc[id]=Math.round(e);});}
  else{var r=target/sum;pool.forEach(function(id){m.alloc[id]=Math.max(0,Math.round((m.alloc[id]||0)*r));});}
  var drift=m.salary-CATS.reduce(function(s,c){return s+(m.alloc[c.id]||0);},0);
  if(drift!==0){
    var big=pool.reduce(function(x,y){return (m.alloc[x]||0)>=(m.alloc[y]||0)?x:y;});
    m.alloc[big]=Math.max(0,(m.alloc[big]||0)+drift);
  }
}

function ringSVG(pct,color){

    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="#1E1B3C" stroke-width="9"/>'+
    '<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="9" stroke-linecap="round" '+
    'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'"/></g></svg>';
}
function donutSVG(rows){
  var total=rows.reduce(function(s,r){return s+r.value;},0);
  if(total<=0)return null;
  var R=42,C=2*Math.PI*R,off=0,s='<svg viewBox="0 0 100 100"><g transform="rotate(-90 50 50)">';
  rows.forEach(function(r){
    var len=r.value/total*C,seg=Math.max(0.5,len-1.6);
    s+='<circle cx="50" cy="50" r="'+R+'" fill="none" stroke="'+r.color+'" stroke-width="13" '+
       'stroke-dasharray="'+seg.toFixed(2)+' '+(C-seg).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
    off+=len;
  });
  return s+'</g></svg>';
}
function barChart(rows,h){
  h=h||62;
  if(!rows.length)return '<div class="empty">Nothing to chart yet.</div>';
  var W=100,n=rows.length,max=Math.max.apply(null,rows.map(function(r){return Math.max(r.value,r.target||0);}))||1;
  var gap=1.6,bw=(W-gap*(n-1))/n;
  var s='<svg class="chart" viewBox="0 0 '+W+' '+h+'" preserveAspectRatio="none">';
  rows.forEach(function(r,i){

    if(r.target){var ty=h-(r.target/max*h);
      s+='<line x1="'+x+'" y1="'+ty+'" x2="'+(x+bw)+'" y2="'+ty+'" stroke="rgba(255,255,255,.32)" stroke-width=".7" stroke-dasharray="1.6 1.4"/>';}
    s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,.8)+'" rx="1.2" fill="'+(r.color||"#7B72FF")+'" opacity="'+(r.faded?.45:1)+'"/>';

/* Anything fixed to the screen must not live inside an animated box */

/* ══ IN-PLACE UPDATES ══
   A value edit is not a new page. Rebuilding #app.innerHTML for one
   changed number throws away every node on the screen and builds it
   again, which is what the eye sees as a flash — the browser really is
   painting a blank box and then a fresh one.

   So: generate the same HTML as before, but instead of assigning it,
   walk it against what is already on screen and change only the parts
   that differ. Nodes that are unchanged are never touched, which means
   the caret stays in its field, the sheet stays mounted, the scroll
   position never moves, and no animation restarts, because none of
   those elements was ever destroyed.                                */

/* Two nodes are "the same node in a new state" if they are the same
   kind of thing with the same identity. Anything with an id or a
   data- attribute carries its own identity; the rest match by position. */
/* An element's identity, used to decide whether a node on screen and a
   node in the new HTML are the same thing in a new state. It must not be
   built from anything that changes as the numbers change — give such an
   element an id, as #wiCard has, or it will be rebuilt on every edit. */
function domKey(el){
  if(el.id)return "#"+el.id;
  var a=el.attributes,i;
  if(a)for(i=0;i<a.length;i++)if(a[i].name.indexOf("data-")===0)return a[i].name+"\u0000"+a[i].value;
  return null;
}
function domSame(a,b){
  if(a.nodeType!==b.nodeType)return false;
  if(a.nodeType!==1)return true;
  if(a.tagName!==b.tagName)return false;
  return domKey(a)===domKey(b);
}
var FIELDS={INPUT:1,TEXTAREA:1,SELECT:1};
function domAttrs(live,next){
  var i,a,n=next.attributes,o=live.attributes;
  for(i=0;i<n.length;i++){
    a=n[i];
    if(live.getAttribute(a.name)!==a.value)live.setAttribute(a.name,a.value);
  }
  for(i=o.length-1;i>=0;i--){
    a=o[i];
    if(!next.hasAttribute(a.name))live.removeAttribute(a.name);
  }
  if(FIELDS[live.tagName]){
    /* never reach into the field the finger is in */
    if(document.activeElement===live)return;
    var v=next.tagName==="TEXTAREA"?next.textContent:(next.getAttribute("value")||"");
    if(next.hasAttribute("value")||next.tagName==="TEXTAREA"){
      if(String(live.value)!==String(v))live.value=v;
    }
    if(live.tagName==="INPUT"&&live.type!=="checkbox"&&!next.hasAttribute("value")&&live.value!==""){
      live.value="";
    }
  }
}
function domPatch(live,next){
  if(!domSame(live,next)){
    live.parentNode.replaceChild(next.cloneNode(true),live);
    return;
  }
  if(live.nodeType!==1){
    if(live.nodeValue!==next.nodeValue)live.nodeValue=next.nodeValue;
    return;
  }
  domAttrs(live,next);
  domChildren(live,next);
}
function domChildren(live,next){
  var lk=live.firstChild,nx=next.firstChild,lnext,keep;
  while(nx){
    if(!lk){
      live.appendChild(nx.cloneNode(true));
      nx=nx.nextSibling;continue;
    }
    if(domSame(lk,nx)){
      lnext=lk.nextSibling;
      domPatch(lk,nx);
      lk=lnext;nx=nx.nextSibling;continue;
    }
    /* the expected node is not here: look ahead for it before giving up,
       so a reorder moves a node instead of rebuilding it */
    keep=null;
    for(var c=lk.nextSibling;c;c=c.nextSibling){if(domSame(c,nx)){keep=c;break;}}
    if(keep){
      live.insertBefore(keep,lk);
      domPatch(keep,nx);
      nx=nx.nextSibling;continue;
    }
    live.insertBefore(nx.cloneNode(true),lk);
    nx=nx.nextSibling;
  }
  while(lk){lnext=lk.nextSibling;live.removeChild(lk);lk=lnext;}
}
/* Patch the children of a live element from freshly generated HTML.
   `unwrap` takes the children of the first element instead, for view
   functions that return their own wrapper. */
function domSync(live,html,unwrap){
  if(!live)return false;
  var tmp=document.createElement("div");
  tmp.innerHTML=html;
  var src=tmp;
  if(unwrap){
    src=tmp.firstElementChild;
    if(!src)return false;
  }
  domChildren(live,src);
  return true;
}

/* What you have to spend, shown before anything is typed and moved as
   you type. Standing still it answers "can I afford this?"; while you
   type it answers "what will be left?".                              */
function purseHTML(k,amt){
  var sav=Math.max(0,savedActual(k)),buf=bufferFree(k);
  var take=Math.max(0,amt||0);
  var fromBuf=Math.min(take,buf),fromSav=Math.min(take-fromBuf,sav);
  var savAfter=sav-fromSav,bufAfter=buf-fromBuf;
  var short=take-fromBuf-fromSav;

  var big=take>0?savAfter:sav;
  var col=short>0?"var(--coral)":(big<=0?"var(--saffron)":"var(--teal)");
  var sub;
  if(take<=0)
    sub="saved this month"+(buf>0?" \u00B7 plus \u00A5"+fmt(buf)+" of buffer":"")+
        (bufferOpen(k)?"":" \u00B7 buffer locked");
  else if(short>0)
    sub="\u00A5"+fmt(short)+" more than you have";
  else
    sub="left after this"+(bufAfter>0?" \u00B7 buffer \u00A5"+fmt(bufAfter):"");

  return '<div class="pursebig" style="color:'+col+'">\u00A5'+fmt(Math.max(0,big))+'</div>'+
         '<div class="pursesub">'+sub+'</div>';
}

function viewJourney(){
  var k=cur(),p=prevOf(k),h='<div class="view">';
  h+=backLink();
  var months=allMonths().slice(-8);
  var total=cumulativeTo(k),saved=Math.max(0,savedActual(k));
  var prevSaved=p?Math.max(0,savedActual(p)):null;
  var delta=prevSaved===null?null:saved-prevSaved;

  /* the journey so far */
  h+='<div class="card" style="padding:24px 22px"><span class="lab">Your journey</span>'+
     '<div class="jamt" style="margin-top:12px;font-size:38px">\u00A5'+fmt(total)+'</div>'+
     '<div class="jof" style="margin-top:7px">saved since you started'+
     (delta!==null?' \u00B7 <span style="color:'+(delta>=0?"var(--teal)":"var(--coral)")+'">'+
       (delta>=0?"\u2191 \u00A5"+fmt(delta)+" more":"\u2193 \u00A5"+fmt(-delta)+" less")+' than '+mShort(p)+'</span>':'')+'</div>';
  if(months.length>1)h+='<div style="margin-top:22px">'+
     areaChart(months.map(function(x){return cumulativeTo(x);}),months.map(mShort),"#7B72FF")+'</div>';
  else h+='<p class="hint" style="margin-top:16px">One month recorded. The curve appears once a second month closes.</p>';
  h+='</div>';

  /* this month against last */
  if(p){
    var sp=totalSpendOf(k),spP=totalSpendOf(p),spD=sp-spP;
    var pct=prevSaved>0?Math.round((saved-prevSaved)/prevSaved*100):null;
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">'+mName(k).split(" ")[0]+' vs '+mShort(p)+'</span></div>'+
       '<div class="scen">'+
       '<div class="sc"><div class="k">saved</div><div class="v" style="color:'+(delta>=0?"var(--teal)":"var(--coral)")+'">'+
         (pct===null?"\u00A5"+fmt(saved):(pct>=0?"+":"")+pct+"%")+'</div></div>'+
       '<div class="sc"><div class="k">spending</div><div class="v" style="color:'+(spD<=0?"var(--teal)":"var(--coral)")+'">'+
         (spD===0?"same":(spD<0?"\u2193 ":"\u2191 ")+"\u00A5"+fmt(Math.abs(spD)))+'</div></div>'+
       '<div class="sc"><div class="k">kept</div><div class="v">'+Math.round(rateOf(k))+'%</div></div>'+
       '</div>'+
       '<div class="jvs">'+
         '<div><span class="k">'+mShort(k)+'</span><span class="v">\u00A5'+fmt(saved)+'</span></div>'+
         '<div><span class="k">'+mShort(p)+'</span><span class="v">\u00A5'+fmt(prevSaved)+'</span></div>'+
         (function(){
           var avg=recentAverage(k);
           return avg===null?"":'<div><span class="k">recent average</span><span class="v">\u00A5'+fmt(Math.round(avg))+'</span></div>';
         })()+
       '</div>'+
       '<p class="hint" style="margin-top:14px">'+journeyRead(k,p)+'</p>'+
       '</div>';
  }

  /* how each jar has grown */
  if(closedMonths().length>1){
    var cm=closedMonths().slice(-8);
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">Goals over time</span></div>';
    S.goals.forEach(function(g){
      var series=cm.map(function(x){return jarBalanceAt(x,g);});
      if(series[series.length-1]<=0)return;
      h+='<div style="margin-top:16px"><div class="dl" style="margin-bottom:8px">'+
         '<span class="dot" style="background:'+g.col+'"></span><span class="n">'+g.name+'</span>'+
         '<span class="p" style="color:'+g.col+'">\u00A5'+fmt(series[series.length-1])+'</span></div>'+
         areaChart(series,cm.map(mShort),g.col)+'</div>';
    });
    h+='</div>';
  }

  /* what changed */
  var notes=journeyNotes(k,p);
  if(notes.length){
    h+='<div class="card" style="padding:22px"><div class="card-h"><span class="card-t">What changed</span></div>';
    notes.forEach(function(n){h+='<div class="ins"><span class="ic">'+sym(n.i)+'</span><span class="tx">'+n.t+'</span></div>';});
    h+='</div>';
  }
  return h+'</div>';
}

/* two or three short observations, never a wall of text */
function journeyNotes(k,p){
  var out=[],st=streak();
  if(p){
    var a=Math.max(0,savedActual(k)),b=Math.max(0,savedActual(p));
    if(b>0&&Math.abs(a-b)>=100){
      var d=Math.round((a-b)/b*100);
      out.push({i:d>0?"up":"down",
        t:"Your savings "+(d>0?"rose":"fell")+" <b>"+Math.abs(d)+"%</b> against "+mShort(p)+"."});
    }
  }
  var lead=S.goals.filter(function(g){return !jarDone(g);})
    .sort(function(x,y){return jarPct(y)-jarPct(x);})[0];
  if(lead&&jarRate(lead)>0)
    out.push({i:lead.e,t:"Most of your saving goes to <b>"+lead.name+"</b>. At this rate it lands "+jarETA(lead)+"."});
  if(out.length<3&&lead){
    var faster=jarLeft(lead)/(jarRate(lead)+monthlyRate()*0.05);
    if(jarRate(lead)>0&&isFinite(faster)){
      var now=Math.ceil(jarLeft(lead)/jarRate(lead)),then=Math.ceil(faster);
      if(now-then>=1)out.push({i:"bolt",
        t:"Give <b>"+lead.name+"</b> 5% more and it arrives "+ahead(then)+" instead of "+ahead(now)+"."});
    }
  }
  if(out.length<3&&st>=2)out.push({i:"flame",t:"You have hit your target <b>"+st+" months</b> running."});
  return out.slice(0,3);
}

/* ═══ TOOLS ═══
   Two things the phone's own apps can't do: run a number against the
   goals you actually have, and keep a note tied to one of them. */
function calcState(){
  if(!S.calc)S.calc={d:"0",acc:null,op:null,fresh:true,memo:""};
  return S.calc;
}
function calcPress(key){
  var c=calcState();
  if(key>="0"&&key<="9"){
    c.d=(c.fresh||c.d==="0")?key:(c.d.length<12?c.d+key:c.d);c.fresh=false;
  }else if(key==="."){
    if(c.fresh){c.d="0.";c.fresh=false;}
    else if(c.d.indexOf(".")<0)c.d+=".";
  }else if(key==="C"){
    c.d="0";c.acc=null;c.op=null;c.fresh=true;c.memo="";
  }else if(key==="back"){
    c.d=c.d.length>1?c.d.slice(0,-1):"0";if(c.d==="-")c.d="0";
  }else if(key==="+"||key==="-"||key==="x"||key==="/"){
    if(c.op!==null&&!c.fresh)calcPress("=");
    c.acc=parseFloat(c.d)||0;c.op=key;c.fresh=true;
    c.memo=trimNum(c.acc)+" "+opSign(key);
  }else if(key==="="){
    if(c.op===null)return;
    var b=parseFloat(c.d)||0,a=c.acc||0,r=a;
    if(c.op==="+")r=a+b; else if(c.op==="-")r=a-b;
    else if(c.op==="x")r=a*b; else if(c.op==="/")r=b===0?0:a/b;
    c.memo=trimNum(a)+" "+opSign(c.op)+" "+trimNum(b)+" =";
    c.d=trimNum(r);c.acc=null;c.op=null;c.fresh=true;
  }
}
function opSign(o){return o==="x"?"\u00D7":o==="/"?"\u00F7":o;}
function trimNum(n){
  if(!isFinite(n))return "0";
  var r=Math.round(n*100)/100;
  return (Math.abs(r)>=1e12)?String(r.toExponential(4)):String(r);
}
function calcValue(){return parseFloat(calcState().d)||0;}

function relDate(ts){
  var d=new Date(ts),n=new Date(),day=864e5;
  var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();

  var diff=Math.round((b-a)/day);
  if(diff===0)return "Today";
  if(diff===1)return "Yesterday";
  if(diff<7)return diff+" days ago";
  return d.getDate()+" "+MOS[d.getMonth()];

/* ══ CREDIT CARD AWARENESS ══
   Not a banking module. The card reads the Installments line you already
   set on Plan — that is the payment that gives credit back. Nothing here
   treats credit as income. */
function card(){
  if(!S.card)S.card={limit:0,used:0,payDay:18,lastPaid:null};
  return S.card;
}
function cardOn(){return card().limit>0;}
function cardAvail(){return Math.max(0,card().limit-card().used);}
function cardUsage(){return card().limit>0?card().used/card().limit*100:0;}
function nextPayment(){return M(thisMonth()).alloc.installments||0;}
function cardAvailAfter(){return cardAvail()+nextPayment();}
function nextPayDate(){
  var d=new Date(),y=d.getFullYear(),m=d.getMonth(),day=Math.min(card().payDay||18,28);
  if(d.getDate()>day){m+=1;if(m>11){m=0;y+=1;}}
  return new Date(y,m,clampDay(y,m,day));
}
function payDateLabel(){var d=nextPayDate();return d.getDate()+" "+MOS[d.getMonth()];}
/* a closed period means its installment was paid, so that credit comes back */
function applyCardPayments(){
  if(!cardOn())return;
  var c=card(),last=c.lastPaid;
  closedMonths().forEach(function(k){
    if(!last||k>last){
      var pay=M(k).alloc.installments||0;
      if(pay>0)c.used=Math.max(0,c.used-pay);
      c.lastPaid=k;
    }
  });
}
/* Verdict on putting an amount on the card. Credit you have not been
   given back yet is not credit you can spend — the upcoming payment is
   told to you, but it never authorises a purchase. */
function cardCheck(amount){
  if(!cardOn()||!amount||amount<=0)return null;
  var av=cardAvail(),np=nextPayment(),back=np>0?" \u00A5"+fmt(np)+" comes back on "+payDateLabel()+".":"";
  if(amount<=av)return{ok:true,level:"clear",
    msg:"\u00A5"+fmt(av-amount)+" of credit would remain."};
  return{ok:false,level:"over",short:amount-av,
    msg:(av>0?"Only \u00A5"+fmt(av)+" is available \u2014 that is \u00A5"+fmt(amount-av)+" short."
             :"Your card is at its limit, so there is nothing to spend.")+back};
}
function ordinal(n){
  var t=n%100;if(t>=11&&t<=13)return n+"th";
  return n+({1:"st",2:"nd",3:"rd"}[n%10]||"th");
}
