/* ═══ 11b. TOAST — one small confirmation, never a blocking dialog ═══ */
var _toastT=null;
function toast(msg){
  var t=document.getElementById("toast");
  if(!t){t=document.createElement("div");t.id="toast";document.body.appendChild(t);}
  t.textContent=msg;
  t.classList.remove("on");
  void t.offsetWidth;
  t.classList.add("on");
  clearTimeout(_toastT);
  _toastT=setTimeout(function(){t.classList.remove("on");},2200);
}

/* ═══ 11c. HANDING A FILE TO THE PHONE ═══
   Three routes, tried in order, because a page opened inside a wrapper
   app is not allowed to navigate to a blob: or data: address — that is
   the "resources outside the application" message.
     1. the native share sheet, which hands iOS a real file
     2. a download link pointing at a blob
     3. a download link pointing at the data itself
   Everything is plain text, so the payload is always a string.        */
function isoDay(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function saveFile(name,mime,text,onDone,onFail){
  var blob=null;
  try{blob=new Blob([text],{type:mime});}catch(e){blob=null;}
  try{
    if(blob&&window.File&&navigator.share&&navigator.canShare){
      var f=new File([blob],name,{type:mime});
      if(navigator.canShare({files:[f]})){
        navigator.share({files:[f],title:name}).then(
          function(){if(onDone)onDone();},
          function(err){
            if(err&&err.name==="AbortError")return;   /* they tapped Cancel */
            anchorSave(name,mime,blob,text,onDone,onFail);
          });
        return true;
      }
    }
  }catch(e){}
  return anchorSave(name,mime,blob,text,onDone,onFail);
}
function anchorSave(name,mime,blob,text,onDone,onFail){
  var url=null,isBlob=false;
  try{if(blob&&window.URL&&URL.createObjectURL){url=URL.createObjectURL(blob);isBlob=true;}}catch(e){url=null;}
  if(!url){
    try{url="data:"+mime+";charset=utf-8,"+encodeURIComponent(text);}catch(e){url=null;}
  }
  if(!url){if(onFail)onFail();return false;}
  try{
    var a=document.createElement("a");
    a.href=url;a.download=name;a.rel="noopener";
    a.style.position="fixed";a.style.left="-9999px";a.style.opacity="0";
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      try{document.body.removeChild(a);}catch(e){}

/* ═══ 11d. BACKUP — write, read, check ═══
   Every export is wrapped so a file can identify itself. Files written
   by older builds were the bare state object, and those still restore. */
var BK_SCHEMA=1;
function backupText(){
  return JSON.stringify({app:"plan",schema:BK_SCHEMA,build:BUILD,
    exported:new Date().toISOString(),data:S},null,2);

/* returns {data:...} or {err:"plain sentence"} — never throws */
function readBackup(raw){
  var p;
  try{p=JSON.parse(raw);}
  catch(e){return{err:"That file could not be read. It is not a backup, or it was only partly copied."};}
  if(!p||typeof p!=="object"||p instanceof Array)return{err:"That file is not a backup from this app."};
  var d=p;
  if(p.app!=null||p.schema!=null||p.data!=null){
    if(p.app!=="plan")return{err:"That backup was made by a different app."};
    if((p.schema||0)>BK_SCHEMA)return{err:"That backup was made by a newer version of this app. Update the app first, then restore."};
    d=p.data;
  }
  if(!d||typeof d!=="object")return{err:"The backup is empty."};
  if(!d.months||typeof d.months!=="object"||d.months instanceof Array)
    return{err:"That file is not a backup from this app \u2014 it has no months in it."};
  var out=fresh(),key;
  for(key in d)if(Object.prototype.hasOwnProperty.call(d,key))out[key]=d[key];
  if(!out.goals||!out.goals.length)out.goals=JSON.parse(JSON.stringify(BASE_GOALS));
  if(!out.card)out.card={limit:0,used:0,payDay:18,lastPaid:null};
  if(!out.notes)out.notes=[];
  return{data:out};
}
function restoreFrom(raw){
  var r=readBackup(raw);
  if(r.err){alert(r.err);return false;}
  var n=Object.keys(r.data.months).length,g=(r.data.goals||[]).length;
  if(!confirm("Restore this backup? Current data will be replaced.\n\n"+
    n+" month"+(n===1?"":"s")+" \u00B7 "+g+" goal"+(g===1?"":"s")+" in the file."))return false;
  S=r.data;
  S.tab="backup";S.more=false;
  save();render();
  toast("Backup restored");
  return true;
}

function legacyCopy(txt,done){

  t.value=txt;

  t.style.width="1px";t.style.height="1px";t.style.opacity="0";t.style.fontSize="16px";

/* ═══ 11e. PDF — written by hand, no library, no network ═══
   The whole file stays inside 7-bit ASCII: anything above 127 is
   written as an octal escape, so the string and the bytes are the
   same length and the cross-reference offsets are always right.     */
var PW=595.28,PH=841.89,PM=46;
var HW={};
(function(){
  var s=" !\"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~";
  var w=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,
         556,556,556,556,556,556,556,556,556,556,
         278,278,584,584,584,556,1015,
         667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
         278,278,278,469,556,333,
         556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,
         334,260,334,584];
  for(var i=0;i<s.length;i++)HW[s.charAt(i)]=w[i];
})();
/* typographic characters that do exist in WinAnsi, at their WinAnsi code */
var WANSI={"\u2013":150,"\u2014":151,"\u2018":145,"\u2019":146,"\u201C":147,"\u201D":148,
           "\u2022":149,"\u2026":133,"\u20AC":128,"\u2122":153,"\u2039":139,"\u203A":155};
/* drop anything Helvetica cannot draw, so widths and bytes agree */
function pdfSafe(s){
  s=String(s==null?"":s);
  var o="",i,c,ch;
  for(i=0;i<s.length;i++){
    ch=s.charAt(i);c=s.charCodeAt(i);
    if(WANSI[ch]!=null)c=WANSI[ch];
    if(c===9||c===10||c===13){o+=" ";continue;}
    if(c<32)continue;
    if(c<256)o+=String.fromCharCode(c);
  }
  return o;
}
function pdfEsc(s){
  var o="",i,c;
  for(i=0;i<s.length;i++){
    c=s.charCodeAt(i);
    if(c===40||c===41||c===92)o+="\\"+s.charAt(i);
    else if(c<127)o+=s.charAt(i);
    else o+="\\"+("00"+c.toString(8)).slice(-3);
  }
  return o;
}
function tw(s,size,bold){
  s=pdfSafe(s);
  var t=0,i,c,w;
  for(i=0;i<s.length;i++){
    c=s.charAt(i);w=HW[c];
    if(w==null)w=556;                                   /* \u00A5 and friends */
    if(bold&&c>="A"&&c<="z")w=Math.round(w*1.07);       /* bold letters run wider */
    t+=w;
  }
  return t*size/1000;
}
function f2(n){return (Math.round(n*100)/100).toString();}
function pdfRGB(hex){
  var h=hex.replace("#","");
  var r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;
  return f2(r)+" "+f2(g)+" "+f2(b);
}
function pdfNew(){return{pages:[],ops:null,y:0};}
function pdfOp(D,s){D.ops.push(s);}
function pdfFill(D,x,y,w,h,col){
  if(w<=0||h<=0)return;
  pdfOp(D,"q "+pdfRGB(col)+" rg "+f2(x)+" "+f2(y)+" "+f2(w)+" "+f2(h)+" re f Q");
}
function pdfRound(D,x,y,w,h,col){pdfFill(D,x,y,w,h,col);}   /* square corners print cleaner */
function pdfText(D,x,y,s,size,bold,col,tc){
  var safe=pdfSafe(s);
  if(!safe)return;
  pdfOp(D,"BT "+pdfRGB(col)+" rg /"+(bold?"F2":"F1")+" "+f2(size)+" Tf"+
    (tc?" "+f2(tc)+" Tc":" 0 Tc")+" 1 0 0 1 "+f2(x)+" "+f2(y)+" Tm ("+pdfEsc(safe)+") Tj ET");
}
function pdfTextR(D,xr,y,s,size,bold,col){
  pdfText(D,xr-tw(s,size,bold),y,s,size,bold,col);
}
function pdfWords(s,fallback){
  var t=pdfSafe(s).replace(/\s+/g," ").replace(/^ | $/g,"");
  return t||fallback;
}
function pdfClip(s,size,bold,max){
  s=String(s==null?"":s);
  if(tw(s,size,bold)<=max)return s;
  while(s.length>1&&tw(s+"\u2026",size,bold)>max)s=s.slice(0,-1);
  return s+"\u2026";
}
function pdfBuild(D){
  var n=D.pages.length,i,objs=[],kids="";
  for(i=0;i<n;i++)kids+=(6+2*i)+" 0 R ";
  objs[1]="1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n";
  objs[2]="2 0 obj\n<< /Type /Pages /Count "+n+" /Kids ["+kids.replace(/\s+$/,"")+"] >>\nendobj\n";
  objs[3]="3 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>\nendobj\n";
  objs[4]="4 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>\nendobj\n";
  for(i=0;i<n;i++){
    var c=D.pages[i].join("\n")+"\n";
    objs[5+2*i]=(5+2*i)+" 0 obj\n<< /Length "+c.length+" >>\nstream\n"+c+"endstream\nendobj\n";
    objs[6+2*i]=(6+2*i)+" 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+f2(PW)+" "+f2(PH)+
      "] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(5+2*i)+" 0 R >>\nendobj\n";
  }
  var total=4+2*n,out="%PDF-1.4\n",offs=[0];
  for(i=1;i<=total;i++){offs[i]=out.length;out+=objs[i];}
  var xref=out.length;
  out+="xref\n0 "+(total+1)+"\n0000000000 65535 f \n";
  for(i=1;i<=total;i++)out+=("0000000000"+offs[i]).slice(-10)+" 00000 n \n";
  out+="trailer\n<< /Size "+(total+1)+" /Root 1 0 R >>\nstartxref\n"+xref+"\n%%EOF";
  return out;
}

/* ═══ 11g. WORKING WITHOUT A SIGNAL ═══
   A service worker keeps a copy of the app on the phone. Online it
   always fetches the newest file first, so an edit you push appears
   by itself; offline it serves the copy. It only runs over https,
   which GitHub Pages gives you, so opening the file from Files has
   no worker and simply says so.                                    */
var SW_READY=false;
/* Installed as a Home Screen app, the app draws all the way to the edge
   of the glass and must keep the home-indicator strip clear itself. In a
   browser tab the toolbar already occupies it. Ask which one this is,
   rather than guessing with a fixed number of pixels. */
function fitShell(){
  var standalone=false;
  try{
    standalone=(window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)
      ||(window.matchMedia&&window.matchMedia("(display-mode: fullscreen)").matches)
      ||navigator.standalone===true;
  }catch(e){}
  document.documentElement.classList.toggle("in-browser",!standalone);
}
function watchShell(){
  fitShell();
  try{
    var mq=window.matchMedia("(display-mode: standalone)");
    if(mq.addEventListener)mq.addEventListener("change",fitShell);
    else if(mq.addListener)mq.addListener(fitShell);
  }catch(e){}
  window.addEventListener("resize",fitShell);
  window.addEventListener("orientationchange",fitShell);
}

function initSW(){
  if(!("serviceWorker" in navigator))return;
  if(location.protocol!=="https:"&&location.hostname!=="localhost")return;
  navigator.serviceWorker.register("./sw.js").then(function(){
    SW_READY=true;paintOffline();
  },function(){paintOffline();});
}
function offlineState(){
  if(location.protocol==="file:")
    return{warn:true,t:"Opened straight from a file, so there is no offline copy to keep \u2014 it is already all on the phone. Add it to your Home Screen from Safari to get the app icon."};
  if(!("serviceWorker" in navigator))
    return{warn:true,t:"This browser cannot store an offline copy. Open the app in Safari."};
  if(location.protocol!=="https:")
    return{warn:true,t:"Offline storage needs a secure address. Open the https version of the page."};
  if(!SW_READY&&!navigator.serviceWorker.controller)
    return{warn:true,t:"Setting up the offline copy. Stay online for a moment, then reopen the app."};
  return{warn:false,t:"Saved for offline use. The app opens with no signal, and picks up any update by itself next time you are online."};
}
/* the whole line, markup and all, so the page can be generated in one go */
function offlineHTML(){
  var st=offlineState();
  return '<div id="offline" class="offl'+(st.warn?" warn":"")+'">'+
    sym(st.warn?"warning":"check")+'<span>'+esc(st.t)+'</span></div>';
}
/* used only when the service worker finishes registering after the page
   has already been drawn */
function paintOffline(){
  var el=document.getElementById("offline");
  if(el)el.outerHTML=offlineHTML();
}
/* Pull the newest code down and restart. Data lives in localStorage,
   which is a different store from the cache, so it is never at risk. */
function refreshApp(done){
  if(!("serviceWorker" in navigator)||!navigator.serviceWorker.controller){
    location.reload();return;
  }
  try{
    navigator.serviceWorker.controller.postMessage("wipe");
    navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){return r.update();}));
    }).then(function(){
      setTimeout(function(){location.reload();},350);
    },function(){
      done&&done("Could not reach the web just now. Try again when you have a signal.");
    });
  }catch(e){done&&done("Could not reach the web just now. Try again when you have a signal.");}
}

/* ═══ 12. BINDINGS ═══ */
function bind(){

/* Any sheet can be flicked down to dismiss. Only starts when the sheet is
   scrolled to the top and you are not dragging inside a field. */
function closeSheets(){
  if(S.more){S.more=false;save();render();}
  else if(S.sheet){S.sheet=false;save();render();}
}
(function(){
  var el=null,y0=0,dragging=false;
  function sheetOf(t){
    while(t&&t!==document.body){if(t.classList&&t.classList.contains("sheet"))return t;t=t.parentNode;}
    return null;
  }
  document.addEventListener("touchstart",function(e){
    var tag=e.target&&e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA")return;
    var sh=sheetOf(e.target);
    if(!sh||sh.scrollTop>0)return;
    el=sh;y0=e.touches[0].clientY;dragging=true;el.style.transition="none";
  },{passive:true});
  document.addEventListener("touchmove",function(e){
    if(!dragging||!el)return;
    var dy=e.touches[0].clientY-y0;
    /* swiping up is a scroll, not a dismiss — let go of the gesture */
    if(dy<=0||el.scrollTop>0){
      dragging=false;el.style.transition="";el.style.transform="";el=null;return;
    }
    el.style.transform="translateY("+dy+"px)";
  },{passive:true});
  document.addEventListener("touchend",function(e){
    if(!dragging||!el)return;
    var dy=e.changedTouches[0].clientY-y0;
    el.style.transition="";el.style.transform="";el=null;dragging=false;
    if(dy>90)closeSheets();
  });
})();

/* ── swipe between the main tabs ──
   Writes to the same S.tab the bottom bar writes to: one navigation
   with two ways in, so the indicator can never disagree with the page.
   Vertical always wins an ambiguous gesture — scrolling is never stolen. */
var SWIPE_TABS=["home","plan","log","goals"];
var SWALLOW=false;
function noSwipeZone(t){
  while(t&&t!==document.body){
    if(t.classList&&(t.classList.contains("sheet")||t.classList.contains("shbg")||
       t.classList.contains("goalpick")||t.classList.contains("chiprow")))return true;
    t=t.parentNode;
  }
  return false;
}
function slideTo(tab,dir){
  var app=document.getElementById("app");
  if(!app){S.tab=tab;save();render();return;}
  app.style.transition="transform .15s var(--ease),opacity .15s var(--ease)";
  app.style.transform="translateX("+(dir>0?-30:30)+"px)";
  app.style.opacity="0";
  setTimeout(function(){
    S.delArm=null;S.more=false;S.tab=tab;save();render();
    appScrollTo(0);
    var a=document.getElementById("app");
    if(!a)return;
    a.style.transition="none";
    a.style.transform="translateX("+(dir>0?30:-30)+"px)";
    a.style.opacity="0";
    requestAnimationFrame(function(){
      a.style.transition="transform .24s var(--ease),opacity .24s var(--ease)";
      a.style.transform="translateX(0)";a.style.opacity="1";
      /* inline styles are cleared: a transform on #app would trap any
         fixed-position sheet opened later inside it */
      setTimeout(function(){a.style.transition="";a.style.transform="";a.style.opacity="";},280);
    });
  },150);
}
function navSwipe(dir){
  if(S.more||S.sheet||S.newg)return;              /* a sheet owns the gesture */
  if(MORE_PAGES.indexOf(S.tab)>-1)return;         /* sub-pages have a back link */
  var i=SWIPE_TABS.indexOf(S.tab);if(i<0)return;
  var j=i+dir;
  if(j<0)return;
  if(j>=SWIPE_TABS.length){
    if(dir>0){S.delArm=null;S.more=true;save();render();}  /* past Goals is More */
    return;
  }
  slideTo(SWIPE_TABS[j],dir);
}
/* ── the gesture itself ──
   The page you are leaving follows your finger and shrinks a little; the
   page you are arriving at is built underneath and slides in at exactly
   the same rate. Nothing is committed until you let go, so a change of
   mind costs nothing. */
var THRESH=.28;
var G={live:false,axis:null,x0:0,y0:0,t0:0,dir:0,target:null,W:360,p:0,armed:false,busy:false};
/* #app is the scrolling box now, so scroll questions go to it and not
   to the window, which no longer moves at all. */
function appEl(){return document.getElementById("app");}
function appScrollTop(){var a=appEl();return a?a.scrollTop:0;}
function appScrollTo(top,smooth){
  var a=appEl();if(!a)return;
  try{a.scrollTo({top:top,behavior:smooth?"smooth":"auto"});}
  catch(e){a.scrollTop=top;}
}

function gEls(){return{wrap:document.getElementById("slide"),page:document.getElementById("slideIn"),
  glow:document.getElementById("glow"),app:document.getElementById("app")};}
function gPrepare(dir){
  if(G.busy)return false;
  if(S.more||S.sheet||S.newg)return false;          /* a sheet owns the gesture */
  if(MORE_PAGES.indexOf(S.tab)>-1)return false;     /* sub-pages have a back link */
  var i=SWIPE_TABS.indexOf(S.tab);if(i<0)return false;
  var j=i+dir;if(j<0||j>=SWIPE_TABS.length)return false;
  var e=gEls();if(!e.wrap||!e.page||!e.app)return false;
  G.dir=dir;G.target=SWIPE_TABS[j];G.W=window.innerWidth||360;G.armed=false;G.p=0;
  e.page.innerHTML=pageHTML(G.target);
  e.wrap.classList.add("on");
  e.app.style.transition="none";e.page.style.transition="none";
  e.page.style.transform="translateX("+(dir>0?G.W:-G.W)+"px)";
  e.page.style.opacity="0";
  return true;
}
function gGlow(x,y,p){
  var g=gEls().glow;if(!g)return;
  g.style.transform="translate("+x+"px,"+y+"px)";
  g.style.opacity=String(Math.min(.5,p*.8));
  if(p>=THRESH)g.classList.add("armed");else g.classList.remove("armed");
}
function gFrame(dx,x,y){
  var e=gEls(),W=G.W,p=Math.max(0,Math.min(1,Math.abs(dx)/W));
  G.p=p;
  if(!G.target){                       /* nowhere to go: a little resistance, then back */
    e.app.style.transition="none";
    e.app.style.transform="translateX("+(dx*.16)+"px)";
    gGlow(x,y,p*.5);
    return;
  }
  e.app.style.transform="translateX("+(dx*.92)+"px) scale("+(1-.02*p).toFixed(4)+")";
  e.app.style.opacity=String(1-.34*p);
  e.page.style.transform="translateX("+((G.dir>0?W:-W)+dx*.92)+"px) scale("+(.98+.02*p).toFixed(4)+")";
  e.page.style.opacity=String(.35+.65*p);
  gGlow(x,y,p);
  if(p>=THRESH&&!G.armed){
    G.armed=true;
    if(navigator.vibrate){try{navigator.vibrate(9);}catch(v){}}
  }else if(p<THRESH)G.armed=false;
}
function gReset(){
  var e=gEls();
  if(e.app){e.app.style.transition="";e.app.style.transform="";e.app.style.opacity="";}
  if(e.wrap)e.wrap.classList.remove("on");
  if(e.page){e.page.style.transition="";e.page.style.transform="";e.page.style.opacity="";e.page.innerHTML="";}
  if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
  G.target=null;G.axis=null;G.busy=false;G.armed=false;G.p=0;
}
function gSettle(commit){
  var e=gEls(),W=G.W,dir=G.dir,tab=G.target;
  if(!e.app||!tab){                    /* the resistance case: just let it spring back */
    if(e.app){e.app.style.transition="transform .3s var(--spring)";e.app.style.transform="translateX(0)";}
    if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
    setTimeout(gReset,300);
    return;
  }
  G.busy=true;
  var mv="transform .28s var(--ease),opacity .28s var(--ease)";
  e.app.style.transition=mv;e.page.style.transition=mv;
  if(e.glow){e.glow.style.opacity="0";e.glow.classList.remove("armed");}
  if(commit){
    e.app.style.transform="translateX("+(dir>0?-W*.92:W*.92)+"px) scale(.98)";
    e.app.style.opacity="0";
    e.page.style.transform="translateX(0) scale(1)";
    e.page.style.opacity="1";
    setTimeout(function(){
      var a=gEls();
      if(a.app){a.app.style.transition="none";a.app.style.transform="";a.app.style.opacity="";}
      S.delArm=null;S.more=false;S.tab=tab;save();render();
      appScrollTo(0);
      gReset();
    },280);
  }else{
    e.app.style.transform="translateX(0) scale(1)";
    e.app.style.opacity="1";
    e.page.style.transform="translateX("+(dir>0?W:-W)+"px) scale(.98)";
    e.page.style.opacity="0";
    setTimeout(gReset,280);
  }
}
(function(){
  document.addEventListener("touchstart",function(e){
    G.live=false;G.axis=null;G.target=null;
    if(G.busy)return;
    if(e.touches.length!==1||DRAG.el||DRAG.on)return;
    var tag=e.target&&e.target.tagName;
    if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
    if(noSwipeZone(e.target))return;
    G.x0=e.touches[0].clientX;G.y0=e.touches[0].clientY;G.t0=Date.now();G.live=true;
  },{passive:true});

  document.addEventListener("touchmove",function(e){
    if(!G.live)return;
    if(e.touches.length!==1||DRAG.on){G.live=false;if(G.target)gSettle(false);return;}
    var t=e.touches[0],dx=t.clientX-G.x0,dy=t.clientY-G.y0;
    if(G.axis===null){
      if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
      /* once it reads as a scroll it stays a scroll for the whole gesture */
      G.axis=Math.abs(dx)>Math.abs(dy)*1.4?"x":"y";
      if(G.axis==="x")gPrepare(dx<0?1:-1);
    }
    if(G.axis!=="x")return;
    if(e.cancelable)e.preventDefault();
    gFrame(dx,t.clientX,t.clientY);
  },{passive:false});

  document.addEventListener("touchend",function(e){
    if(!G.live)return;
    G.live=false;
    if(G.axis!=="x"){gReset();return;}
    var t=e.changedTouches[0],dx=t.clientX-G.x0,dy=t.clientY-G.y0,dt=Date.now()-G.t0;
    SWALLOW=true;setTimeout(function(){SWALLOW=false;},350);
    if(G.target){
      var p=Math.min(1,Math.abs(dx)/G.W);
      gSettle(p>=THRESH||(dt<280&&Math.abs(dx)>56));   /* a quick flick counts */
      return;
    }
    gSettle(false);
    /* nothing was staged: the only move left is Goals \u2192 the More menu */
    if(dt<700&&Math.abs(dx)>64&&Math.abs(dx)>Math.abs(dy)*1.6)navSwipe(dx<0?1:-1);
  });
  document.addEventListener("touchcancel",function(){
    if(!G.live)return;
    G.live=false;gSettle(false);
  });

  /* a swipe that started on a button must not also press it */
  document.addEventListener("click",function(e){
    if(SWALLOW){SWALLOW=false;e.stopPropagation();e.preventDefault();}
  },true);
})();

/* The source chips are handled here rather than in bind(), so they keep
   working no matter how the view is re-rendered. */
document.addEventListener("click",function(e){
  var t=e.target;
  while(t&&t!==document.body&&!(t.dataset&&(t.dataset.p||t.dataset.pm||t.dataset.delnote)))t=t.parentNode;
  if(!t||!t.dataset)return;
  if(t.dataset.delnote){
    var id=+t.dataset.delnote;
    if(S.delArm===id){
      S.notes=(S.notes||[]).filter(function(n){return n.id!==id;});
      S.delArm=null;
      if(S.noteId===id){S.noteId=null;S.tab="tools";}
    }else S.delArm=id;
    save();updateViewDOM();return;
  }
  if(t.dataset.pm){S.payMethod=t.dataset.pm;save();updateViewDOM();return;}
  if(t.dataset.p){S.pick=t.dataset.p;save();updateViewDOM();}
});

/* Tap any number field and the whole value is selected, so you can type
   straight over it instead of deleting digit by digit. Attached once at
   document level, so it survives every re-render and covers every field. */
document.addEventListener("focusin",function(e){
  var t=e.target;
  if(!t||t.tagName!=="INPUT"||t.type!=="number")return;
  setTimeout(function(){try{t.select();}catch(err){}},0);
});
document.addEventListener("click",function(e){
  var t=e.target;
  if(!t||t.tagName!=="INPUT"||t.type!=="number")return;
  if(document.activeElement===t){try{t.select();}catch(err){}}
},true);

watchShell();
render();
initSW();
</script>
</body>
</html>
